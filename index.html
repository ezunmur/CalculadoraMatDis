    { nivel: 5, titulo: 'Tasa efectiva anual (TEA)', tag: 'Tasas equivalentes', dificultad: 'Medio' },
    { nivel: 6, titulo: 'Tasa nominal desde la TEA', tag: 'Tasas equivalentes', dificultad: 'Medio' },
    { nivel: 7, titulo: 'Valor presente', tag: 'Valor presente', dificultad: 'Difícil' },
    { nivel: 8, titulo: 'Anualidades · cuota fija', tag: 'Anualidades', dificultad: 'Difícil' },
    { nivel: 9, titulo: 'Mixto · tiempo total en años', tag: 'Problemas integradores', dificultad: 'Experto' },
    { nivel: 10, titulo: 'Problema de destino', tag: 'Problemas integradores', dificultad: 'Master' },
  ];

  const DIFICULTADES = [
    { id: 'facil', label: '🌟 Fácil', color: 'text-emerald-600' },
    { id: 'medio', label: '⚡ Medio', color: 'text-blue-600' },
    { id: 'dificil', label: '🔥 Difícil', color: 'text-orange-600' },
    { id: 'experto', label: '💎 Experto', color: 'text-purple-600' },
    { id: 'master', label: '👑 Master', color: 'text-red-600' },
  ];

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randChoice(arr) { return arr[randInt(0, arr.length - 1)]; }
  function round2(n) { return Math.round(n * 100) / 100; }

  function dentroDeToleranciaQ(valorUsuario, correcto, unidad) {
    if (!isFinite(valorUsuario)) return false;
    if (unidad === '$') { const tol = Math.max(1, Math.abs(correcto) * 0.01); return Math.abs(valorUsuario - correcto) <= tol; }
    if (unidad === '%') { return Math.abs(valorUsuario - correcto) <= 0.15; }
    if (unidad === 'periodos') { return Math.abs(valorUsuario - correcto) <= 0.3; }
    if (unidad === 'años') { return Math.abs(valorUsuario - correcto) <= 0.15; }
    return Math.abs(valorUsuario - correcto) <= Math.abs(correcto) * 0.02;
  }

  // ============================================================
  // GENERADORES DE PREGUNTAS REALES POR NIVEL
  // Cada función arma un problema con números aleatorios "redondos"
  // y calcula la respuesta con las mismas fórmulas del resto de la app.
  // ============================================================

  function nivel1_interesSimpleGanado() {
    const P = randInt(5, 50) * 1000;
    const r = randInt(4, 24);
    const t = randInt(2, 12);
    const interes = P * (r / 100) * t;
    return {
      categoria: 'Interés Simple',
      enunciado: `Depositas **${fmt(P)}** en una cuenta que paga una tasa de interés simple del **${r}% anual**. ¿Cuánto interés habrás ganado después de **${t} años**?`,
      unidad: '$',
      respuesta: round2(interes),
      solucion: [
        `Fórmula: I = P · r · t`,
        `I = ${fmt(P)} · ${(r / 100).toFixed(2)} · ${t}`,
        `I = ${fmt(interes)}`
      ],
    };
  }

  function nivel2_interesSimpleMontoFinal() {
    const P = randInt(5, 60) * 1000;
    const r = randInt(3, 20);
    const t = randInt(1, 10);
    const F = P * (1 + (r / 100) * t);
    return {
      categoria: 'Interés Simple',
      enunciado: `Un capital de **${fmt(P)}** se invierte a interés simple con una tasa del **${r}% anual** durante **${t} años**. ¿Cuál es el monto final?`,
      unidad: '$',
      respuesta: round2(F),
      solucion: [
        `Fórmula: F = P · (1 + r · t)`,
        `F = ${fmt(P)} · (1 + ${(r / 100).toFixed(2)} · ${t})`,
        `F = ${fmt(F)}`
      ],
    };
  }

  function nivel3_interesCompuestoMontoFinal() {
    const P = randInt(5, 60) * 1000;
    const r = randInt(3, 20);
    const t = randInt(2, 10);
    const F = P * Math.pow(1 + r / 100, t);
    return {
      categoria: 'Interés Compuesto',
      enunciado: `Un capital de **${fmt(P)}** se invierte a interés compuesto con una tasa del **${r}% anual** durante **${t} años**. ¿Cuál es el monto final?`,
      unidad: '$',
      respuesta: round2(F),
      solucion: [
        `Fórmula: F = P · (1 + r)ᵗ`,
        `F = ${fmt(P)} · (1 + ${(r / 100).toFixed(2)})^${t}`,
        `F = ${fmt(F)}`
      ],
    };
  }

  function nivel4_interesCompuestoPeriodos() {
    const P = randInt(5, 40) * 1000;
    const r = randInt(4, 18);
    const t = randInt(3, 12);
    const F = round2(P * Math.pow(1 + r / 100, t));
    const nExacto = Math.log(F / P) / Math.log(1 + r / 100);
    return {
      categoria: 'Interés Compuesto',
      enunciado: `Un capital de **${fmt(P)}** crece a interés compuesto con una tasa del **${r}% anual** hasta llegar a **${fmt(F)}**. ¿Cuántos años tomó ese crecimiento?`,
      unidad: 'periodos',
      respuesta: round2(nExacto),
      solucion: [
        `Fórmula: n = ln(F/P) / ln(1 + r)`,
        `n = ln(${fmt(F)}/${fmt(P)}) / ln(1 + ${(r / 100).toFixed(2)})`,
        `n ≈ ${nExacto.toFixed(2)} años`
      ],
    };
  }

  function nivel5_teaDesdeNominal() {
    const j = randInt(8, 36);
    const mOpciones = [2, 4, 12];
    const m = randChoice(mOpciones);
    const mLabel = m === 2 ? 'semestral' : m === 4 ? 'trimestral' : 'mensual';
    const tea = (Math.pow(1 + (j / 100) / m, m) - 1) * 100;
    return {
      categoria: 'Tasas Equivalentes',
      enunciado: `Un banco ofrece una tasa nominal del **${j}% anual con capitalización ${mLabel}**. ¿Cuál es la tasa efectiva anual (TEA)?`,
      unidad: '%',
      respuesta: round2(tea),
      solucion: [
        `Fórmula: TEA = (1 + j/m)ᵐ − 1`,
        `TEA = (1 + ${(j / 100).toFixed(4)}/${m})^${m} − 1`,
        `TEA ≈ ${tea.toFixed(2)}%`
      ],
    };
  }

  function nivel6_nominalDesdeTEA() {
    const tea = randInt(10, 40);
    const mOpciones = [2, 4, 12];
    const m = randChoice(mOpciones);
    const mLabel = m === 2 ? 'semestral' : m === 4 ? 'trimestral' : 'mensual';
    const j = (Math.pow(1 + tea / 100, 1 / m) - 1) * m * 100;
    return {
      categoria: 'Tasas Equivalentes',
      enunciado: `Sabiendo que la tasa efectiva anual (TEA) es del **${tea}%**, ¿cuál es la tasa nominal anual con capitalización ${mLabel} equivalente?`,
      unidad: '%',
      respuesta: round2(j),
      solucion: [
        `Fórmula: j = m · [(1 + TEA)^(1/m) − 1]`,
        `j = ${m} · [(1 + ${(tea / 100).toFixed(2)})^(1/${m}) − 1]`,
        `j ≈ ${j.toFixed(2)}%`
      ],
    };
  }

  function nivel7_valorPresente() {
    const F = randInt(10, 80) * 1000;
    const r = randInt(4, 20);
    const n = randInt(2, 10);
    const VP = F / Math.pow(1 + r / 100, n);
    return {
      categoria: 'Valor Presente',
      enunciado: `Quieres recibir **${fmt(F)}** dentro de **${n} años**. Si la tasa de descuento anual es del **${r}%**, ¿cuánto debes invertir hoy (valor presente)?`,
      unidad: '$',
      respuesta: round2(VP),
      solucion: [
        `Fórmula: VP = F / (1 + r)ⁿ`,
        `VP = ${fmt(F)} / (1 + ${(r / 100).toFixed(2)})^${n}`,
        `VP = ${fmt(VP)}`
      ],
    };
  }

  function nivel8_anualidadCuotaFija() {
    const P = randInt(5, 30) * 1000;
    const rAnual = randInt(12, 30);
    const n = randInt(6, 24);
    const r = rAnual / 100 / 12;
    const C = (P * r) / (1 - Math.pow(1 + r, -n));
    return {
      categoria: 'Anualidades',
      enunciado: `Un préstamo de **${fmt(P)}** se paga en **${n} cuotas mensuales iguales** (sistema francés), con una tasa nominal del **${rAnual}% anual** capitalizada mensualmente. ¿Cuál es el valor de cada cuota?`,
      unidad: '$',
      respuesta: round2(C),
      solucion: [
        `Fórmula: C = (P · r) / (1 − (1+r)⁻ⁿ), con r = tasa mensual`,
        `r = ${rAnual}% / 12 = ${(r * 100).toFixed(4)}% mensual`,
        `C = (${fmt(P)} · ${r.toFixed(6)}) / (1 − (1+${r.toFixed(6)})⁻${n})`,
        `C ≈ ${fmt(C)} por mes`
      ],
    };
  }

  function nivel9_mixtoTiempoEnAnios() {
    const P = randInt(5, 30) * 1000;
    const F = P * randChoice([2, 3, 4]);
    const r = randInt(6, 24);
    const nMeses = Math.log(F / P) / Math.log(1 + r / 100 / 12) ;
    const anios = nMeses / 12;
    return {
      categoria: 'Problemas Integradores',
      enunciado: `Un capital de **${fmt(P)}** se invierte a interés compuesto con una tasa nominal del **${r}% anual capitalizada mensualmente**. ¿Cuántos **años** (aproximados) tarda en convertirse en **${fmt(F)}**?`,
      unidad: 'años',
      respuesta: round2(anios),
      solucion: [
        `Tasa mensual: r = ${r}% / 12 = ${(r / 12).toFixed(4)}%`,
        `n (meses) = ln(F/P) / ln(1 + r) = ln(${F}/${P}) / ln(1 + ${(r / 100 / 12).toFixed(6)})`,
        `n ≈ ${nMeses.toFixed(1)} meses ≈ ${anios.toFixed(2)} años`
      ],
    };
  }

  function nivel10_problemaDeDestino() {
    const aporte = randInt(50, 400);
    const rAnual = randInt(4, 12);
    const n = randInt(12, 48);
    const r = rAnual / 100 / 12;
    const FV = aporte * ((Math.pow(1 + r, n) - 1) / r);
    return {
      categoria: 'Problemas Integradores',
      enunciado: `Ahorras **${fmt(aporte)} cada mes** en una cuenta que paga **${rAnual}% anual** (capitalización mensual), depositando al final de cada mes. ¿Cuánto tendrás acumulado después de **${n} meses**?`,
      unidad: '$',
      respuesta: round2(FV),
      solucion: [
        `Fórmula (valor futuro de una anualidad): FV = A · [(1+r)ⁿ − 1] / r`,
        `r = ${rAnual}% / 12 = ${(r * 100).toFixed(4)}% mensual`,
        `FV = ${fmt(aporte)} · [(1+${r.toFixed(6)})^${n} − 1] / ${r.toFixed(6)}`,
        `FV ≈ ${fmt(FV)}`
      ],
    };
  }

  const GENERADORES_POR_NIVEL = {
    1: nivel1_interesSimpleGanado,
    2: nivel2_interesSimpleMontoFinal,
    3: nivel3_interesCompuestoMontoFinal,
    4: nivel4_interesCompuestoPeriodos,
    5: nivel5_teaDesdeNominal,
    6: nivel6_nominalDesdeTEA,
    7: nivel7_valorPresente,
    8: nivel8_anualidadCuotaFija,
    9: nivel9_mixtoTiempoEnAnios,
    10: nivel10_problemaDeDestino,
  };

  const NIVELES_POR_TEMA = {
    interes_simple: [1, 2],
    interes_compuesto: [3, 4],
    tasas_equivalentes: [5, 6],
    valor_presente: [7],
    anualidades: [8],
    problemas_integradores: [9, 10],
  };

  function generarPreguntaNivel(nivel) {
    const gen = GENERADORES_POR_NIVEL[nivel] || nivel1_interesSimpleGanado;
    const base = gen();
    const dificultad = nivel <= 3 ? 'facil' : nivel <= 6 ? 'medio' : nivel <= 8 ? 'dificil' : nivel <= 9 ? 'experto' : 'master';
    return { tema: 'nivel', ...base, dificultad };
  }

  function nivelesParaDificultad(niveles, dificultad) {
    if (niveles.length === 1) return [niveles[0], niveles[0]];
    const facil = niveles[0], dificilN = niveles[niveles.length - 1];
    if (dificultad === 'facil') return [facil, facil];
    if (dificultad === 'master' || dificultad === 'experto') return [dificilN, dificilN];
    return [facil, dificilN];
  }

  const cambiarNivel = (n) => {
    setNivel(n);
    setPregunta(generarPreguntaNivel(n));
    setRespuestaTexto('');
    setVerificado(false);
    setCorrecto(false);
    setPuntaje({ aciertos: 0, total: 0 });
    setMostrarInforme(false);
  };

  const nuevaPregunta = () => {
    setPregunta(generarPreguntaNivel(nivel));
    setRespuestaTexto('');
    setVerificado(false);
    setCorrecto(false);
  };

  const verificar = () => {
    const valor = parseFloat(respuestaTexto.replace(',', '.'));
    const ok = dentroDeToleranciaQ(valor, pregunta.respuesta, pregunta.unidad);
    setCorrecto(ok);
    setVerificado(true);
    setPuntaje((p) => ({ aciertos: p.aciertos + (ok ? 1 : 0), total: p.total + 1 }));
    if (puntaje.total + 1 >= 5) setMostrarInforme(true);
  };

  const meta = NIVELES_META[nivel - 1] || NIVELES_META[0];

  // ---------- Evaluación personalizada ----------
  const [respuestaEvalTexto, setRespuestaEvalTexto] = useState('');
  const [evalVerificado, setEvalVerificado] = useState(false);
  const [evalCorrecto, setEvalCorrecto] = useState(false);

  const iniciarEvaluacion = () => {
    const preguntas = [];
    temasSeleccionados.forEach((temaId) => {
      const niveles = NIVELES_POR_TEMA[temaId] || [1];
      const [n1, n2] = nivelesParaDificultad(niveles, dificultadEval);
      preguntas.push(generarPreguntaNivel(n1));
      preguntas.push(generarPreguntaNivel(n2));
    });
    setPreguntasEval(preguntas);
    setPreguntaEvalIndex(0);
    setRespuestasEval([]);
    setEvaluacionCompletada(false);
    setRespuestaEvalTexto('');
    setEvalVerificado(false);
    setEvaluacionActiva(true);
  };

  const verificarEval = () => {
    const preguntaActual = preguntasEval[preguntaEvalIndex];
    const valor = parseFloat(respuestaEvalTexto.replace(',', '.'));
    const ok = dentroDeToleranciaQ(valor, preguntaActual.respuesta, preguntaActual.unidad);
    setEvalCorrecto(ok);
    setEvalVerificado(true);
  };

  const siguienteEval = () => {
    setRespuestasEval((prev) => [...prev, { pregunta: preguntasEval[preguntaEvalIndex], correcto: evalCorrecto }]);
    setRespuestaEvalTexto('');
    setEvalVerificado(false);
    if (preguntaEvalIndex + 1 >= preguntasEval.length) {
      setEvaluacionCompletada(true);
    } else {
      setPreguntaEvalIndex((i) => i + 1);
    }
  };

  const reiniciarEvaluacion = () => {
    setEvaluacionActiva(false);
    setEvaluacionCompletada(false);
    setPreguntasEval([]);
    setPreguntaEvalIndex(0);
    setRespuestasEval([]);
  };

  const tutorialSteps = [
    { index: 0, titulo: '📝 Quizzes y Evaluaciones', texto: 'Practica por niveles (1 a 10, con dificultad creciente) o arma una evaluación personalizada por tema.', consejo: 'Cada nivel genera preguntas nuevas con números aleatorios cada vez.' },
    { index: 1, titulo: '✅ Verifica tu respuesta', texto: 'Escribe tu respuesta y presiona "Verificar". Se acepta un pequeño margen de error por redondeo.', consejo: 'Si fallas, la solución paso a paso te muestra exactamente dónde revisar.' },
    { index: 2, titulo: '📊 Evaluación personalizada', texto: 'Selecciona los temas que quieres evaluar y la dificultad; se generan 2 preguntas por tema.', consejo: 'Al terminar verás un informe con tu efectividad por pregunta.' },
  ];

  return (
    <div className="space-y-5">
      <ControlPanel 
        dashboardOn={dashboardOn} setDashboardOn={setDashboardOn}
        tutorialOn={tutorialOn} setTutorialOn={setTutorialOn}
        discreteOn={discreteOn} setDiscreteOn={setDiscreteOn}
        onReset={() => { setNivel(1); setPregunta(generarPreguntaNivel(1)); setPuntaje({ aciertos: 0, total: 0 }); setModo('quiz'); }} 
      />

      {discreteOn && (
        <DiscreteMathDisplay 
          formula={<>Σ a<Sub>i</Sub> · Serie Geométrica</>}
          variables={[{ simbolo: 'Σ', desc: 'Sumatoria' }, { simbolo: 'aᵢ', desc: 'Término i-ésimo' }]}
          recurrence="Sₙ = a₁ · (1−qⁿ)/(1−q)"
          explanation="Los quizzes aplican conceptos de series y sumatorias."
          tipo="sumatoria"
        />
      )}

      <div className="flex flex-col sm:flex-row gap-2 cx-bg-surface p-2 rounded-lg border cx-border-border">
        <button onClick={() => setModo('quiz')} className={`flex-1 py-2 rounded-md text-sm font-semibold transition-colors ${modo === 'quiz' ? 'text-white' : 'cx-text-text-secondary cx-bg-surface'}`} style={{ background: modo === 'quiz' ? 'var(--accent-primary)' : undefined }}>📝 Práctica por niveles</button>
        <button onClick={() => setModo('evaluacion')} className={`flex-1 py-2 rounded-md text-sm font-semibold transition-colors ${modo === 'evaluacion' ? 'text-white' : 'cx-text-text-secondary cx-bg-surface'}`} style={{ background: modo === 'evaluacion' ? 'var(--accent-primary)' : undefined }}>📊 Evaluación personalizada</button>
      </div>

      {modo === 'quiz' ? (
        <>
          <div><div className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold mb-2">Nivel de dificultad</div>
            <div className="flex flex-wrap gap-1.5">{NIVELES_META.map((m) => (<PillButton key={m.nivel} active={nivel === m.nivel} onClick={() => cambiarNivel(m.nivel)}>{m.nivel}</PillButton>))}</div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <StatCard label="Nivel actual" value={`${nivel} · ${meta.tag}`} accent="blue" />
            <StatCard label="Aciertos" value={`${puntaje.aciertos} / ${puntaje.total}`} accent="teal" />
            <StatCard label="Efectividad" value={puntaje.total ? `${Math.round((puntaje.aciertos / puntaje.total) * 100)}%` : '—'} accent="coral" />
          </div>
          {mostrarInforme && puntaje.total > 0 && (
            <div className="cx-bg-accent-primary-bg border cx-border-accent-primary/30 rounded-lg p-4">
              <div className="flex items-center gap-2 mb-2"><Check size={16} className="cx-text-accent-green-text" /><span className="text-sm font-semibold cx-text-text-primary">📊 Informe de progreso</span></div>
              <div className="flex flex-wrap gap-4 text-sm"><span className="cx-text-text-secondary">Aciertos: <strong>{puntaje.aciertos}</strong></span><span className="cx-text-text-secondary">Total: <strong>{puntaje.total}</strong></span><span className="cx-text-text-secondary">Efectividad: <strong>{Math.round((puntaje.aciertos / puntaje.total) * 100)}%</strong></span><span className="cx-text-text-secondary">Nivel: <strong>{meta.dificultad}</strong></span></div>
              <button onClick={() => setMostrarInforme(false)} className="mt-2 text-xs cx-text-accent-primary font-semibold">Ocultar informe</button>
            </div>
          )}
          {pregunta ? (
            <div className="cx-bg-surface border cx-border-border rounded-lg p-4 sm:p-5 space-y-4">
              <div className="flex items-center gap-2 cx-text-accent-primary-text font-semibold text-xs uppercase tracking-wide"><Lightbulb size={14} /> {pregunta.categoria} · Nivel {nivel} · {meta.dificultad}</div>
              <p className="text-[15px] cx-text-text-strong-gray leading-relaxed"><TextoConNegritas texto={pregunta.enunciado} /></p>
              <div className="flex flex-col sm:flex-row gap-3 sm:items-end">
                <label className="flex-1 flex flex-col gap-1">
                  <span className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold">Tu respuesta ({pregunta.unidad})</span>
                  <input type="text" inputMode="decimal" value={respuestaTexto} onChange={(e) => setRespuestaTexto(e.target.value)} placeholder="Ej. 12500.50" className="w-full px-3 py-2.5 border-2 cx-border-border rounded-lg outline-none cx-focus-border-accent-primary cx-bg-surface cx-text-text-primary" style={{ fontFamily: "'JetBrains Mono', monospace" }} onKeyDown={(e) => e.key === 'Enter' && verificar()} />
                </label>
                <div className="flex flex-wrap gap-2">
                  <button onClick={verificar} disabled={respuestaTexto.trim() === ''} className="px-4 py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40" style={{ background: 'var(--accent-primary)' }}>Verificar</button>
                  <button onClick={nuevaPregunta} className="px-4 py-2.5 rounded-lg text-sm font-semibold cx-bg-surface cx-text-text-secondary border-2 cx-border-border cx-hover-border-border-hover flex items-center gap-1.5"><RotateCcw size={14} /> Nueva</button>
                </div>
              </div>
              {verificado && (
                <div className={`rounded-lg p-4 space-y-2 ${correcto ? 'cx-bg-accent-green-bg' : 'cx-bg-accent-coral-bg'}`}>
                  <div className={`flex items-center gap-2 font-semibold text-sm ${correcto ? 'cx-text-accent-green-text' : 'cx-text-accent-coral-text'}`}>{correcto ? <Check size={16} /> : <X size={16} />}{correcto ? '¡Correcto!' : 'No es correcto todavía.'}</div>
                  <p className="text-sm cx-text-text-strong-gray">Respuesta esperada: <strong>{fmt(pregunta.respuesta)}</strong></p>
                  <div className="space-y-1 pt-1 border-t" style={{ borderColor: 'var(--border)' }}>{pregunta.solucion.map((linea, i) => (<p key={i} className="text-xs cx-text-text-secondary leading-relaxed">{linea}</p>))}</div>
                </div>
              )}
            </div>
          ) : <div className="text-center py-8 cx-text-text-muted">Cargando pregunta...</div>}
          <p className="text-[11px] cx-text-text-faint">Cada nivel genera preguntas nuevas con números aleatorios.</p>
        </>
      ) : (
        <div className="cx-bg-surface border cx-border-border rounded-lg p-5 space-y-4">
          <h3 className="text-base font-semibold cx-text-text-primary" style={{ fontFamily: "'Fraunces', sans-serif" }}>📊 Configura tu evaluación</h3>
          <p className="text-sm cx-text-text-secondary">Selecciona los temas que quieres evaluar y la dificultad.</p>
          <div>
            <div className="flex items-center justify-between mb-2 flex-wrap">
              <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Temas a evaluar</span>
              <button onClick={() => { if (temasSeleccionados.length === TEMAS.length) setTemasSeleccionados([]); else setTemasSeleccionados(TEMAS.map(t => t.id)); }} className="text-xs cx-text-accent-primary font-semibold">{temasSeleccionados.length === TEMAS.length ? 'Deseleccionar todos' : 'Seleccionar todos'}</button>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              {TEMAS.map((tema) => (
                <label key={tema.id} className="flex items-center gap-2 p-2 rounded-lg cx-bg-surface-alt border cx-border-border cursor-pointer hover:cx-border-border-hover transition-colors">
                  <input type="checkbox" checked={temasSeleccionados.includes(tema.id)} onChange={() => { if (temasSeleccionados.includes(tema.id)) setTemasSeleccionados(temasSeleccionados.filter(t => t !== tema.id)); else setTemasSeleccionados([...temasSeleccionados, tema.id]); }} className="w-4 h-4 accent-emerald-600" />
                  <span className="text-xs cx-text-text-secondary">{tema.icon} {tema.label}</span>
                </label>
              ))}
            </div>
          </div>
          <div>
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Dificultad</span>
            <div className="flex flex-wrap gap-2 mt-1">
              {DIFICULTADES.map((d) => (
                <button key={d.id} onClick={() => setDificultadEval(d.id)} className={`px-3 py-1.5 rounded-md text-xs font-semibold border-2 transition-colors ${dificultadEval === d.id ? 'border-accent-primary text-white' : 'cx-border-border cx-text-text-secondary'}`} style={{ background: dificultadEval === d.id ? 'var(--accent-primary)' : undefined }}>{d.label}</button>
              ))}
            </div>
          </div>
          <button onClick={() => { if (temasSeleccionados.length === 0) { return; } iniciarEvaluacion(); }} disabled={temasSeleccionados.length === 0} className="w-full py-3 rounded-lg text-sm font-semibold text-white disabled:opacity-40 transition-opacity" style={{ background: 'var(--accent-primary)' }}>{temasSeleccionados.length === 0 ? 'Selecciona al menos un tema' : `Iniciar evaluación (${temasSeleccionados.length * 2} preguntas)`}</button>

          {evaluacionActiva && !evaluacionCompletada && preguntasEval[preguntaEvalIndex] && (
            <div className="cx-bg-surface-alt border cx-border-border rounded-lg p-4 sm:p-5 space-y-4 mt-2">
              <div className="flex items-center justify-between flex-wrap gap-2">
                <div className="flex items-center gap-2 cx-text-accent-primary-text font-semibold text-xs uppercase tracking-wide">
                  <Lightbulb size={14} /> {preguntasEval[preguntaEvalIndex].categoria} · Pregunta {preguntaEvalIndex + 1} de {preguntasEval.length}
                </div>
                <button onClick={reiniciarEvaluacion} className="text-xs cx-text-text-muted font-semibold hover:cx-text-accent-coral-text">Cancelar</button>
              </div>
              <div className="w-full h-1.5 rounded-full cx-bg-surface overflow-hidden">
                <div className="h-full" style={{ width: `${((preguntaEvalIndex) / preguntasEval.length) * 100}%`, background: 'var(--accent-primary)' }} />
              </div>
              <p className="text-[15px] cx-text-text-strong-gray leading-relaxed"><TextoConNegritas texto={preguntasEval[preguntaEvalIndex].enunciado} /></p>
              <div className="flex flex-col sm:flex-row gap-3 sm:items-end">
                <label className="flex-1 flex flex-col gap-1">
                  <span className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold">Tu respuesta ({preguntasEval[preguntaEvalIndex].unidad})</span>
                  <input type="text" inputMode="decimal" value={respuestaEvalTexto} onChange={(e) => setRespuestaEvalTexto(e.target.value)} placeholder="Ej. 12500.50" className="w-full px-3 py-2.5 border-2 cx-border-border rounded-lg outline-none cx-focus-border-accent-primary cx-bg-surface cx-text-text-primary" style={{ fontFamily: "'JetBrains Mono', monospace" }} onKeyDown={(e) => e.key === 'Enter' && (evalVerificado ? siguienteEval() : verificarEval())} />
                </label>
                {!evalVerificado ? (
                  <button onClick={verificarEval} disabled={respuestaEvalTexto.trim() === ''} className="px-4 py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40" style={{ background: 'var(--accent-primary)' }}>Verificar</button>
                ) : (
                  <button onClick={siguienteEval} className="px-4 py-2.5 rounded-lg text-sm font-semibold text-white flex items-center gap-1.5" style={{ background: 'var(--accent-green)' }}>
                    {preguntaEvalIndex + 1 >= preguntasEval.length ? 'Ver resultado' : 'Siguiente'} <ArrowRight size={14} />
                  </button>
                )}
              </div>
              {evalVerificado && (
                <div className={`rounded-lg p-4 space-y-2 ${evalCorrecto ? 'cx-bg-accent-green-bg' : 'cx-bg-accent-coral-bg'}`}>
                  <div className={`flex items-center gap-2 font-semibold text-sm ${evalCorrecto ? 'cx-text-accent-green-text' : 'cx-text-accent-coral-text'}`}>{evalCorrecto ? <Check size={16} /> : <X size={16} />}{evalCorrecto ? '¡Correcto!' : 'No es correcto.'}</div>
                  <p className="text-sm cx-text-text-strong-gray">Respuesta esperada: <strong>{preguntasEval[preguntaEvalIndex].unidad === '%' || preguntasEval[preguntaEvalIndex].unidad === 'años' || preguntasEval[preguntaEvalIndex].unidad === 'periodos' ? preguntasEval[preguntaEvalIndex].respuesta : fmt(preguntasEval[preguntaEvalIndex].respuesta)}{preguntasEval[preguntaEvalIndex].unidad === '%' ? '%' : ''}</strong></p>
                  <div className="space-y-1 pt-1 border-t" style={{ borderColor: 'var(--border)' }}>{preguntasEval[preguntaEvalIndex].solucion.map((linea, i) => (<p key={i} className="text-xs cx-text-text-secondary leading-relaxed">{linea}</p>))}</div>
                </div>
              )}
            </div>
          )}

          {evaluacionCompletada && (
            <div className="cx-bg-accent-primary-bg border cx-border-accent-primary/30 rounded-lg p-5 space-y-3 mt-2">
              <div className="flex items-center gap-2"><GraduationCap size={18} className="cx-text-accent-primary" /><span className="font-semibold text-[15px] cx-text-text-primary" style={{ fontFamily: "'Fraunces', sans-serif" }}>Resultado de tu evaluación</span></div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <StatCard label="Aciertos" value={`${respuestasEval.filter((r) => r.correcto).length} / ${respuestasEval.length}`} accent="teal" />
                <StatCard label="Efectividad" value={`${Math.round((respuestasEval.filter((r) => r.correcto).length / respuestasEval.length) * 100)}%`} accent="coral" />
                <StatCard label="Temas evaluados" value={String(temasSeleccionados.length)} accent="blue" />
              </div>
              <div className="space-y-1.5 pt-2 border-t cx-border-border">
                {respuestasEval.map((r, i) => (
                  <div key={i} className="flex items-center gap-2 text-xs cx-text-text-secondary">
                    {r.correcto ? <Check size={13} className="cx-text-accent-green-text flex-shrink-0" /> : <X size={13} className="cx-text-accent-coral-text flex-shrink-0" />}
                    <span>{r.pregunta.categoria}</span>
                  </div>
                ))}
              </div>

                <RotateCcw size={14} /> Nueva evaluación
              </button>
            </div>
          )}
        </div>
      )}

      {tutorialOn && (
        <TutorialStep step={tutorialSteps[tutorialStep]} total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)} />
      )}
    </div>
  );
}

    if (cardEl && shellRef.current) {
      const c = shellRef.current.getBoundingClientRect();
      const r = cardEl.getBoundingClientRect();
      setOrigin({ x: ((r.left + r.width / 2 - c.left) / c.width) * 100, y: ((r.top + r.height / 2 - c.top) / c.height) * 100 });
    }
    setLeaving(true);
    setTimeout(() => {
      setFolder(key);
      setLeaving(false);
      setEntering(true);
      requestAnimationFrame(() => requestAnimationFrame(() => setEntering(false)));
    }, TRANSITION_MS);
  };

  const folderDef = FOLDERS.find((f) => f.key === folder);
  const contentStyle = {
    transformOrigin: `${origin.x}% ${origin.y}%`,
    opacity: leaving || entering ? 0 : 1,
    transform: leaving ? 'scale(0.93)' : entering ? (folder ? 'scale(0.8)' : 'scale(0.96)') : undefined,
    transition: 'opacity 190ms ease-out, transform 190ms ease-out',
  };

  return (
    <div className="finapp-root min-h-screen w-full print:hidden" data-theme={theme} style={{ background: 'radial-gradient(1100px 500px at 85% -10%, rgba(31,77,58,0.07), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(138,109,31,0.06), transparent 55%), var(--bg)' }}>
      {!splashDone && <SplashScreen fadingOut={!booting} />}
      <style>{APP_STYLES}</style>
      <div className="max-w-5xl mx-auto px-4 py-6 sm:py-8">
        <header className="relative overflow-hidden rounded-lg mb-5 px-5 py-6 sm:px-8 sm:py-8" style={{ background: 'linear-gradient(135deg, #1F4D3A 0%, #2A6349 55%, #163A2B 100%)' }}>
          <div className="absolute inset-0 opacity-[0.05] pointer-events-none" style={{ backgroundImage: 'repeating-linear-gradient(to bottom, transparent, transparent 27px, #fff 27px, #fff 28px)' }} />
          <div className="relative flex items-center justify-between gap-3 flex-wrap">
            <button onClick={volver} className="inline-flex items-center gap-2 text-[#D9C98A] text-xs uppercase tracking-[0.15em] font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3 py-1 transition-colors">
              <Calculator size={14} /> Proyecto de Matemáticas Discretas · Finanzas
            </button>
            <div className="flex items-center gap-2">
              <button onClick={toggleTheme} className="inline-flex items-center gap-1.5 text-white text-xs font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3.5 py-1.5 transition-colors">
                {theme === 'dark' ? <Sun size={13} /> : <Moon size={13} />}
                {theme === 'dark' ? 'Claro' : 'Oscuro'}
              </button>
              <button onClick={() => setAcercaDeOpen(true)} className="inline-flex items-center gap-1.5 text-white text-xs font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3.5 py-1.5 transition-colors">
                <Info size={13} /> Acerca de
              </button>
            </div>
          </div>
          <div className="absolute left-0 right-0 bottom-0">
            <div className="h-[3px]" style={{ background: '#D9C98A', opacity: 0.9 }} />
            <div className="h-px mt-[3px]" style={{ background: '#D9C98A', opacity: 0.5 }} />
          </div>
        </header>

        {acercaDeOpen && (
          <Modal onClose={() => setAcercaDeOpen(false)}>
            <div className="flex items-center gap-2 cx-text-accent-primary font-semibold text-sm mb-1" style={{ fontFamily: "'Fraunces', sans-serif" }}><Calculator size={16} /> Proyecto de Matemáticas Discretas</div>
            <h3 className="text-2xl mb-3" style={{ fontFamily: "'Fraunces', sans-serif", fontWeight: 600, color: 'var(--text-primary)' }}>PROTOTIPO EDUCATIVO ESPOL</h3>
            <p className="text-sm leading-relaxed" style={{ color: 'var(--text-secondary)' }}>Organizado por carpetas, con modo tutorial, dashboard y matemáticas discretas.</p>
            <p className="text-xs mt-4 pt-4 border-t" style={{ color: 'var(--text-faint)', borderColor: 'var(--border)' }}>Prototipo educativo · cifras ilustrativas.</p>
          </Modal>
        )}

        <div ref={shellRef} className="cx-bg-surface rounded-lg border cx-border-border p-4 sm:p-6 shadow-lg shadow-black/[0.08] relative">
          <div style={contentStyle}>
            {folder === null ? (
              <GameMenu onSelect={abrirFolder} />
            ) : (
              <div>
                <FolderHeader folder={folderDef} onBack={volver} />
                {folder === 'interes' && <InteresTab />}
                {folder === 'tasas' && <TasasEquivalentesTab />}
                {folder === 'anualidades' && <AnualidadesTab />}
                {folder === 'simulador' && <SimuladorTab />}
                {folder === 'quizzes' && <QuizTab />}
                {folder === 'formulario' && <FormularioTab />}
              </div>
            )}
          </div>
        </div>

        <footer className="mt-8 pt-6 border-t cx-border-border text-center">
          <img src={ESPOL_LOGO} alt="ESPOL" className="espol-logo w-9 mx-auto mb-3 opacity-60" />
          <div className="inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide cx-text-text-secondary mb-1.5">
            <AlertTriangle size={12} /> Prototipo educativo — Esto NO es asesoría financiera
          </div>
          <p className="text-[11px] cx-text-text-faint max-w-xl mx-auto leading-relaxed">
            Desarrollado con fines académicos para Matemáticas Discretas, Escuela Superior Politécnica del Litoral (ESPOL).
          </p>
        </footer>
      </div>
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<FinanzasApp />);
    </script>
</body>
</html>
