import React, { useState, useMemo, useRef, useEffect } from 'react';

  ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip,

const FRASES_CARGA = [
  'El interés compuesto no descansa, ni siquiera los domingos.',
  'Calculando cuánto cuesta el "cómprate algo bonito".',
  'Convirtiendo excusas en tasas efectivas anuales.',
  'Sin comisiones ocultas, esta vez sí.',
  'Amortizando tus dudas, una cuota a la vez.',
  'El capital inicial también fue joven alguna vez.',
];

// ---------- Utilidades ----------
const fmt = (n) => {
  if (!isFinite(n)) return '—';
  return '$' + n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtInt = (n) => n.toLocaleString('es-EC', { maximumFractionDigits: 0 });

const monthsToYears = (m) => {
  if (!isFinite(m)) return '—';
  const y = Math.floor(m / 12);
  const rem = Math.round(m % 12);
  if (y === 0) return `${rem} ${rem === 1 ? 'mes' : 'meses'}`;
  if (rem === 0) return `${y} ${y === 1 ? 'año' : 'años'}`;
  return `${y} ${y === 1 ? 'año' : 'años'} y ${rem} ${rem === 1 ? 'mes' : 'meses'}`;
};

const TEMPORALIDADES = [
  { key: 'anual', label: 'Anual', m: 1, periodo: 'año', periodoPlural: 'años' },
  { key: 'semestral', label: 'Semestral', m: 2, periodo: 'semestre', periodoPlural: 'semestres' },
  { key: 'trimestral', label: 'Trimestral', m: 4, periodo: 'trimestre', periodoPlural: 'trimestres' },
  { key: 'mensual', label: 'Mensual', m: 12, periodo: 'mes', periodoPlural: 'meses' },
  { key: 'diaria', label: 'Diaria', m: 365, periodo: 'día', periodoPlural: 'días' },
  { key: 'continua', label: 'Continua', m: null, periodo: 'año', periodoPlural: 'años' },
];
const getTemporalidad = (key) => TEMPORALIDADES.find((t) => t.key === key) || TEMPORALIDADES[3];

function tasaPeriodica(tasaNominalPct, temporalidadKey) {
  const t = getTemporalidad(temporalidadKey);
  if (t.key === 'continua') return null;
  return (tasaNominalPct / 100) / t.m;
}

function calcularTEADesdeOrigen(tasaPct, tipoOrigen, temporalidadOrigenKey) {
  const t = getTemporalidad(temporalidadOrigenKey);
  const tasaFrac = tasaPct / 100;
  if (t.key === 'continua') return Math.exp(tasaFrac) - 1;
  const iOrigen = tipoOrigen === 'nominal' ? tasaFrac / t.m : tasaFrac;
  return Math.pow(1 + iOrigen, t.m) - 1;
}
function calcularTasaDestinoDesdeTEA(tea, tipoDestino, temporalidadDestinoKey) {
  const t = getTemporalidad(temporalidadDestinoKey);
  if (t.key === 'continua') return Math.log(1 + tea) * 100;
  const iDestino = Math.pow(1 + tea, 1 / t.m) - 1;
  return (tipoDestino === 'nominal' ? iDestino * t.m : iDestino) * 100;
}

function calcularContinuo(P, tasaNominalPct, anios) {
  const r = tasaNominalPct / 100;
  const F = P * Math.exp(r * anios);
  return { F, interes: F - P };
}

function calcularAmortizacion(P, r, n, sistema) {
  const rows = [];
  let saldo = P;

  if (sistema === 'francesa') {
    const pago = r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n));
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      let capital = pago - interes;
      let saldoFinal = saldo - capital;
      if (t === n) { capital += saldoFinal; saldoFinal = 0; }
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  } else if (sistema === 'alemana') {
    const capitalFijo = P / n;
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const pago = capitalFijo + interes;
      const saldoFinal = Math.max(0, saldo - capitalFijo);
      rows.push({ t, saldoInicial: saldo, pago, interes, capital: capitalFijo, saldoFinal });
      saldo = saldoFinal;
    }
  } else {
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const capital = t === n ? saldo : 0;
      const pago = interes + capital;
      const saldoFinal = saldo - capital;
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0) };
}

function calcularSimple(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = P * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function calcularCompuesto(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = saldo * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function simularCamino({ tipo, monto, base, tasaAnual = 0, extraMensual = 0, extrasUnicos = [], maxMeses = 1200 }) {
  const r = tasaAnual / 100 / 12;
  const aporteExtra = (m) =>
    extraMensual + extrasUnicos.reduce((acc, e) => acc + (m === e.mes ? (e.monto || 0) : 0), 0);

  if (tipo === 'alcancia') {
    let saldo = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      saldo += base + aporteExtra(m);
      serie.push({ mes: m, saldo: Math.min(saldo, monto) });
      if (saldo >= monto) return { meses: m, totalInteres: 0, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: 0, serie, alcanzado: false };
  }

  if (tipo === 'ahorroSimple') {
    let principal = 0, interesAcum = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      principal += base + aporteExtra(m);
      interesAcum += principal * r;
      const saldo = principal + interesAcum;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: interesAcum, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: interesAcum, serie, alcanzado: false };
  }

  if (tipo === 'ahorroCompuesto') {
    let saldo = 0, aportado = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      const aporte = base + aporteExtra(m);
      saldo = saldo * (1 + r) + aporte;
      aportado += aporte;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: saldo - aportado, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: saldo - aportado, serie, alcanzado: false };
  }

  let saldo = monto, interesTotal = 0;
  const serie = [{ mes: 0, saldo }];
  const hayExtraUnico = extrasUnicos.some((e) => (e.monto || 0) > 0);
  if (base + extraMensual <= saldo * r && !hayExtraUnico) {
    return { meses: Infinity, totalInteres: Infinity, serie, nuncaPaga: true };
  }
  for (let m = 1; m <= maxMeses; m++) {
    const interes = saldo * r;
    interesTotal += interes;
    const pago = base + aporteExtra(m);
    saldo = saldo + interes - pago;
    if (saldo < 0) saldo = 0;
    serie.push({ mes: m, saldo });
    if (saldo <= 0) return { meses: m, totalInteres: interesTotal, serie, nuncaPaga: false };
  }
  return { meses: Infinity, totalInteres: interesTotal, serie, nuncaPaga: false };
}

function Modal({ onClose, children, wide }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(31,41,55,0.55)' }} onClick={onClose}>
      <div className={`cx-bg-surface rounded-lg shadow-xl w-full ${wide ? 'max-w-2xl' : 'max-w-lg'} max-h-[88vh] overflow-y-auto relative`} style={{ backgroundColor: 'var(--surface)', color: 'var(--text-primary)' }} onClick={(e) => e.stopPropagation()}>
        <button onClick={onClose} className="absolute top-4 right-4 p-2 rounded-full cx-bg-surface-hover-2 cx-hover-bg-surface-hover-3 cx-text-text-secondary z-10"><X size={18} /></button>
        <div className="p-6 sm:p-8">{children}</div>
      </div>
    </div>
  );
}

function Var({ children }) { return <i style={{ fontStyle: 'italic' }}>{children}</i>; }
function Sub({ children }) { return <sub style={{ fontSize: '0.72em' }}>{children}</sub>; }
function Pow({ base, exp }) { return <span className="whitespace-nowrap">{base}<sup style={{ fontSize: '0.68em', marginLeft: 1 }}>{exp}</sup></span>; }
function Frac({ num, den }) {
  return (
    <span className="inline-flex flex-col items-center align-middle text-center mx-1" style={{ verticalAlign: 'middle', lineHeight: 1.05, fontSize: '0.88em' }}>
      <span className="px-1.5 pb-0.5" style={{ borderBottom: '1.5px solid currentColor' }}>{num}</span>
      <span className="px-1.5 pt-0.5">{den}</span>
    </span>
  );
}
function MathBlock({ children }) { return <div className="text-lg sm:text-xl cx-text-text-primary text-center px-2 py-1.5" style={{ fontFamily: "'STIX Two Text', 'Cambria Math', 'Times New Roman', serif" }}>{children}</div>; }

function ListaVariables({ items, compact }) {

    <dl className={`grid ${compact ? 'grid-cols-1' : 'sm:grid-cols-2'} gap-x-4 gap-y-1.5 mt-2`}>
      {items.map((v) => (
        <div key={v.simbolo} className="flex items-baseline gap-2">
          <dt className="text-[15px] cx-text-accent-primary flex-shrink-0" style={{ fontFamily: "'STIX Two Text', 'Cambria Math', 'Times New Roman', serif" }}><Var>{v.simbolo}</Var></dt>
          <dd className="text-[12.5px] cx-text-text-secondary leading-snug">{v.desc}</dd>
        </div>
      ))}
    </dl>
  );
}

function TextoConNegritas({ texto }) {
  const partes = texto.split('**');
  return <>{partes.map((p, i) => i % 2 === 1 ? <strong key={i} style={{ color: 'var(--text-primary)' }}>{p}</strong> : <span key={i}>{p}</span>)}</>;
}

function PillButton({ active, onClick, children }) {

      {children}
    </button>
  );
}

function Field({ label, suffix, value, onChange, min, step }) {
  const [texto, setTexto] = useState(value === 0 ? '' : String(value));
  const manejarCambio = (e) => {
    const t = e.target.value; setTexto(t); const num = parseFloat(t); onChange(isNaN(num) ? 0 : num);
  };
  return (
    <label className="flex flex-wrap items-end gap-x-2 gap-y-0.5 border-b-2 cx-border-border cx-focusw-border-accent-primary min-w-0 pb-1">
      <span className="text-[11px] cx-text-text-muted font-medium whitespace-nowrap">{label}</span>
      <input type="number" value={texto} min={min} step={step} onChange={manejarCambio} placeholder="-,--" className="flex-1 min-w-[64px] text-right px-0.5 outline-none bg-transparent cx-text-text-primary" style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '1.1rem', fontWeight: 600, letterSpacing: '-0.01em' }} />
      {suffix && <span className="text-sm cx-text-text-faint flex-shrink-0">{suffix}</span>}
    </label>
  );
}

  return (
    <label className="flex flex-col gap-1 min-w-0">
      <span className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold">{label}</span>
      <select value={value} onChange={(e) => onChange(e.target.value)} className="border-2 cx-border-border rounded-lg px-3 py-2.5 cx-bg-surface cx-text-text-primary text-sm" style={{ backgroundColor: 'var(--surface)', color: 'var(--text-primary)' }}>
        {options.map((op) => <option key={op.value} value={op.value}>{op.label}</option>)}

  );
}

  };
  return (
    <div className={`px-4 py-3 rounded-lg ${colors[accent] || colors.blue}`}>
      <div className="text-[10.5px] font-medium opacity-70">{label}</div>
      <div className="text-[26px] leading-tight mt-0.5 truncate" style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, letterSpacing: '-0.02em' }}>{value}</div>
    </div>
  );
}

function CapitalizacionSolapa({ temporalidad, onChange, opciones }) {
  const [open, setOpen] = useState(false);
  const lista = opciones || TEMPORALIDADES;
  const actual = getTemporalidad(temporalidad);
  return (
    <div>
      <button type="button" onClick={() => setOpen((o) => !o)} className="flex items-center gap-1.5 text-xs font-semibold cx-text-accent-primary cx-bg-accent-primary-bg cx-hover-bg-accent-primary-bg-hover rounded-md px-3 py-1.5 transition-colors">
        <Settings2 size={13} /> Capitalización: {actual.label} {open ? <ChevronLeft size={13} className="rotate-90" /> : <ChevronRight size={13} className="rotate-90" />}
      </button>
      {open && (
        <div className="mt-2 flex flex-wrap gap-1.5 cx-bg-surface border cx-border-border rounded-lg p-2.5">
          {lista.map((t) => (
            <button key={t.key} type="button" onClick={() => { onChange(t.key); setOpen(false); }} className={`px-2.5 py-1 rounded-md text-xs font-medium border transition-colors ${temporalidad === t.key ? 'text-white border-transparent' : 'cx-bg-surface cx-text-text-secondary cx-border-border cx-hover-border-border-hover'}`} style={{ background: temporalidad === t.key ? 'var(--accent-primary)' : undefined }}>
              {t.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function TemaIntro({ tipo, sistema }) {
  const content = {
    simple: {
      titulo: '¿Qué es el interés simple?',
      color: 'teal',
      texto: 'Cada periodo ganas exactamente lo mismo, calculado sobre el monto inicial.',
      formulas: [{ nombre: 'Monto final', formula: <MathBlock><Var>F</Var> = <Var>P</Var> · (1 + <Var>r</Var> · <Var>t</Var>)</MathBlock> }],
      variables: [{ simbolo: 'P', desc: 'Capital inicial' }, { simbolo: 'r', desc: 'Tasa por periodo' }, { simbolo: 't', desc: 'Número de periodos' }],
    },
    compuesto: {
      titulo: '¿Qué es el interés compuesto?',
      color: 'teal',
      texto: 'El interés se calcula sobre el saldo acumulado. Es "interés sobre interés".',
      formulas: [{ nombre: 'Monto final', formula: <MathBlock><Var>F</Var> = <Var>P</Var> · <Pow base={<>(1 + <Var>r</Var>)</>} exp={<Var>t</Var>} /></MathBlock> }],
      variables: [{ simbolo: 'P', desc: 'Capital inicial' }, { simbolo: 'r', desc: 'Tasa por periodo' }, { simbolo: 't', desc: 'Número de periodos' }],
    },
    anualidad: {
      titulo: '¿Qué es una anualidad?',
      color: 'blue',
      texto: 'Serie de pagos a intervalos regulares para pagar un préstamo.',
      formulas: [
        { nombre: 'Francesa', activo: sistema === 'francesa', formula: <MathBlock>Pago = <Frac num={<><Var>P</Var> · <Var>r</Var></>} den={<>1 − <Pow base={<>(1+<Var>r</Var>)</>} exp={<>−<Var>n</Var></>} /></>} /></MathBlock> },
        { nombre: 'Alemana', activo: sistema === 'alemana', formula: <MathBlock>Capital = <Frac num={<Var>P</Var>} den={<Var>n</Var>} /></MathBlock> },
      ],
      variables: [{ simbolo: 'P', desc: 'Monto del préstamo' }, { simbolo: 'r', desc: 'Tasa por periodo' }, { simbolo: 'n', desc: 'Número de cuotas' }],
    },
    tasas: {
      titulo: '¿Qué son las tasas equivalentes?',
      color: 'blue',
      texto: 'Dos tasas con distinta capitalización pueden producir el mismo rendimiento.',
      formulas: [{ nombre: 'Tasa efectiva anual', formula: <MathBlock>TEA = <Pow base={<>(1 + <Frac num={<Var>j</Var>} den={<Var>m</Var>} />)</>} exp={<Var>m</Var>} /> − 1</MathBlock> }],
      variables: [{ simbolo: 'j', desc: 'Tasa nominal anual' }, { simbolo: 'm', desc: 'Capitalizaciones por año' }],
    },
  };
  const c = content[tipo];
  if (!c) return null;
  const ring = c.color === 'teal' ? 'cx-border-20-accent-green cx-bg-accent-green-bg' : 'cx-border-20-accent-primary cx-bg-accent-primary-bg';
  const dot = c.color === 'teal' ? 'cx-text-accent-green-text' : 'cx-text-accent-primary';

  return (
    <div className={`rounded-lg border ${ring} p-5 mb-5`}>
      <div className={`flex items-center gap-2 font-semibold text-[15px] mb-2 ${dot}`} style={{ fontFamily: "'Fraunces', sans-serif" }}>
        <Sparkles size={16} /> {c.titulo}
      </div>
      <p className="text-sm cx-text-text-strong-gray leading-relaxed mb-4">{c.texto}</p>
      <div className="grid sm:grid-cols-2 gap-3">
        {c.formulas.map((f) => (
          <div key={f.nombre} className={`px-3 py-3 rounded-lg cx-bg-surface border ${f.activo ? 'border-2 cx-border-accent-primary' : 'cx-border-border'}`}>
            <div className="text-[11px] cx-text-text-muted font-semibold uppercase tracking-wide mb-0.5">{f.nombre}</div>
            {f.formula}
          </div>
        ))}
      </div>
      <div className="mt-4 pt-3 border-t border-black/5">
        <div className="text-[11px] cx-text-text-faint font-semibold uppercase tracking-wide mb-1.5">Donde</div>
        <ListaVariables items={c.variables} />
      </div>
    </div>
  );
}

function ControlPanel({ 
  dashboardOn, setDashboardOn,
  tutorialOn, setTutorialOn,
  discreteOn, setDiscreteOn,
  onReset 
}) {
  const handleReset = () => {
    if (typeof onReset === 'function') onReset();
    setDashboardOn(true);
    setTutorialOn(false);
    setDiscreteOn(false);
  };

  return (
    <div className="cx-bg-surface border cx-border-border rounded-lg p-3 mb-4 flex flex-wrap items-center justify-between gap-3">
      <div className="flex items-center gap-2">
        <Settings2 size={16} className="cx-text-accent-primary" />
        <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Panel de Control</span>
      </div>
      
      <div className="flex flex-wrap items-center gap-3">
        <label className="flex items-center gap-1.5 text-xs cursor-pointer">
          <input type="checkbox" checked={dashboardOn} onChange={() => setDashboardOn(!dashboardOn)} className="w-3.5 h-3.5 accent-emerald-600" />
          <span className="cx-text-text-secondary">📊 Dashboard</span>
        </label>
        <label className="flex items-center gap-1.5 text-xs cursor-pointer">
          <input type="checkbox" checked={tutorialOn} onChange={() => setTutorialOn(!tutorialOn)} className="w-3.5 h-3.5 accent-blue-600" />
          <span className="cx-text-text-secondary">📖 Tutorial</span>
        </label>
        <label className="flex items-center gap-1.5 text-xs cursor-pointer">
          <input type="checkbox" checked={discreteOn} onChange={() => setDiscreteOn(!discreteOn)} className="w-3.5 h-3.5 accent-purple-600" />

// TASAS EQUIVALENTES TAB - CON FÓRMULAS LIMPIAS

function TasasEquivalentesTab() {
  const [tasaValor, setTasaValor] = useState(18);
  const [origen, setOrigen] = useState('anual');
  const [destino, setDestino] = useState('mensual');
  const [tipoOrigen, setTipoOrigen] = useState('nominal');
  const [tipoDestino, setTipoDestino] = useState('efectiva');

  const [dashboardOn, setDashboardOn] = useState(true);
  const [tutorialOn, setTutorialOn] = useState(false);
  const [discreteOn, setDiscreteOn] = useState(false);
  const [tutorialStep, setTutorialStep] = useState(0);

  const tOrigen = getTemporalidad(origen);
  const tDestino = getTemporalidad(destino);
  
  const tea = calcularTEADesdeOrigen(tasaValor, tipoOrigen, origen);
  const tasaDestino = calcularTasaDestinoDesdeTEA(tea, tipoDestino, destino);
  const periodicaDestino = destino === 'continua' 
    ? null 
    : (tipoDestino === 'nominal' ? tasaDestino / 100 / tDestino.m : tasaDestino / 100);

  const chartData = TEMPORALIDADES.map((t) => ({
    temporalidad: t.label,
    'Tasa equivalente': calcularTasaDestinoDesdeTEA(tea, tipoDestino, t.key),
  }));

  const opcionesTemporalidad = TEMPORALIDADES.map((t) => ({ value: t.key, label: t.label }));
  const opcionesTipo = [
    { value: 'nominal', label: 'Nominal' },
    { value: 'efectiva', label: 'Efectiva' }
  ];

  // ============================================================
  // FÓRMULAS CON RENDERIZADO LIMPIO (SIN LaTeX)
  // ============================================================
  function getFormulaDisplay() {
    const j = (tasaValor / 100).toFixed(4);
    const m = tOrigen.m || '∞';
    const m2 = tDestino.m || '∞';
    const teaValue = (tea * 100).toFixed(4);
    const destValue = tasaDestino.toFixed(4);
    const periodicValue = periodicaDestino ? (periodicaDestino * 100).toFixed(4) : '—';

    const origenLabel = tipoOrigen === 'nominal' ? 'Nominal' : 'Efectiva';
    const destinoLabel = tipoDestino === 'nominal' ? 'Nominal' : 'Efectiva';
    const origenTemp = tOrigen.label.toLowerCase();
    const destTemp = tDestino.label.toLowerCase();

    // Caso: Continua → Continua
    if (origen === 'continua' && destino === 'continua') {
      return {
        titulo: `${origenLabel} Continua → ${destinoLabel} Continua`,
        formulaGeneral: <>TEA = <Pow base="e" exp={<Var>j</Var>} /> − 1</>,
        formulaConValores: <>TEA = <Pow base="e" exp={j} /> − 1 = {teaValue}%</>,
        variables: [
          { simbolo: 'j', desc: 'Tasa nominal continua' },
          { simbolo: 'e', desc: 'Constante de Euler (≈ 2.71828)' },
          { simbolo: 'TEA', desc: 'Tasa efectiva anual' }
        ],
        pasos: [
          `Tasa continua origen: ${(tasaValor / 100).toFixed(4)}`,
          `TEA = e^${j} − 1 = ${teaValue}%`,
          `Tasa continua destino: ${destValue}%`
        ],
        periodic: periodicValue
      };
    }

    // Caso: Continua → Efectiva/Nominal
    if (origen === 'continua') {
      return {
        titulo: `${origenLabel} Continua → ${destinoLabel} (${destTemp})`,
        formulaGeneral: <>TEA = <Pow base="e" exp={<Var>j</Var>} /> − 1</>,
        formulaConValores: <>TEA = <Pow base="e" exp={j} /> − 1 = {teaValue}%</>,
        variables: [
          { simbolo: 'j', desc: 'Tasa nominal continua' },
          { simbolo: 'e', desc: 'Constante de Euler (≈ 2.71828)' },
          { simbolo: 'TEA', desc: 'Tasa efectiva anual' }
        ],
        pasos: [
          `Tasa continua origen: ${(tasaValor / 100).toFixed(4)}`,
          `TEA = e^${j} − 1 = ${teaValue}%`,
          `Tasa ${destinoLabel.toLowerCase()} ${destTemp}: ${destValue}%`
        ],
        periodic: periodicValue
      };
    }

    // Caso: Efectiva/Nominal → Continua
    if (destino === 'continua') {
      return {
        titulo: `${origenLabel} (${origenTemp}) → ${destinoLabel} Continua`,
        formulaGeneral: <><Var>j</Var><Sub>2</Sub> = ln(1 + <Var>TEA</Var>)</>,
        formulaConValores: <>j₂ = ln(1 + {(tea).toFixed(4)}) = {destValue}%</>,
        variables: [
          { simbolo: 'TEA', desc: 'Tasa efectiva anual' },
          { simbolo: 'ln', desc: 'Logaritmo natural' },
          { simbolo: 'j₂', desc: 'Tasa nominal continua destino' }
        ],
        pasos: [
          `Tasa ${origenLabel.toLowerCase()} ${origenTemp}: ${(tasaValor / 100).toFixed(4)}`,
          `TEA = ${teaValue}%`,
          `Tasa continua destino: ln(1 + ${(tea).toFixed(4)}) = ${destValue}%`
        ],
        periodic: periodicValue
      };
    }

    // Caso: Nominal → Nominal
    if (tipoOrigen === 'nominal' && tipoDestino === 'nominal') {
      return {
        titulo: `Nominal (${origenTemp}) → Nominal (${destTemp})`,
        formulaGeneral: <>TEA = <Pow base={<>(1 + <Frac num={<Var>j</Var>} den={<Var>m</Var>} />)</>} exp={<Var>m</Var>} /> − 1</>,
        formulaConValores: <>TEA = <Pow base={<>(1 + <Frac num={j} den={m} />)</>} exp={m} /> − 1 = {teaValue}%</>,
        variables: [
          { simbolo: 'j', desc: 'Tasa nominal anual' },
          { simbolo: 'm', desc: 'Capitalizaciones por año (origen)' },
          { simbolo: 'TEA', desc: 'Tasa efectiva anual' }
        ],
        pasos: [
          `Tasa nominal ${origenTemp}: ${(tasaValor / 100).toFixed(4)}`,
          `TEA = (1 + ${j}/${m})^${m} − 1 = ${teaValue}%`,
          `Tasa nominal ${destTemp}: j₂ = ${destValue}%`
        ],
        periodic: periodicValue
      };
    }

    // Caso: Nominal → Efectiva
    if (tipoOrigen === 'nominal' && tipoDestino === 'efectiva') {
      return {
        titulo: `Nominal (${origenTemp}) → Efectiva (${destTemp})`,
        formulaGeneral: <>TEA = <Pow base={<>(1 + <Frac num={<Var>j</Var>} den={<Var>m</Var>} />)</>} exp={<Var>m</Var>} /> − 1</>,
        formulaConValores: <>TEA = <Pow base={<>(1 + <Frac num={j} den={m} />)</>} exp={m} /> − 1 = {teaValue}%</>,
        variables: [
          { simbolo: 'j', desc: 'Tasa nominal anual' },
          { simbolo: 'm', desc: 'Capitalizaciones por año (origen)' },
          { simbolo: 'TEA', desc: 'Tasa efectiva anual' }
        ],
        pasos: [
          `Tasa nominal ${origenTemp}: ${(tasaValor / 100).toFixed(4)}`,
          `TEA = (1 + ${j}/${m})^${m} − 1 = ${teaValue}%`,
          `Tasa efectiva ${destTemp}: i₂ = ${(tasaDestino / 100).toFixed(4)}%`
        ],
        periodic: periodicValue
      };
    }

    // Caso: Efectiva → Nominal
    if (tipoOrigen === 'efectiva' && tipoDestino === 'nominal') {
      return {
        titulo: `Efectiva (${origenTemp}) → Nominal (${destTemp})`,
        formulaGeneral: <>TEA = <Pow base={<>(1 + <Var>i</Var>)</>} exp={<Var>m</Var>} /> − 1</>,
        formulaConValores: <>TEA = <Pow base={<>(1 + {(tasaValor / 100).toFixed(4)})</>} exp={m} /> − 1 = {teaValue}%</>,
        variables: [
          { simbolo: 'i', desc: 'Tasa efectiva del periodo origen' },
          { simbolo: 'm', desc: 'Capitalizaciones por año (origen)' },
          { simbolo: 'TEA', desc: 'Tasa efectiva anual' }
        ],
        pasos: [
          `Tasa efectiva ${origenTemp}: ${(tasaValor / 100).toFixed(4)}`,
          `TEA = (1 + ${(tasaValor / 100).toFixed(4)})^${m} − 1 = ${teaValue}%`,
          `Tasa nominal ${destTemp}: j₂ = ${destValue}%`
        ],
        periodic: periodicValue
      };
    }

    // Caso: Efectiva → Efectiva
    return {
      titulo: `Efectiva (${origenTemp}) → Efectiva (${destTemp})`,
      formulaGeneral: <>TEA = <Pow base={<>(1 + <Var>i</Var>)</>} exp={<Var>m</Var>} /> − 1</>,
      formulaConValores: <>TEA = <Pow base={<>(1 + {(tasaValor / 100).toFixed(4)})</>} exp={m} /> − 1 = {teaValue}%</>,
      variables: [
        { simbolo: 'i', desc: 'Tasa efectiva del periodo origen' },
        { simbolo: 'm', desc: 'Capitalizaciones por año (origen)' },
        { simbolo: 'TEA', desc: 'Tasa efectiva anual' }
      ],
      pasos: [
        `Tasa efectiva ${origenTemp}: ${(tasaValor / 100).toFixed(4)}`,
        `TEA = (1 + ${(tasaValor / 100).toFixed(4)})^${m} − 1 = ${teaValue}%`,
        `Tasa efectiva ${destTemp}: i₂ = ${(tasaDestino / 100).toFixed(4)}%`
      ],
      periodic: periodicValue
    };
  }

  const formulaData = getFormulaDisplay();

  const tutorialSteps = [
    { index: 0, titulo: '🔄 Tasas Equivalentes', texto: 'Convierte entre tasas con distintas capitalizaciones.', consejo: 'La TEA es el "puente" para comparar tasas.' },
  ];

  // ============================================================
  // RENDER
  // ============================================================
  return (
    <div className="space-y-6">
      <ControlPanel 
        dashboardOn={dashboardOn} setDashboardOn={setDashboardOn}
        tutorialOn={tutorialOn} setTutorialOn={setTutorialOn}
        discreteOn={discreteOn} setDiscreteOn={setDiscreteOn}
        onReset={() => { setTasaValor(18); setOrigen('anual'); setDestino('mensual'); setTipoOrigen('nominal'); setTipoDestino('efectiva'); }} 
      />

      {discreteOn && (
        <DiscreteMathDisplay 
          formula={<>TEA = <Pow base={<>(1 + <Frac num={<Var>j</Var>} den={<Var>m</Var>} />)</>} exp={<Var>m</Var>} /> − 1</>}
          variables={[
            { simbolo: 'j', desc: 'Tasa nominal anual' },
            { simbolo: 'm', desc: 'Capitalizaciones por año' },
            { simbolo: 'TEA', desc: 'Tasa efectiva anual' }
          ]}
          recurrence="TEA = (1 + j/m)ᵐ − 1"
          explanation="Base para comparar tasas con diferentes capitalizaciones."
          tipo="sumatoria"
        />
      )}

      {/* SECCIÓN TASAS EQUIVALENTES - CON FÓRMULAS LIMPIAS */}
      <div className="cx-bg-surface-alt rounded-lg border cx-border-border p-5">
        <div className="flex items-center gap-2 mb-3">
          <Sparkles size={16} className="cx-text-accent-primary" />
          <span className="font-semibold text-[15px] cx-text-text-primary" style={{ fontFamily: "'Fraunces', sans-serif" }}>
            ¿Qué son las tasas equivalentes?
          </span>
        </div>
        <p className="text-sm cx-text-text-secondary mb-4">
          Dos tasas con distinta capitalización pueden producir el mismo rendimiento.
        </p>

        {/* Título de la fórmula */}
        <div className="text-[11px] cx-text-text-muted font-semibold uppercase tracking-wide mb-1 text-center">
          {tipoOrigen === 'nominal' ? 'Tasa nominal' : 'Tasa efectiva'} → {tipoDestino === 'nominal' ? 'Tasa nominal' : 'Tasa efectiva'}
        </div>

        {/* FÓRMULA GENERAL - CON RENDERIZADO LIMPIO */}
        <div className="bg-white dark:bg-black/20 rounded-lg p-4 mb-3 border cx-border-border shadow-sm">
          <div className="text-center font-serif text-base sm:text-lg cx-text-text-primary" style={{ fontFamily: "'STIX Two Text', 'Cambria Math', serif" }}>

          onClose={() => setTutorialOn(false)}

function fmtPct(n) {
  return n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
}

function InteresTab() {
  const [tipo, setTipo] = useState('compuesto');
  const [P, setP] = useState(80000);
  const [tasaNominal, setTasaNominal] = useState(12);
  const [temporalidad, setTemporalidad] = useState('mensual');
  const [n, setN] = useState(10);
  const [anios, setAnios] = useState(3);

  const [dashboardOn, setDashboardOn] = useState(true);
  const [tutorialOn, setTutorialOn] = useState(false);
  const [discreteOn, setDiscreteOn] = useState(false);
  const [tutorialStep, setTutorialStep] = useState(0);

  const opcionesTemporalidad = tipo === 'simple' ? TEMPORALIDADES.filter((x) => x.key !== 'continua') : TEMPORALIDADES;
  const esContinua = tipo === 'compuesto' && temporalidad === 'continua';
  const t = getTemporalidad(temporalidad);
  const r = esContinua ? 0 : tasaPeriodica(tasaNominal, temporalidad);

  const cambiarTipo = (nuevoTipo) => {
    setTipo(nuevoTipo);
    if (nuevoTipo === 'simple' && temporalidad === 'continua') setTemporalidad('mensual');
  };

  const resultadoContinuo = useMemo(() => calcularContinuo(P, tasaNominal, anios), [P, tasaNominal, anios]);
  const resultado = useMemo(() => {
    if (tipo === 'simple') return calcularSimple(P, r, n);
    return calcularCompuesto(P, r, n);
  }, [tipo, P, r, n]);

  const chartData = resultado.rows?.map((row) => ({ periodo: row.t, Capital: row.capital, Interés: row.interes })) || [];
  const evolutionData = resultado.rows?.map((row) => ({ mes: row.t, Saldo: row.saldoFinal })) || [];

  const tutorialSteps = [
    { index: 0, titulo: '📈 Interés Simple vs Compuesto', texto: 'Compara dos formas de hacer crecer tu dinero.', consejo: 'Observa la diferencia en el gráfico.' },
  ];

  return (
    <div className="space-y-6">
      <ControlPanel 
        dashboardOn={dashboardOn} setDashboardOn={setDashboardOn}

        discreteOn={discreteOn} setDiscreteOn={setDiscreteOn}
        onReset={() => { setP(80000); setTasaNominal(12); setTemporalidad('mensual'); setN(10); }}
      />

      {discreteOn && (
        <DiscreteMathDisplay 
          formula={<><Var>S</Var><Sub>t</Sub> = <Var>S</Var><Sub>t−1</Sub> · (1 + <Var>r</Var>)</>}
          variables={[{ simbolo: 'Sₜ', desc: 'Saldo en periodo t' }, { simbolo: 'Sₜ₋₁', desc: 'Saldo anterior' }, { simbolo: 'r', desc: 'Tasa por periodo' }]}
          recurrence="Sₜ = Sₜ₋₁ · (1 + r)"
          explanation={tipo === 'simple' ? 'Serie aritmética: crece linealmente.' : 'Serie geométrica: crece exponencialmente.'}
          tipo={tipo === 'simple' ? 'serie_aritmetica' : 'serie_geometrica'}
        />
      )}

      <div className="flex flex-wrap gap-2">
        <PillButton active={tipo === 'simple'} onClick={() => cambiarTipo('simple')}>Interés simple</PillButton>
        <PillButton active={tipo === 'compuesto'} onClick={() => cambiarTipo('compuesto')}>Interés compuesto</PillButton>
      </div>

      <TemaIntro tipo={tipo} sistema={null} />

      <div className="cx-bg-surface p-4 rounded-lg border cx-border-border space-y-4">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <Field label="Capital inicial" value={P} onChange={setP} min={0} step={100} />
          <Field label="Tasa nominal anual" suffix="%" value={tasaNominal} onChange={setTasaNominal} min={0} step={0.1} />
          {esContinua ? (
            <Field label="Número de años" value={anios} onChange={(v) => setAnios(Math.max(0.1, v))} min={0.1} step={0.5} />
          ) : (
            <Field label={`Número de periodos (${t.periodoPlural})`} value={n} onChange={(v) => setN(Math.max(1, Math.round(v)))} min={1} step={1} />
          )}
        </div>
        <CapitalizacionSolapa temporalidad={temporalidad} onChange={setTemporalidad} opciones={opcionesTemporalidad} />
      </div>

      {dashboardOn && (
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          {esContinua ? (
            <>
              <StatCard label="Capital inicial" value={fmt(P)} accent="teal" />
              <StatCard label="Monto final" value={fmt(resultadoContinuo.F)} accent="blue" />
              <StatCard label="Interés generado" value={fmt(resultadoContinuo.interes)} accent="coral" />
            </>
          ) : (
            <>
              <StatCard label="Saldo final" value={fmt(resultado.saldoFinal)} accent="blue" />
              <StatCard label="Interés total" value={fmt(resultado.totalInteres)} accent="coral" />
              <StatCard label="Capital inicial" value={fmt(P)} accent="teal" />
            </>
          )}
        </div>
      )}

      {!esContinua && chartData.length > 0 && (
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <BarChart3 size={16} className="cx-text-accent-primary flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Composición del saldo por periodo</span>
          </div>
          <StackedBarChart 
            data={chartData} 
            xKey="periodo" 
            barKeys={['Capital', 'Interés']} 
            colors={['var(--accent-green)', 'var(--accent-coral)']}
            label={`Periodo (${t.periodo})`}
          />
          <p className="text-xs cx-text-text-muted mt-2">
            {tipo === 'simple' ? 'El interés simple crece de forma lineal.' : 'El interés compuesto crece de forma exponencial.'}
          </p>
        </div>
      )}

      {!esContinua && evolutionData.length > 0 && (
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <LineChartIcon size={16} className="cx-text-accent-primary flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Evolución del saldo</span>
          </div>
          <LineChartComponent 
            data={evolutionData}
            lines={['Saldo']}
            colors={['var(--accent-primary)']}

          />

      )}

      {tutorialOn && (
        <TutorialStep step={tutorialSteps[tutorialStep]} total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)} />
      )}
    </div>
  );
}

    const alcancia = simularCamino({ tipo: 'alcancia', monto: objetivo, base: capacidad });

  ];

    { index: 0, titulo: '🎯 Simulador de Destinos', texto: 'Compara 5 caminos financieros.', consejo: 'Los caminos verdes son ahorro; los rojos son deudas.' },

  return (

      {discreteOn && (
        <DiscreteMathDisplay 
          formula={<><Var>S</Var><Sub>t</Sub> = <Var>S</Var><Sub>t−1</Sub> · (1 + <Var>r</Var>) − <Var>C</Var></>}
          variables={[{ simbolo: 'Sₜ', desc: 'Saldo en periodo t' }, { simbolo: 'r', desc: 'Tasa por periodo' }, { simbolo: 'C', desc: 'Cuota o pago' }]}
          recurrence="Sₜ = Sₜ₋₁ · (1 + r) − C"
          explanation="Motor de todos los cálculos del simulador."

      {dashboardOn && <SimuladorDashboard paths={paths} objetivo={objetivo} />}

      <div className="rounded-lg cx-bg-accent-primary-bg border cx-border-accent-primary/15 p-4 flex items-start gap-2">
        <Target size={18} className="mt-0.5 flex-shrink-0 cx-text-accent-primary" />
        <p className="text-sm cx-text-text-strong-gray">

            <div key={p.key} className={`cx-bg-surface border-2 rounded-lg p-4 flex flex-col gap-3 ${isDeuda ? 'cx-border-accent-coral-border' : 'cx-border-border'}`}>
              <div className="flex items-center gap-2">
                <div className={`p-1.5 rounded-full ${isDeuda ? 'cx-bg-accent-coral-bg cx-text-accent-coral-text' : 'cx-bg-accent-green-bg cx-text-accent-green-text'}`}>

                </div>
                <span className="font-semibold cx-text-text-primary text-sm" style={{ fontFamily: "'Fraunces', sans-serif" }}>{p.label}</span>
              </div>
              {p.editable && (
                <label className="flex items-center gap-2 text-xs cx-text-text-muted">
                  Tasa anual
                  <input type="number" value={tasas[p.tasaKey]} onChange={setTasa(p.tasaKey)} className="w-16 border-2 cx-border-border rounded-lg px-1.5 py-0.5 cx-text-text-primary" style={{ fontFamily: "'JetBrains Mono', monospace" }} />%
                </label>
              )}
              {p.nuncaPaga ? (
                <div className="flex items-start gap-1.5 cx-text-accent-coral-text text-sm cx-bg-accent-coral-bg rounded-lg px-3 py-2">
                  <AlertTriangle size={14} className="mt-0.5 flex-shrink-0" />
                  Tu pago mensual no cubre ni el interés: la deuda nunca se termina de pagar.
                </div>
              ) : (
                <>
                  <div>
                    <div className="text-[11px] uppercase tracking-wide cx-text-text-muted">{isDeuda ? 'Tiempo para pagarla' : 'Tiempo para lograrlo'}</div>
                    <div className="text-lg" style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{monthsToYears(p.meses)}</div>
                  </div>
                  <div>
                    <div className="text-[11px] uppercase tracking-wide cx-text-text-muted">{isDeuda ? 'Interés total pagado' : 'Interés total ganado'}</div>
                    <div className={`text-sm font-semibold ${isDeuda ? 'cx-text-accent-coral-text' : 'cx-text-accent-green-text'}`}>{fmt(p.interes)}</div>
                  </div>
                </>
              )}
              <button onClick={() => setDetalle(p)} className="flex items-center justify-center gap-1.5 text-xs font-semibold py-2 rounded-md text-white hover:opacity-90 transition-opacity" style={{ background: 'var(--accent-primary)' }}>
                Analizar este destino <RotateCcw size={12} />
              </button>
            </div>
          );
        })}
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <LineChartIcon size={16} className="cx-text-accent-green-text flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Caminos de ahorro</span>
          </div>
          <LineChartComponent 
            data={ahorroChart}
            lines={['Alcancía', 'Ahorro Simple', 'Ahorro Compuesto']}
            colors={['var(--chart-axis)', 'var(--accent-primary)', 'var(--accent-green)']}
            label="Meses"
            referenceLine={objetivo}
          />
        </div>
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <LineChartIcon size={16} className="cx-text-accent-coral-text flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Caminos de deuda</span>
          </div>
          <LineChartComponent 
            data={deudaChart}
            lines={['Préstamo', 'Tarjeta Crédito']}
            colors={['var(--accent-primary)', 'var(--accent-coral)']}
            label="Meses"
          />
        </div>
      </div>

      {detalle && (
        <Modal onClose={() => setDetalle(null)} wide>
          <div className="flex items-center gap-2 cx-text-accent-primary-text font-semibold text-sm mb-1">
            <detalle.icon size={16} /> {detalle.label}
          </div>
          <h3 className="text-2xl cx-text-text-primary mb-4" style={{ fontFamily: "'Fraunces', sans-serif", fontWeight: 600 }}>Analiza este destino</h3>
          <p className="text-sm cx-text-text-secondary mb-4">
            {detalle.tipo === 'deuda' ? 'Prueba qué pasa si abonas un poco más cada mes.' : 'Prueba qué pasa si aportas un poco más cada mes.'}
          </p>
          <button onClick={() => setDetalle(null)} className="w-full py-2 rounded-lg text-sm font-semibold text-white" style={{ background: 'var(--accent-primary)' }}>Cerrar</button>
        </Modal>
      )}

      {tutorialOn && (
        <TutorialStep step={tutorialSteps[tutorialStep]} total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)} />
      )}
    </div>
  );
}

function QuizTab() {
  const [modo, setModo] = useState('quiz');
  const [nivel, setNivel] = useState(1);
  const [pregunta, setPregunta] = useState(null);
  const [respuestaTexto, setRespuestaTexto] = useState('');
  const [verificado, setVerificado] = useState(false);
  const [correcto, setCorrecto] = useState(false);
  const [puntaje, setPuntaje] = useState({ aciertos: 0, total: 0 });
  const [mostrarInforme, setMostrarInforme] = useState(false);
  
  const [temasSeleccionados, setTemasSeleccionados] = useState([]);
  const [dificultadEval, setDificultadEval] = useState('medio');
  const [evaluacionActiva, setEvaluacionActiva] = useState(false);
  const [preguntasEval, setPreguntasEval] = useState([]);
  const [preguntaEvalIndex, setPreguntaEvalIndex] = useState(0);
  const [respuestasEval, setRespuestasEval] = useState([]);
  const [evaluacionCompletada, setEvaluacionCompletada] = useState(false);

  const [dashboardOn, setDashboardOn] = useState(true);
  const [tutorialOn, setTutorialOn] = useState(false);
  const [discreteOn, setDiscreteOn] = useState(false);
  const [tutorialStep, setTutorialStep] = useState(0);

  const TEMAS = [
    { id: 'interes_simple', label: 'Interés Simple', icon: '📊' },
    { id: 'interes_compuesto', label: 'Interés Compuesto', icon: '📈' },
    { id: 'tasas_equivalentes', label: 'Tasas Equivalentes', icon: '🔄' },
    { id: 'valor_presente', label: 'Valor Presente', icon: '💰' },
    { id: 'anualidades', label: 'Anualidades y Préstamos', icon: '🏦' },
    { id: 'problemas_integradores', label: 'Problemas Integradores', icon: '🧩' },
  ];

  const NIVELES_META = [
    { nivel: 1, titulo: 'Interés simple · interés generado', tag: 'Interés simple', dificultad: 'Fácil' },
    { nivel: 2, titulo: 'Interés simple · monto final', tag: 'Interés simple', dificultad: 'Fácil' },
    { nivel: 3, titulo: 'Interés compuesto · monto final', tag: 'Interés compuesto', dificultad: 'Fácil' },
    { nivel: 4, titulo: 'Interés compuesto · número de periodos', tag: 'Interés compuesto', dificultad: 'Medio' },
    { nivel: 5, titulo: 'Tasa efectiva anual (TEA)', tag: 'Tasas equivalentes', dificultad: 'Medio' },
    { nivel: 6, titulo: 'Tasa nominal desde la TEA', tag: 'Tasas equivalentes', dificultad: 'Medio' },
    { nivel: 7, titulo: 'Valor presente', tag: 'Valor presente', dificultad: 'Difícil' },
    { nivel: 8, titulo: 'Anualidades · cuota fija', tag: 'Anualidades', dificultad: 'Difícil' },
    { nivel: 9, titulo: 'Mixto · tiempo total en años', tag: 'Problemas integradores', dificultad: 'Experto' },
    { nivel: 10, titulo: 'Problema de destino', tag: 'Problemas integradores', dificultad: 'Master' },
  ];

  const DIFICULTADES = [
    { id: 'facil', label: '🌟 Fácil', color: 'text-emerald-600' },
    { id: 'medio', label: '⚡ Medio', color: 'text-blue-600' },
    { id: 'dificil', label: '🔥 Difícil', color: 'text-orange-600' },
    { id: 'experto', label: '💎 Experto', color: 'text-purple-600' },
    { id: 'master', label: '👑 Master', color: 'text-red-600' },
  ];

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randChoice(arr) { return arr[randInt(0, arr.length - 1)]; }
  function round2(n) { return Math.round(n * 100) / 100; }

  function dentroDeToleranciaQ(valorUsuario, correcto, unidad) {
    if (!isFinite(valorUsuario)) return false;
    if (unidad === '$') { const tol = Math.max(1, Math.abs(correcto) * 0.01); return Math.abs(valorUsuario - correcto) <= tol; }
    if (unidad === '%') { return Math.abs(valorUsuario - correcto) <= 0.15; }
    if (unidad === 'periodos') { return Math.abs(valorUsuario - correcto) <= 0.3; }
    if (unidad === 'años') { return Math.abs(valorUsuario - correcto) <= 0.15; }
    return Math.abs(valorUsuario - correcto) <= Math.abs(correcto) * 0.02;
  }

  function genPreguntaGenerica(nivel) {
    const temas = ['Interés simple', 'Interés compuesto', 'Tasas equivalentes', 'Valor presente', 'Anualidades', 'Problemas integradores'];
    const tema = temas[nivel % temas.length];
    return {
      tema: 'general',
      categoria: tema,
      enunciado: `Pregunta de nivel ${nivel} sobre ${tema}. **¿Cuál es el resultado?**`,
      unidad: '$',
      respuesta: 1000 + nivel * 100,
      solucion: [`Solución del nivel ${nivel}: el resultado es ${fmt(1000 + nivel * 100)}`],
      dificultad: nivel <= 3 ? 'facil' : nivel <= 6 ? 'medio' : nivel <= 8 ? 'dificil' : nivel <= 9 ? 'experto' : 'master'
    };
  }

  function generarPreguntaNivel(nivel) {
    return genPreguntaGenerica(nivel);
  }

  const cambiarNivel = (n) => {
    setNivel(n);
    setPregunta(generarPreguntaNivel(n));
    setRespuestaTexto('');
    setVerificado(false);
    setCorrecto(false);
    setPuntaje({ aciertos: 0, total: 0 });
    setMostrarInforme(false);
  };

  const nuevaPregunta = () => {
    setPregunta(generarPreguntaNivel(nivel));
    setRespuestaTexto('');
    setVerificado(false);
    setCorrecto(false);
  };

  const verificar = () => {
    const valor = parseFloat(respuestaTexto.replace(',', '.'));
    const ok = dentroDeToleranciaQ(valor, pregunta.respuesta, pregunta.unidad);
    setCorrecto(ok);
    setVerificado(true);
    setPuntaje((p) => ({ aciertos: p.aciertos + (ok ? 1 : 0), total: p.total + 1 }));
    if (puntaje.total + 1 >= 5) setMostrarInforme(true);
  };

  const meta = NIVELES_META[nivel - 1] || NIVELES_META[0];

  const tutorialSteps = [
    { index: 0, titulo: '📝 Quizzes y Evaluaciones', texto: 'Practica por niveles o haz una evaluación personalizada.', consejo: 'Los niveles van de 1 (fácil) a 10 (master).' },
  ];

  return (
    <div className="space-y-5">
      <ControlPanel 
        dashboardOn={dashboardOn} setDashboardOn={setDashboardOn}
        tutorialOn={tutorialOn} setTutorialOn={setTutorialOn}
        discreteOn={discreteOn} setDiscreteOn={setDiscreteOn}
        onReset={() => { setNivel(1); setPregunta(generarPreguntaNivel(1)); setPuntaje({ aciertos: 0, total: 0 }); setModo('quiz'); }} 
      />

      {discreteOn && (
        <DiscreteMathDisplay 
          formula={<>Σ a<Sub>i</Sub> · Serie Geométrica</>}
          variables={[{ simbolo: 'Σ', desc: 'Sumatoria' }, { simbolo: 'aᵢ', desc: 'Término i-ésimo' }]}
          recurrence="Sₙ = a₁ · (1−qⁿ)/(1−q)"
          explanation="Los quizzes aplican conceptos de series y sumatorias."
          tipo="sumatoria"
        />
      )}

      <div className="flex flex-col sm:flex-row gap-2 cx-bg-surface p-2 rounded-lg border cx-border-border">
        <button onClick={() => setModo('quiz')} className={`flex-1 py-2 rounded-md text-sm font-semibold transition-colors ${modo === 'quiz' ? 'text-white' : 'cx-text-text-secondary cx-bg-surface'}`} style={{ background: modo === 'quiz' ? 'var(--accent-primary)' : undefined }}>📝 Práctica por niveles</button>
        <button onClick={() => setModo('evaluacion')} className={`flex-1 py-2 rounded-md text-sm font-semibold transition-colors ${modo === 'evaluacion' ? 'text-white' : 'cx-text-text-secondary cx-bg-surface'}`} style={{ background: modo === 'evaluacion' ? 'var(--accent-primary)' : undefined }}>📊 Evaluación personalizada</button>
      </div>

      {modo === 'quiz' ? (
        <>
          <div><div className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold mb-2">Nivel de dificultad</div>
            <div className="flex flex-wrap gap-1.5">{NIVELES_META.map((m) => (<PillButton key={m.nivel} active={nivel === m.nivel} onClick={() => cambiarNivel(m.nivel)}>{m.nivel}</PillButton>))}</div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <StatCard label="Nivel actual" value={`${nivel} · ${meta.tag}`} accent="blue" />
            <StatCard label="Aciertos" value={`${puntaje.aciertos} / ${puntaje.total}`} accent="teal" />
            <StatCard label="Efectividad" value={puntaje.total ? `${Math.round((puntaje.aciertos / puntaje.total) * 100)}%` : '—'} accent="coral" />
          </div>
          {mostrarInforme && puntaje.total > 0 && (
            <div className="cx-bg-accent-primary-bg border cx-border-accent-primary/30 rounded-lg p-4">
              <div className="flex items-center gap-2 mb-2"><Check size={16} className="cx-text-accent-green-text" /><span className="text-sm font-semibold cx-text-text-primary">📊 Informe de progreso</span></div>
              <div className="flex flex-wrap gap-4 text-sm"><span className="cx-text-text-secondary">Aciertos: <strong>{puntaje.aciertos}</strong></span><span className="cx-text-text-secondary">Total: <strong>{puntaje.total}</strong></span><span className="cx-text-text-secondary">Efectividad: <strong>{Math.round((puntaje.aciertos / puntaje.total) * 100)}%</strong></span><span className="cx-text-text-secondary">Nivel: <strong>{meta.dificultad}</strong></span></div>
              <button onClick={() => setMostrarInforme(false)} className="mt-2 text-xs cx-text-accent-primary font-semibold">Ocultar informe</button>
            </div>
          )}
          {pregunta ? (
            <div className="cx-bg-surface border cx-border-border rounded-lg p-4 sm:p-5 space-y-4">
              <div className="flex items-center gap-2 cx-text-accent-primary-text font-semibold text-xs uppercase tracking-wide"><Lightbulb size={14} /> {pregunta.categoria} · Nivel {nivel} · {meta.dificultad}</div>
              <p className="text-[15px] cx-text-text-strong-gray leading-relaxed"><TextoConNegritas texto={pregunta.enunciado} /></p>
              <div className="flex flex-col sm:flex-row gap-3 sm:items-end">
                <label className="flex-1 flex flex-col gap-1">
                  <span className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold">Tu respuesta ({pregunta.unidad})</span>
                  <input type="text" inputMode="decimal" value={respuestaTexto} onChange={(e) => setRespuestaTexto(e.target.value)} placeholder="Ej. 12500.50" className="w-full px-3 py-2.5 border-2 cx-border-border rounded-lg outline-none cx-focus-border-accent-primary cx-bg-surface cx-text-text-primary" style={{ fontFamily: "'JetBrains Mono', monospace" }} onKeyDown={(e) => e.key === 'Enter' && verificar()} />
                </label>
                <div className="flex flex-wrap gap-2">
                  <button onClick={verificar} disabled={respuestaTexto.trim() === ''} className="px-4 py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40" style={{ background: 'var(--accent-primary)' }}>Verificar</button>
                  <button onClick={nuevaPregunta} className="px-4 py-2.5 rounded-lg text-sm font-semibold cx-bg-surface cx-text-text-secondary border-2 cx-border-border cx-hover-border-border-hover flex items-center gap-1.5"><RotateCcw size={14} /> Nueva</button>
                </div>
              </div>
              {verificado && (
                <div className={`rounded-lg p-4 space-y-2 ${correcto ? 'cx-bg-accent-green-bg' : 'cx-bg-accent-coral-bg'}`}>
                  <div className={`flex items-center gap-2 font-semibold text-sm ${correcto ? 'cx-text-accent-green-text' : 'cx-text-accent-coral-text'}`}>{correcto ? <Check size={16} /> : <X size={16} />}{correcto ? '¡Correcto!' : 'No es correcto todavía.'}</div>
                  <p className="text-sm cx-text-text-strong-gray">Respuesta esperada: <strong>{fmt(pregunta.respuesta)}</strong></p>
                  <div className="space-y-1 pt-1 border-t" style={{ borderColor: 'var(--border)' }}>{pregunta.solucion.map((linea, i) => (<p key={i} className="text-xs cx-text-text-secondary leading-relaxed">{linea}</p>))}</div>
                </div>
              )}
            </div>
          ) : <div className="text-center py-8 cx-text-text-muted">Cargando pregunta...</div>}
          <p className="text-[11px] cx-text-text-faint">Cada nivel genera preguntas nuevas con números aleatorios.</p>
        </>
      ) : (
        <div className="cx-bg-surface border cx-border-border rounded-lg p-5 space-y-4">
          <h3 className="text-base font-semibold cx-text-text-primary" style={{ fontFamily: "'Fraunces', sans-serif" }}>📊 Configura tu evaluación</h3>
          <p className="text-sm cx-text-text-secondary">Selecciona los temas que quieres evaluar y la dificultad.</p>
          <div>
            <div className="flex items-center justify-between mb-2 flex-wrap">
              <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Temas a evaluar</span>
              <button onClick={() => { if (temasSeleccionados.length === TEMAS.length) setTemasSeleccionados([]); else setTemasSeleccionados(TEMAS.map(t => t.id)); }} className="text-xs cx-text-accent-primary font-semibold">{temasSeleccionados.length === TEMAS.length ? 'Deseleccionar todos' : 'Seleccionar todos'}</button>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              {TEMAS.map((tema) => (
                <label key={tema.id} className="flex items-center gap-2 p-2 rounded-lg cx-bg-surface-alt border cx-border-border cursor-pointer hover:cx-border-border-hover transition-colors">
                  <input type="checkbox" checked={temasSeleccionados.includes(tema.id)} onChange={() => { if (temasSeleccionados.includes(tema.id)) setTemasSeleccionados(temasSeleccionados.filter(t => t !== tema.id)); else setTemasSeleccionados([...temasSeleccionados, tema.id]); }} className="w-4 h-4 accent-emerald-600" />
                  <span className="text-xs cx-text-text-secondary">{tema.icon} {tema.label}</span>
                </label>
              ))}
            </div>
          </div>
          <div>
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Dificultad</span>
            <div className="flex flex-wrap gap-2 mt-1">
              {DIFICULTADES.map((d) => (
                <button key={d.id} onClick={() => setDificultadEval(d.id)} className={`px-3 py-1.5 rounded-md text-xs font-semibold border-2 transition-colors ${dificultadEval === d.id ? 'border-accent-primary text-white' : 'cx-border-border cx-text-text-secondary'}`} style={{ background: dificultadEval === d.id ? 'var(--accent-primary)' : undefined }}>{d.label}</button>
              ))}
            </div>
          </div>
          <button onClick={() => { if (temasSeleccionados.length === 0) { alert('Selecciona al menos un tema.'); return; } setEvaluacionActiva(true); }} disabled={temasSeleccionados.length === 0} className="w-full py-3 rounded-lg text-sm font-semibold text-white disabled:opacity-40 transition-opacity" style={{ background: 'var(--accent-primary)' }}>{temasSeleccionados.length === 0 ? 'Selecciona al menos un tema' : `Iniciar evaluación (${temasSeleccionados.length * 2} preguntas)`}</button>
        </div>
      )}

      {tutorialOn && (
        <TutorialStep step={tutorialSteps[tutorialStep]} total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)} />
      )}
    </div>
  );
}

        discreteOn={discreteOn} setDiscreteOn={setDiscreteOn}

      />
      <div className="cx-bg-surface border cx-border-border p-5 rounded-lg">

        <p className="text-sm cx-text-text-secondary">Todas las fórmulas organizadas por tema.</p>
      </div>
      {dashboardOn && (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div className="cx-bg-surface border cx-border-border rounded-lg p-4"><h4 className="font-bold text-sm cx-text-accent-primary">Interés Simple</h4><div className="font-serif text-center py-2 text-sm">F = P · (1 + r · t)</div></div>
          <div className="cx-bg-surface border cx-border-border rounded-lg p-4"><h4 className="font-bold text-sm cx-text-accent-primary">Interés Compuesto</h4><div className="font-serif text-center py-2 text-sm">F = P · (1 + r)ᵗ</div></div>
          <div className="cx-bg-surface border cx-border-border rounded-lg p-4"><h4 className="font-bold text-sm cx-text-accent-primary">Cuota Francesa</h4><div className="font-serif text-center py-2 text-xs">C = (P·r) / (1 − (1+r)⁻ⁿ)</div></div>
          <div className="cx-bg-surface border cx-border-border rounded-lg p-4"><h4 className="font-bold text-sm cx-text-accent-primary">Tasa Efectiva Anual</h4><div className="font-serif text-center py-2 text-sm">TEA = (1 + j/m)ᵐ − 1</div></div>
          <div className="cx-bg-surface border cx-border-border rounded-lg p-4 sm:col-span-2"><h4 className="font-bold text-sm cx-text-accent-primary">Relación de Recurrencia</h4><div className="font-serif text-center py-2 text-sm">Sₜ = Sₜ₋₁ · (1 + r) − C</div></div>
        </div>
      )}
    </div>
  );
}

function FinanzasApp() {
  const [folder, setFolder] = useState(null);
  const [theme, setTheme] = useState('light');
  const [acercaDeOpen, setAcercaDeOpen] = useState(false);
  const [booting, setBooting] = useState(true);
  const [splashDone, setSplashDone] = useState(false);
  const [entering, setEntering] = useState(false);
  const [leaving, setLeaving] = useState(false);
  const [origin, setOrigin] = useState({ x: 50, y: 15 });
  const shellRef = useRef(null);
  const TRANSITION_MS = 190;

  useEffect(() => {
    const t1 = setTimeout(() => setBooting(false), 1700);
    const t2 = setTimeout(() => setSplashDone(true), 2000);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);

  const toggleTheme = () => setTheme((t) => (t === 'light' ? 'dark' : 'light'));
  const volver = () => setFolder(null);

  const abrirFolder = (key, cardEl) => {
    if (cardEl && shellRef.current) {
      const c = shellRef.current.getBoundingClientRect();
      const r = cardEl.getBoundingClientRect();
      setOrigin({ x: ((r.left + r.width / 2 - c.left) / c.width) * 100, y: ((r.top + r.height / 2 - c.top) / c.height) * 100 });
    }
    setLeaving(true);
    setTimeout(() => {
      setFolder(key);
      setLeaving(false);
      setEntering(true);
      requestAnimationFrame(() => requestAnimationFrame(() => setEntering(false)));
    }, TRANSITION_MS);
  };

  const folderDef = FOLDERS.find((f) => f.key === folder);
  const contentStyle = {
    transformOrigin: `${origin.x}% ${origin.y}%`,
    opacity: leaving || entering ? 0 : 1,

        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .finapp-root { --bg: #F1ECDC; --surface: #FBF8EF; --surface-alt: #E7EEE4; --surface-hover: #EFE9D6; --surface-hover-2: #E7DFC5; --surface-hover-3: #DCD2AF; --border: #D9CFAE; --border-hover: #B7A876; --text-primary: #241D12; --text-secondary: #5B5138; --text-muted: #85795A; --text-faint: #ACA080; --text-strong-gray: #4A4128; --accent-primary: #1F4D3A; --accent-primary-bg: #E3ECE3; --accent-primary-bg-hover: #D2E1D2; --accent-primary-text: #163A2B; --accent-green: #2F8F5B; --accent-green-bg: #E4F1E7; --accent-green-text: #1D6B44; --accent-coral: #A3402E; --accent-coral-bg: #F3E3DC; --accent-coral-text: #832E20; --accent-coral-border: #DDB9A6; --chart-grid: #E1D8BC; --chart-axis: #9C8F6E; }
        .finapp-root[data-theme='dark'] { --bg: #17140C; --surface: #201B10; --surface-alt: #202A22; --surface-hover: #262014; --surface-hover-2: #2E2718; --surface-hover-3: #3A311D; --border: #3A3018; --border-hover: #5C4E28; --text-primary: #F1EAD3; --text-secondary: #D0C4A0; --text-muted: #A4977A; --text-faint: #786D53; --text-strong-gray: #C7BB98; --accent-primary: #6FCB9F; --accent-primary-bg: #22362A; --accent-primary-bg-hover: #2C4433; --accent-primary-text: #8FE0B7; --accent-green: #6FCB9F; --accent-green-bg: #1E3327; --accent-green-text: #8FE0B7; --accent-coral: #E0997F; --accent-coral-bg: #392419; --accent-coral-text: #F0B79E; --accent-coral-border: #5A3A27; --chart-grid: #3A3018; --chart-axis: #8C7F5D; }
        .finapp-root, .finapp-root * { transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease; }
        .finapp-root input::placeholder { color: var(--text-faint); opacity: 1; font-weight: 500; }

        .finapp-root[data-theme='dark'] { color-scheme: dark; }
        .finapp-root[data-theme='dark'] .espol-logo { filter: invert(1) brightness(1.7); }
        .cx-bg-surface-hover-2 { background-color: var(--surface-hover-2); }
        .cx-hover-bg-surface-hover-3:hover { background-color: var(--surface-hover-3); }
        .cx-hover-bg-surface-hover-2:hover { background-color: var(--surface-hover-2); }
        .cx-bg-surface { background-color: var(--surface); }
        .cx-text-text-secondary { color: var(--text-secondary); }
        .cx-border-20-accent-green { border-color: color-mix(in srgb, var(--accent-green) 20%, transparent); }
        .cx-bg-accent-green-bg { background-color: var(--accent-green-bg); }
        .cx-border-20-accent-primary { border-color: color-mix(in srgb, var(--accent-primary) 20%, transparent); }
        .cx-bg-accent-primary-bg { background-color: var(--accent-primary-bg); }
        .cx-text-accent-green-text { color: var(--accent-green-text); }
        .cx-text-accent-primary { color: var(--accent-primary); }
        .cx-text-text-strong-gray { color: var(--text-strong-gray); }

        .cx-border-border { border-color: var(--border); }
        .cx-text-text-muted { color: var(--text-muted); }

        .cx-hover-border-border-hover:hover { border-color: var(--border-hover); }
        .cx-focusw-border-accent-primary:focus-within { border-color: var(--accent-primary); }
        .cx-text-accent-coral-text { color: var(--accent-coral-text); }
        .cx-bg-accent-coral-bg { background-color: var(--accent-coral-bg); }
        .cx-text-accent-primary-text { color: var(--accent-primary-text); }
        .cx-hover-bg-accent-primary-bg-hover:hover { background-color: var(--accent-primary-bg-hover); }
        .cx-border-border-hover { border-color: var(--border-hover); }
        .cx-bg-surface-alt { background-color: var(--surface-alt); }
        .cx-focus-border-accent-primary:focus { border-color: var(--accent-primary); }
        .cx-hover-bg-surface-hover:hover { background-color: var(--surface-hover); }
        .cx-hover-bg-surface-alt:hover { background-color: var(--surface-alt); }
        .cx-hover-bg-accent-coral-bg:hover { background-color: var(--accent-coral-bg); }
        .cx-hover-text-accent-coral-text:hover { color: var(--accent-coral-text); }
        .cx-border-accent-green { border-color: var(--accent-green); }
        .cx-border-accent-coral-border { border-color: var(--accent-coral-border); }
        .cx-hover-text-accent-primary:hover { color: var(--accent-primary); }
        .formula-centered { text-align: center; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 0.25rem; }
        @media (max-width: 640px) {
          .finapp-root .max-w-5xl { padding-left: 0.75rem; padding-right: 0.75rem; }
          .finapp-root .cx-bg-surface { padding: 0.75rem; }
        }
      `}</style>
      <div className="max-w-5xl mx-auto px-4 py-6 sm:py-8">
        <header className="relative overflow-hidden rounded-lg mb-5 px-5 py-6 sm:px-8 sm:py-8" style={{ background: 'linear-gradient(135deg, #1F4D3A 0%, #2A6349 55%, #163A2B 100%)' }}>
          <div className="absolute inset-0 opacity-[0.05] pointer-events-none" style={{ backgroundImage: 'repeating-linear-gradient(to bottom, transparent, transparent 27px, #fff 27px, #fff 28px)' }} />

            <button onClick={volver} className="inline-flex items-center gap-2 text-[#D9C98A] text-xs uppercase tracking-[0.15em] font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3 py-1 transition-colors">
              <Calculator size={14} /> Proyecto de Matemáticas Discretas · Finanzas
            </button>
            <div className="flex items-center gap-2">
              <button onClick={toggleTheme} className="inline-flex items-center gap-1.5 text-white text-xs font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3.5 py-1.5 transition-colors">
                {theme === 'dark' ? <Sun size={13} /> : <Moon size={13} />}
                {theme === 'dark' ? 'Claro' : 'Oscuro'}
              </button>
              <button onClick={() => setAcercaDeOpen(true)} className="inline-flex items-center gap-1.5 text-white text-xs font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3.5 py-1.5 transition-colors">
                <Info size={13} /> Acerca de
              </button>
            </div>
          </div>
          <div className="absolute left-0 right-0 bottom-0">
            <div className="h-[3px]" style={{ background: '#D9C98A', opacity: 0.9 }} />
            <div className="h-px mt-[3px]" style={{ background: '#D9C98A', opacity: 0.5 }} />
          </div>
        </header>

        {acercaDeOpen && (
          <Modal onClose={() => setAcercaDeOpen(false)}>
            <div className="flex items-center gap-2 cx-text-accent-primary font-semibold text-sm mb-1" style={{ fontFamily: "'Fraunces', sans-serif" }}><Calculator size={16} /> Proyecto de Matemáticas Discretas</div>
            <h3 className="text-2xl mb-3" style={{ fontFamily: "'Fraunces', sans-serif", fontWeight: 600, color: 'var(--text-primary)' }}>PROTOTIPO EDUCATIVO ESPOL</h3>
            <p className="text-sm leading-relaxed" style={{ color: 'var(--text-secondary)' }}>Organizado por carpetas, con modo tutorial, dashboard y matemáticas discretas.</p>

        <div ref={shellRef} className="cx-bg-surface rounded-lg border cx-border-border p-4 sm:p-6 shadow-lg shadow-black/[0.08] relative">
          <div style={contentStyle}>
            {folder === null ? (
              <GameMenu onSelect={abrirFolder} />
            ) : (
              <div>
                <FolderHeader folder={folderDef} onBack={volver} />

            Desarrollado con fines académicos para Matemáticas Discretas, Escuela Superior Politécnica del Litoral (ESPOL).
          </p>
        </footer>
      </div>
    </div>
  );
