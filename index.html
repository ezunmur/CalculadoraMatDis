const fmt = (n) => {
  if (!isFinite(n)) return '—';
  return '$' + n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtInt = (n) => n.toLocaleString('es-EC', { maximumFractionDigits: 0 });

const monthsToYears = (m) => {
  if (!isFinite(m)) return '—';
  const y = Math.floor(m / 12);
  const rem = Math.round(m % 12);
  if (y === 0) return `${rem} ${rem === 1 ? 'mes' : 'meses'}`;
  if (rem === 0) return `${y} ${y === 1 ? 'año' : 'años'}`;
  return `${y} ${y === 1 ? 'año' : 'años'} y ${rem} ${rem === 1 ? 'mes' : 'meses'}`;
};

const TEMPORALIDADES = [
  { key: 'anual', label: 'Anual', m: 1, periodo: 'año', periodoPlural: 'años' },
  { key: 'semestral', label: 'Semestral', m: 2, periodo: 'semestre', periodoPlural: 'semestres' },
  { key: 'cuatrimestral', label: 'Cuatrimestral', m: 3, periodo: 'cuatrimestre', periodoPlural: 'cuatrimestres' },
  { key: 'trimestral', label: 'Trimestral', m: 4, periodo: 'trimestre', periodoPlural: 'trimestres' },
  { key: 'bimestral', label: 'Bimestral', m: 6, periodo: 'bimestre', periodoPlural: 'bimestres' },
  { key: 'bimensual', label: 'Bimensual (quincenal)', m: 24, periodo: 'quincena', periodoPlural: 'quincenas' },
  { key: 'mensual', label: 'Mensual', m: 12, periodo: 'mes', periodoPlural: 'meses' },
  { key: 'semanal', label: 'Semanal', m: 52, periodo: 'semana', periodoPlural: 'semanas' },
  { key: 'diaria', label: 'Diaria', m: 365, periodo: 'día', periodoPlural: 'días' },
  { key: 'continua', label: 'Continua', m: null, periodo: 'año', periodoPlural: 'años' },
];

const getTemporalidad = (key) => TEMPORALIDADES.find((t) => t.key === key) || TEMPORALIDADES[6];

function tasaPeriodica(tasaNominalPct, temporalidadKey) {
  const t = getTemporalidad(temporalidadKey);
  if (t.key === 'continua') return null;
  return (tasaNominalPct / 100) / t.m;
}

function calcularTEADesdeOrigen(tasaPct, tipoOrigen, temporalidadOrigenKey) {
  const t = getTemporalidad(temporalidadOrigenKey);
  const tasaFrac = tasaPct / 100;
  if (t.key === 'continua') return Math.exp(tasaFrac) - 1;
  const iOrigen = tipoOrigen === 'nominal' ? tasaFrac / t.m : tasaFrac;
  return Math.pow(1 + iOrigen, t.m) - 1;
}

function calcularTasaDestinoDesdeTEA(tea, tipoDestino, temporalidadDestinoKey) {
  const t = getTemporalidad(temporalidadDestinoKey);
  if (t.key === 'continua') return Math.log(1 + tea) * 100;
  const iDestino = Math.pow(1 + tea, 1 / t.m) - 1;
  return (tipoDestino === 'nominal' ? iDestino * t.m : iDestino) * 100;
}

function calcularContinuo(P, tasaNominalPct, anios) {
  const r = tasaNominalPct / 100;
  const F = P * Math.exp(r * anios);
  return { F, interes: F - P, r, anios };
}

function calcularAmortizacion(P, r, n, sistema) {
  const rows = [];
  let saldo = P;

  if (sistema === 'francesa') {
    const pago = r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n));
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      let capital = pago - interes;
      let saldoFinal = saldo - capital;
      if (t === n) { capital += saldoFinal; saldoFinal = 0; }
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  } else if (sistema === 'alemana') {
    const capitalFijo = P / n;
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const pago = capitalFijo + interes;
      const saldoFinal = Math.max(0, saldo - capitalFijo);
      rows.push({ t, saldoInicial: saldo, pago, interes, capital: capitalFijo, saldoFinal });
      saldo = saldoFinal;
    }
  } else { 
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const capital = t === n ? saldo : 0;
      const pago = interes + capital;
      const saldoFinal = saldo - capital;
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0) };
}

function calcularSimple(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = P * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function calcularCompuesto(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = saldo * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function simularCamino({ tipo, monto, base, tasaAnual = 0, extraMensual = 0, extrasUnicos = [], maxMeses = 1200 }) {
  const r = tasaAnual / 100 / 12;
  const aporteExtra = (m) =>
    extraMensual + extrasUnicos.reduce((acc, e) => acc + (m === e.mes ? (e.monto || 0) : 0), 0);

  if (tipo === 'alcancia') {
    let saldo = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      saldo += base + aporteExtra(m);
      serie.push({ mes: m, saldo: Math.min(saldo, monto) });
      if (saldo >= monto) return { meses: m, totalInteres: 0, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: 0, serie, alcanzado: false };
  }

  if (tipo === 'ahorroSimple') {
    let principal = 0, interesAcum = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      principal += base + aporteExtra(m);
      interesAcum += principal * r;
      const saldo = principal + interesAcum;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: interesAcum, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: interesAcum, serie, alcanzado: false };
  }

  if (tipo === 'ahorroCompuesto') {
    let saldo = 0, aportado = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      const aporte = base + aporteExtra(m);
      saldo = saldo * (1 + r) + aporte;
      aportado += aporte;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: saldo - aportado, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: saldo - aportado, serie, alcanzado: false };
  }

  let saldo = monto, interesTotal = 0;
  const serie = [{ mes: 0, saldo }];
  const hayExtraUnico = extrasUnicos.some((e) => (e.monto || 0) > 0);
  if (base + extraMensual <= saldo * r && !hayExtraUnico) {
    return { meses: Infinity, totalInteres: Infinity, serie, nuncaPaga: true };
  }
  for (let m = 1; m <= maxMeses; m++) {
    const interes = saldo * r;
    interesTotal += interes;
    const pago = base + aporteExtra(m);
    saldo = saldo + interes - pago;
    if (saldo < 0) saldo = 0;
    serie.push({ mes: m, saldo });
    if (saldo <= 0) return { meses: m, totalInteres: interesTotal, serie, nuncaPaga: false };
  }
  return { meses: Infinity, totalInteres: interesTotal, serie, nuncaPaga: false };
}

    <label className="flex flex-wrap items-end gap-x-2 gap-y-0.5 border-b-2 cx-border-border cx-focusw-border-accent-primary min-w-0 pb-1">
      <span className="text-[11px] cx-text-text-muted font-medium whitespace-nowrap">{label}</span>

}

      {open && (
        <div className="mt-2 flex flex-wrap gap-1.5 cx-bg-surface border cx-border-border rounded-lg p-2.5">

            <button key={t.key} type="button" onClick={() => { onChange(t.key); setOpen(false); }} className={`px-2.5 py-1 rounded-md text-xs font-medium border transition-colors ${temporalidad === t.key ? 'text-white border-transparent' : 'cx-bg-surface cx-text-text-secondary cx-border-border cx-hover-border-border-hover'}`} style={{ background: temporalidad === t.key ? 'var(--accent-primary)' : undefined }}>

        </div>
      )}

  );
}
