import React, { useState, useMemo, useRef, useEffect, useCallback } from 'react';

// ============================================================

const ESPOL_LOGO_BASE64 = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIiB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIyMDAiIGZpbGw9IiNGRkZGRkYiLz48Y2lyY2xlIGN4PSIxMDAiIGN5PSI4MCIgcj0iNDAiIGZpbGw9IiMxRjREM0EiLz48Y2lyY2xlIGN4PSIxMDAiIGN5PSI4MCIgcj0iMzAiIGZpbGw9IiNGRkZGRkYiLz48cGF0aCBkPSJNNzAgODAgTDEwMCA1MCBMMTMwIDgwIEwxMDAgMTEwIEw3MCA4MFoiIGZpbGw9IiMxRjREM0EiLz48cGF0aCBkPSJNODUgODAgTDEwMCA2NSBMMTE1IDgwIEwxMDAgOTUgTDg1IDgwWiIgZmlsbD0iI0ZGRkZGRiIvPjxjaXJjbGUgY3g9IjEwMCIgY3k9IjE1MCIgcj0iMTUiIGZpbGw9IiMxRjREM0EiLz48cmVjdCB4PSI4NSIgeT0iMTY1IiB3aWR0aD0iMzAiIGhlaWdodD0iMTUiIGZpbGw9IiMxRjREM0EiLz48L3N2Zz4=';

const FRASES_CARGA = [
  'El interés compuesto no descansa, ni siquiera los domingos.',
  'Calculando cuánto cuesta el "cómprate algo bonito".',
  'Convirtiendo excusas en tasas efectivas anuales.',

];

// ---------- Utilidades ----------
const fmt = (n) => {
  if (!isFinite(n) || n === undefined || n === null) return '—';
  if (n === 0) return '$0.00';
  return '$' + n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtInt = (n) => {
  if (!isFinite(n) || n === undefined || n === null) return '—';
  return n.toLocaleString('es-EC', { maximumFractionDigits: 0 });
};
const fmtPct = (n) => {
  if (!isFinite(n) || n === undefined || n === null) return '—';
  return n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
};

const monthsToYears = (m) => {
  if (!isFinite(m) || m === undefined || m === null || m === Infinity) return '∞';
  const y = Math.floor(m / 12);
  const rem = Math.round(m % 12);
  if (y === 0) return `${rem} ${rem === 1 ? 'mes' : 'meses'}`;
  if (rem === 0) return `${y} ${y === 1 ? 'año' : 'años'}`;
  return `${y} ${y === 1 ? 'año' : 'años'} y ${rem} ${rem === 1 ? 'mes' : 'meses'}`;
};

// ============================================================
// LÍMITES PARA RENDIMIENTO
// ============================================================
const LIMITES = {
  MESES_MAX: 600,
  PUNTOS_GRAFICO: 300,
  FILAS_TABLA: 80,
  UMBRAL_MUESTREO: 100,
  ANIOS_MAX: 50
};

const TEMPORALIDADES = [
  { key: 'anual', label: 'Anual', m: 1, periodo: 'año', periodoPlural: 'años' },
  { key: 'semestral', label: 'Semestral', m: 2, periodo: 'semestre', periodoPlural: 'semestres' },
  { key: 'trimestral', label: 'Trimestral', m: 4, periodo: 'trimestre', periodoPlural: 'trimestres' },
  { key: 'mensual', label: 'Mensual', m: 12, periodo: 'mes', periodoPlural: 'meses' },
  { key: 'diaria', label: 'Diaria', m: 365, periodo: 'día', periodoPlural: 'días' },
  { key: 'continua', label: 'Continua', m: null, periodo: 'año', periodoPlural: 'años' },
];
const getTemporalidad = (key) => TEMPORALIDADES.find((t) => t.key === key) || TEMPORALIDADES[3];

function tasaPeriodica(tasaNominalPct, temporalidadKey) {
  const t = getTemporalidad(temporalidadKey);
  if (t.key === 'continua') return null;
  return (tasaNominalPct / 100) / t.m;
}

function calcularTEADesdeOrigen(tasaPct, tipoOrigen, temporalidadOrigenKey) {
  const t = getTemporalidad(temporalidadOrigenKey);
  const tasaFrac = tasaPct / 100;
  if (t.key === 'continua') return Math.exp(tasaFrac) - 1;
  const iOrigen = tipoOrigen === 'nominal' ? tasaFrac / t.m : tasaFrac;
  return Math.pow(1 + iOrigen, t.m) - 1;
}
function calcularTasaDestinoDesdeTEA(tea, tipoDestino, temporalidadDestinoKey) {
  const t = getTemporalidad(temporalidadDestinoKey);
  if (t.key === 'continua') return Math.log(1 + tea) * 100;
  const iDestino = Math.pow(1 + tea, 1 / t.m) - 1;
  return (tipoDestino === 'nominal' ? iDestino * t.m : iDestino) * 100;
}

function calcularContinuo(P, tasaNominalPct, anios) {
  const r = tasaNominalPct / 100;
  const F = P * Math.exp(r * anios);
  return { F, interes: F - P };
}

function calcularAmortizacion(P, r, n, sistema) {
  const rows = [];
  let saldo = P;

  if (sistema === 'francesa') {
    const pago = r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n));
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      let capital = pago - interes;
      let saldoFinal = saldo - capital;
      if (t === n) { capital += saldoFinal; saldoFinal = 0; }
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  } else if (sistema === 'alemana') {
    const capitalFijo = P / n;
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const pago = capitalFijo + interes;
      const saldoFinal = Math.max(0, saldo - capitalFijo);
      rows.push({ t, saldoInicial: saldo, pago, interes, capital: capitalFijo, saldoFinal });
      saldo = saldoFinal;
    }
  } else {
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const capital = t === n ? saldo : 0;
      const pago = interes + capital;
      const saldoFinal = saldo - capital;
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0) };
}

function calcularSimple(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = P * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function calcularCompuesto(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = saldo * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

// ============================================================
// SIMULADOR CON PAGOS EXTRAS MEJORADO - CON EXTRAS PERIÓDICOS Y PUNTUALES
// ============================================================
function simularCamino({ tipo, monto, base, tasaAnual = 0, extraMensual = 0, extrasUnicos = [], extrasPeriodicos = [], maxMeses = LIMITES.MESES_MAX }) {
  const r = tasaAnual / 100 / 12;
  
  const aporteExtra = (m) => {
    let total = extraMensual;
    extrasUnicos.forEach(e => {
      if (m === e.mes) total += (e.monto || 0);
    });
    extrasPeriodicos.forEach(e => {
      if (m >= e.mes && m <= e.mesFin) total += (e.monto || 0);
    });
    return total;
  };

  const MAX_SERIE = LIMITES.PUNTOS_GRAFICO;
  const stepSize = Math.max(1, Math.floor(maxMeses / MAX_SERIE));

  if (tipo === 'alcancia') {
    let saldo = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    let contador = 0;
    for (let m = 1; m <= maxMeses; m++) {
      saldo += base + aporteExtra(m);
      if (contador % stepSize === 0 || saldo >= monto) {
        serie.push({ mes: m, saldo: Math.min(saldo, monto) });
      }
      if (saldo >= monto) return { meses: m, totalInteres: 0, serie: sampleSerie(serie, LIMITES.PUNTOS_GRAFICO), alcanzado: true };
      contador++;
    }
    return { meses: Infinity, totalInteres: 0, serie: sampleSerie(serie, LIMITES.PUNTOS_GRAFICO), alcanzado: false };
  }

  if (tipo === 'ahorroSimple') {
    let principal = 0, interesAcum = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    let contador = 0;
    for (let m = 1; m <= maxMeses; m++) {
      principal += base + aporteExtra(m);
      interesAcum += principal * r;
      const saldo = principal + interesAcum;
      if (contador % stepSize === 0 || saldo >= monto) {
        serie.push({ mes: m, saldo });
      }
      if (saldo >= monto) return { meses: m, totalInteres: interesAcum, serie: sampleSerie(serie, LIMITES.PUNTOS_GRAFICO), alcanzado: true };
      contador++;
    }
    return { meses: Infinity, totalInteres: interesAcum, serie: sampleSerie(serie, LIMITES.PUNTOS_GRAFICO), alcanzado: false };
  }

  if (tipo === 'ahorroCompuesto') {
    let saldo = 0, aportado = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    let contador = 0;
    for (let m = 1; m <= maxMeses; m++) {
      const aporte = base + aporteExtra(m);
      saldo = saldo * (1 + r) + aporte;
      aportado += aporte;
      if (contador % stepSize === 0 || saldo >= monto) {
        serie.push({ mes: m, saldo });
      }
      if (saldo >= monto) return { meses: m, totalInteres: saldo - aportado, serie: sampleSerie(serie, LIMITES.PUNTOS_GRAFICO), alcanzado: true };
      contador++;
    }
    return { meses: Infinity, totalInteres: saldo - aportado, serie: sampleSerie(serie, LIMITES.PUNTOS_GRAFICO), alcanzado: false };
  }

  let saldo = monto, interesTotal = 0;
  const serie = [{ mes: 0, saldo }];
  const hayExtras = extrasUnicos.some((e) => (e.monto || 0) > 0) || extrasPeriodicos.some((e) => (e.monto || 0) > 0);
  if (base + extraMensual <= saldo * r && !hayExtras) {
    return { meses: Infinity, totalInteres: Infinity, serie: sampleSerie(serie, LIMITES.PUNTOS_GRAFICO), nuncaPaga: true };
  }
  let contador = 0;
  for (let m = 1; m <= maxMeses; m++) {
    const interes = saldo * r;
    interesTotal += interes;
    const pago = base + aporteExtra(m);
    saldo = saldo + interes - pago;
    if (saldo < 0) saldo = 0;
    if (contador % stepSize === 0 || saldo <= 0) {
      serie.push({ mes: m, saldo });
    }
    if (saldo <= 0) return { meses: m, totalInteres: interesTotal, serie: sampleSerie(serie, LIMITES.PUNTOS_GRAFICO), nuncaPaga: false };
    contador++;
  }
  return { meses: Infinity, totalInteres: interesTotal, serie: sampleSerie(serie, LIMITES.PUNTOS_GRAFICO), nuncaPaga: false };
}

function sampleSerie(serie, maxRows) {
  if (!serie || serie.length === 0) return [];
  if (serie.length <= maxRows) return serie;
  const step = Math.ceil(serie.length / maxRows);
  const out = [];
  for (let i = 0; i < serie.length; i += step) out.push(serie[i]);
  const last = serie[serie.length - 1];
  if (out[out.length - 1] !== last) out.push(last);
  return out;
}

function FilaDetalleAmortizacion({ row, tipo, tasaMensual, sistema }) {
  const [expandido, setExpandido] = useState(false);

  const getDetalles = () => {
    const detalles = [];
    if (tipo === 'prestamo' || tipo === 'anualidad') {
      const interesCalculado = row.saldoInicial * tasaMensual;
      const capitalCalculado = row.pago - interesCalculado;
      
      detalles.push(
        { label: 'Saldo inicial', valor: fmt(row.saldoInicial), formula: 'Saldo del periodo anterior' },
        { label: 'Interés del periodo', valor: fmt(interesCalculado), formula: `Saldo inicial × Tasa mensual = ${fmt(row.saldoInicial)} × ${(tasaMensual * 100).toFixed(4)}%` },
        { label: 'Cuota pagada', valor: fmt(row.pago), formula: sistema === 'francesa' ? 'Cuota fija calculada con fórmula francesa' : sistema === 'alemana' ? 'Capital fijo + Interés' : 'Interés + Capital' },
        { label: 'Capital amortizado', valor: fmt(capitalCalculado), formula: `Cuota − Interés = ${fmt(row.pago)} − ${fmt(interesCalculado)}` },
        { label: 'Saldo final', valor: fmt(row.saldoFinal), formula: `Saldo inicial − Capital amortizado = ${fmt(row.saldoInicial)} − ${fmt(capitalCalculado)}` },
        { label: 'Interés acumulado', valor: fmt(row.interesAcumulado || 0), formula: 'Suma de intereses hasta este periodo' }
      );
    } else if (tipo === 'ahorro') {
      const interesCalculado = row.saldoActual - row.saldoAnterior - (row.aporte || 0);
      detalles.push(
        { label: 'Saldo anterior', valor: fmt(row.saldoAnterior), formula: 'Saldo del periodo anterior' },
        { label: 'Aporte del mes', valor: fmt(row.aporte || 0), formula: 'Depósito realizado' },
        { label: 'Interés ganado', valor: fmt(interesCalculado > 0 ? interesCalculado : 0), formula: `Saldo anterior × Tasa mensual = ${fmt(row.saldoAnterior)} × ${(tasaMensual * 100).toFixed(4)}%` },
        { label: 'Saldo actual', valor: fmt(row.saldoActual), formula: `Saldo anterior + Interés + Aporte = ${fmt(row.saldoAnterior)} + ${fmt(interesCalculado > 0 ? interesCalculado : 0)} + ${fmt(row.aporte || 0)}` }
      );
    }
    return detalles;
  };

  const detalles = getDetalles();

  return (
    <>
      <tr className="border-t cx-border-border cursor-pointer hover:cx-bg-surface-hover" onClick={() => setExpandido(!expandido)}>
        <td className="px-3 py-1.5 cx-text-text-secondary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{row.t || row.periodo}</td>
        {tipo === 'ahorro' ? (
          <>
            <td className="px-3 py-1.5 text-right cx-text-text-secondary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.saldoAnterior)}</td>
            <td className="px-3 py-1.5 text-right cx-text-accent-green-text" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.interes)}</td>
            <td className="px-3 py-1.5 text-right cx-text-text-primary font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.saldoActual)}</td>
          </>
        ) : (
          <>
            <td className="px-3 py-1.5 text-right cx-text-text-secondary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.saldoInicial)}</td>
            <td className="px-3 py-1.5 text-right cx-text-text-primary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.pago)}</td>
            <td className="px-3 py-1.5 text-right cx-text-accent-coral-text" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.interes)}</td>
            <td className="px-3 py-1.5 text-right cx-text-accent-green-text" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.capital)}</td>
            <td className="px-3 py-1.5 text-right cx-text-text-primary font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.saldoFinal)}</td>
          </>

            {expandido ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
          </button>
        </td>
      </tr>
      {expandido && (
        <tr className="fila-detalle">
          <td colSpan={tipo === 'ahorro' ? 5 : 7} className="px-4 py-3">

// COMPONENTE FIELD UNIFICADO - Etiqueta arriba, campo abajo
// ============================================================
function Field({ label, suffix, value, onChange, min, step, max, tooltip }) {
  const [texto, setTexto] = useState(value === 0 ? '' : String(value));
  const [enfocado, setEnfocado] = useState(false);
  const [error, setError] = useState('');
  
  useEffect(() => {
    if (!enfocado) setTexto(value === 0 ? '' : String(value));
  }, [value, enfocado]);
  
  const manejarCambio = (e) => {
    const t = e.target.value;
    setTexto(t);
    const num = parseFloat(t);
    if (isNaN(num) || t === '') { 
      setError('Número inválido'); 
      onChange(0); 
      return; 
    }
    if (min !== undefined && num < min) { 
      setError(`Mínimo: ${min}`); 
      onChange(min); 
      return; 
    }
    if (max !== undefined && num > max) { 
      setError(`Máximo: ${max}`); 
      onChange(max); 
      return; 
    }
    setError('');
    onChange(num);
  };

  return (
    <div className="form-group tooltip-trigger">
      <label className="form-label">
        {label}
        {tooltip && <HelpCircle size={12} className="cx-text-text-faint flex-shrink-0" />}
      </label>
      <div className="relative">
        <input 
          type="number" 
          value={texto} 
          min={min} 
          step={step} 
          max={max} 
          onChange={manejarCambio} 
          onFocus={() => setEnfocado(true)} 
          onBlur={() => setEnfocado(false)} 
          placeholder="0" 
          className={`form-input ${error ? 'form-input-error' : ''}`}
        />
        {suffix && <span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm cx-text-text-faint">{suffix}</span>}
      </div>
      {error && <span className="form-error-text">{error}</span>}
      {tooltip && <span className="tooltip-text">{tooltip}</span>}
    </div>
  );
}

function TasasEquivalentesTab() {
  const [tasaValor, setTasaValor] = useState(18);
  const [origen, setOrigen] = useState('anual');
  const [destino, setDestino] = useState('mensual');
  const [tipoOrigen, setTipoOrigen] = useState('nominal');
  const [tipoDestino, setTipoDestino] = useState('efectiva');

  const { dashboardOn, setDashboardOn, tutorialOn, setTutorialOn, discreteOn, setDiscreteOn, tutorialStep, setTutorialStep } = useModes();

  const tOrigen = getTemporalidad(origen);
  const tDestino = getTemporalidad(destino);
  
  const tea = calcularTEADesdeOrigen(tasaValor, tipoOrigen, origen);
  const tasaDestino = calcularTasaDestinoDesdeTEA(tea, tipoDestino, destino);
  const periodicaDestino = destino === 'continua' 
    ? null 
    : (tipoDestino === 'nominal' ? tasaDestino / 100 / tDestino.m : tasaDestino / 100);

  const chartData = TEMPORALIDADES.map((t) => ({
    temporalidad: t.label,
    'Tasa equivalente': calcularTasaDestinoDesdeTEA(tea, tipoDestino, t.key),
  }));

  const opcionesTemporalidad = TEMPORALIDADES.map((t) => ({ value: t.key, label: t.label }));
  const opcionesTipo = [
    { value: 'nominal', label: 'Nominal' },
    { value: 'efectiva', label: 'Efectiva' }
  ];

  function getFormulaDisplay() {
    const j = (tasaValor / 100).toFixed(4);
    const teaStr = tea.toFixed(4);
    const teaValue = (tea * 100).toFixed(4);
    const destValue = tasaDestino.toFixed(4);
    const periodicValue = periodicaDestino ? (periodicaDestino * 100).toFixed(4) : '—';

    const origenLabel = tipoOrigen === 'nominal' ? 'Nominal' : 'Efectiva';
    const destinoLabel = tipoDestino === 'nominal' ? 'Nominal' : 'Efectiva';
    const origenTemp = tOrigen.label.toLowerCase();
    const destTemp = tDestino.label.toLowerCase();
    const m = tOrigen.m;
    const m2 = tDestino.m;

    let pasoOrigen;
    if (origen === 'continua') {
      pasoOrigen = {
        etiqueta: 'Paso 1 · Continua → TEA',
        formula: <>TEA = <Pow base="e" exp={<Var>j</Var>} /> − 1</>,
        valores: <>TEA = <Pow base="e" exp={j} /> − 1 = {teaValue}%</>,
        texto: `TEA = e^${j} − 1 = ${teaValue}%`,
      };
    } else if (tipoOrigen === 'nominal') {
      pasoOrigen = {
        etiqueta: `Paso 1 · Nominal (${origenTemp}) → TEA`,
        formula: <>TEA = <Pow base={<>(1 + <Frac num={<Var>j</Var>} den={<Var>m</Var>} />)</>} exp={<Var>m</Var>} /> − 1</>,
        valores: <>TEA = <Pow base={<>(1 + <Frac num={j} den={m} />)</>} exp={m} /> − 1 = {teaValue}%</>,
        texto: `Se divide la tasa nominal entre ${m} (capitalizaciones/año del origen) y el resultado se eleva a ${m}: TEA = (1 + ${j}/${m})^${m} − 1 = ${teaValue}%`,
      };
    } else {
      pasoOrigen = {
        etiqueta: `Paso 1 · Efectiva (${origenTemp}) → TEA`,
        formula: <>TEA = <Pow base={<>(1 + <Var>i</Var>)</>} exp={<Var>m</Var>} /> − 1</>,
        valores: <>TEA = <Pow base={<>(1 + {j})</>} exp={m} /> − 1 = {teaValue}%</>,
        texto: `TEA = (1 + ${j})^${m} − 1 = ${teaValue}%`,
      };
    }

    let pasoDestino;
    if (destino === 'continua') {
      pasoDestino = {
        etiqueta: 'Paso 2 · TEA → Continua',
        formula: <><Var>j</Var><Sub>2</Sub> = ln(1 + <Var>TEA</Var>)</>,
        valores: <>j₂ = ln(1 + {teaStr}) = {destValue}%</>,
        texto: `j₂ = ln(1 + ${teaStr}) = ${destValue}%`,
      };
    } else if (tipoDestino === 'nominal') {
      pasoDestino = {
        etiqueta: `Paso 2 · TEA → Nominal (${destTemp})`,
        formula: <><Var>j</Var><Sub>2</Sub> = <Var>m</Var><Sub>2</Sub> · [<Pow base={<>(1 + <Var>TEA</Var>)</>} exp={<Frac num="1" den={<><Var>m</Var><Sub>2</Sub></>} />} /> − 1]</>,
        valores: <>j₂ = {m2} · [<Pow base={<>(1 + {teaStr})</>} exp={<Frac num="1" den={m2} />} /> − 1] = {destValue}%</>,
        texto: `Primero se eleva (1 + TEA) a 1/${m2} (se divide el exponente entre ${m2}, las capitalizaciones/año del destino), y luego el resultado se multiplica por ${m2}: j₂ = ${m2} · [(1+${teaStr})^(1/${m2}) − 1] = ${destValue}%`,
      };
    } else {
      pasoDestino = {
        etiqueta: `Paso 2 · TEA → Efectiva (${destTemp})`,
        formula: <><Var>i</Var><Sub>2</Sub> = <Pow base={<>(1 + <Var>TEA</Var>)</>} exp={<Frac num="1" den={<Var>m</Var>} />} /> − 1</>,
        valores: <>i₂ = <Pow base={<>(1 + {teaStr})</>} exp={<Frac num="1" den={m2} />} /> − 1 = {destValue}%</>,
        texto: `Se eleva (1 + TEA) a 1/${m2} (se divide el exponente entre ${m2}): i₂ = (1+${teaStr})^(1/${m2}) − 1 = ${destValue}%`,
      };
    }

    const variables = [];
    if (origen === 'continua') {
      variables.push({ simbolo: 'j', desc: 'Tasa nominal continua (origen)' }, { simbolo: 'e', desc: 'Constante de Euler (≈ 2.71828)' });
    } else if (tipoOrigen === 'nominal') {
      variables.push({ simbolo: 'j', desc: 'Tasa nominal anual (origen)' }, { simbolo: 'm', desc: `Capitalizaciones/año origen (${origenTemp} = ${m})` });
    } else {
      variables.push({ simbolo: 'i', desc: 'Tasa efectiva del periodo origen' }, { simbolo: 'm', desc: `Capitalizaciones/año origen (${origenTemp} = ${m})` });
    }
    variables.push({ simbolo: 'TEA', desc: 'Tasa efectiva anual (puente entre ambas)' });
    if (destino === 'continua') {
      variables.push({ simbolo: 'j₂', desc: 'Tasa nominal continua destino' });
    } else if (tipoDestino === 'nominal') {
      variables.push({ simbolo: 'm₂', desc: `Capitalizaciones/año destino (${destTemp} = ${m2})` }, { simbolo: 'j₂', desc: 'Tasa nominal destino' });
    } else {
      variables.push({ simbolo: 'm₂', desc: `Capitalizaciones/año destino (${destTemp} = ${m2})` }, { simbolo: 'i₂', desc: 'Tasa efectiva destino' });
    }

    return {
      titulo: `${origenLabel} ${origen === 'continua' ? 'Continua' : `(${origenTemp})`} → ${destinoLabel} ${destino === 'continua' ? 'Continua' : `(${destTemp})`}`,
      pasoOrigen,
      pasoDestino,
      variables,
      pasos: [pasoOrigen.texto, pasoDestino.texto],
      periodic: periodicValue,
    };
  }

  const formulaData = getFormulaDisplay();

  const tutorialSteps = [
    { index: 0, titulo: '🔄 Tasas Equivalentes', texto: 'Elige la tasa de origen (nominal o efectiva) y la temporalidad hacia la que quieres convertirla.', consejo: 'La TEA es el "puente" para comparar tasas con distinta capitalización.' },
    { index: 1, titulo: '📐 Lee el desarrollo del cálculo', texto: 'La sección "Desarrollo del cálculo" muestra la fórmula general y luego la misma fórmula con tus valores reemplazados.', consejo: 'Compara la fórmula general con la fórmula con valores para entender cada paso.' },
    { index: 2, titulo: '📊 El gráfico de equivalencias', texto: 'La barra final muestra la misma TEA expresada en cada capitalización posible: todas representan el mismo rendimiento.', consejo: 'Por eso se llaman tasas "equivalentes": distinto número, mismo resultado real.' },
  ];

  return (
    <div className="space-y-6">
      <ControlPanel 
        dashboardOn={dashboardOn} setDashboardOn={setDashboardOn}
        tutorialOn={tutorialOn} setTutorialOn={setTutorialOn}
        discreteOn={discreteOn} setDiscreteOn={setDiscreteOn}
        onReset={() => { setTasaValor(18); setOrigen('anual'); setDestino('mensual'); setTipoOrigen('nominal'); setTipoDestino('efectiva'); }}
      />

      {discreteOn && (
        <div className="cx-bg-surface border-l-4 border-purple-400 rounded-r-lg p-4 mb-4 mode-discrete no-print">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-sm">Σ</span>
            <span className="text-xs font-bold cx-text-accent-primary uppercase tracking-wide">Sumatoria</span>

  const esContinua = tipo === 'compuesto' && temporalidad === 'continua';

  const r = esContinua ? 0 : tasaPeriodica(tasaNominal, temporalidad);

    setTipo(nuevoTipo);
    if (nuevoTipo === 'simple' && temporalidad === 'continua') setTemporalidad('mensual');

  const resultadoContinuo = useMemo(() => calcularContinuo(P, tasaNominal, anios), [P, tasaNominal, anios]);

    if (tipo === 'simple') return calcularSimple(P, r, n);
    return calcularCompuesto(P, r, n);
  }, [tipo, P, r, n]);

  const chartData = resultado.rows?.map((row) => ({ periodo: row.t, Capital: row.capital, Interés: row.interes })) || [];
  const evolutionData = resultado.rows?.map((row) => ({ mes: row.t, Saldo: row.saldoFinal })) || [];

    { index: 2, titulo: '🧮 Lee el gráfico de barras', texto: 'La barra apilada muestra cuánto del saldo es capital original y cuánto es interés acumulado en cada periodo.', consejo: 'Con interés compuesto, la porción de "interés" crece cada vez más rápido.' },

                <Var>S</Var><Sub>t</Sub> = <Var>S</Var><Sub>t−1</Sub> + <Var>P</Var> · <Var>r</Var>

            <div className="flex items-center gap-2 mb-2">
              <span className="text-sm">📈</span>

              <span className="text-[9px] cx-text-text-muted bg-cx-bg-surface px-2 py-0.5 rounded-full">Modo Académico</span>
            </div>
            <div className="bg-white dark:bg-black/20 rounded-lg p-4 mb-3 border cx-border-border shadow-sm">

    const rows = [];
    let saldo = P;
    let interesAcumulado = 0;

    const extrasMap = {};
    extras.forEach(e => {
      if (e.tipo === 'individual') {
        if (!extrasMap[e.mes]) extrasMap[e.mes] = 0;
        extrasMap[e.mes] += e.monto;
      } else if (e.tipo === 'rango') {
        for (let m = e.mes; m <= e.mesFin; m++) {
          if (!extrasMap[m]) extrasMap[m] = 0;
          extrasMap[m] += e.monto;
        }
      }
    });

    if (sistema === 'francesa') {
      const pago = r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n));
      for (let t = 1; t <= n; t++) {
        const interes = saldo * r;
        interesAcumulado += interes;
        let capital = pago - interes;
        let saldoFinal = saldo - capital;
        const extra = extrasMap[t] || 0;
        if (extra > 0) {
          saldoFinal = Math.max(0, saldoFinal - extra);
          capital += extra;
        }
        if (t === n) { 
          const ajuste = saldoFinal;
          capital += ajuste;
          saldoFinal = 0; 
        }
        rows.push({ 
          t, 
          saldoInicial: saldo, 
          pago: pago + (extra > 0 ? extra : 0), 
          interes, 
          capital, 
          saldoFinal, 
          extra,
          interesAcumulado: interesAcumulado
        });
        saldo = saldoFinal;
      }
    } else if (sistema === 'alemana') {
      const capitalFijo = P / n;
      for (let t = 1; t <= n; t++) {
        const interes = saldo * r;
        interesAcumulado += interes;
        const pago = capitalFijo + interes;
        let saldoFinal = Math.max(0, saldo - capitalFijo);
        const extra = extrasMap[t] || 0;
        if (extra > 0) {
          saldoFinal = Math.max(0, saldoFinal - extra);
        }
        rows.push({ 
          t, 
          saldoInicial: saldo, 
          pago: pago + extra, 
          interes, 
          capital: capitalFijo + extra, 
          saldoFinal, 
          extra,
          interesAcumulado: interesAcumulado
        });
        saldo = saldoFinal;
      }
    } else {
      for (let t = 1; t <= n; t++) {
        const interes = saldo * r;
        interesAcumulado += interes;
        let capital = t === n ? saldo : 0;
        const pago = interes + capital;
        let saldoFinal = saldo - capital;
        const extra = extrasMap[t] || 0;
        if (extra > 0) {
          saldoFinal = Math.max(0, saldoFinal - extra);
          capital += extra;
        }
        rows.push({ 
          t, 
          saldoInicial: saldo, 
          pago: pago + extra, 
          interes, 
          capital, 
          saldoFinal, 
          extra,
          interesAcumulado: interesAcumulado
        });
        saldo = saldoFinal;
      }
    }
    return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0) };
  }

  const resultado = useMemo(() => {
    if (modo === 'presente') {
      return calcularAmortizacionConExtras(P, r, n, sistema, extras);
    } else {
      let saldo = 0;
      let interesAcumulado = 0;
      const rows = [];
      const extrasMap = {};
      extras.forEach(e => {
        if (e.tipo === 'individual') {
          if (!extrasMap[e.mes]) extrasMap[e.mes] = 0;
          extrasMap[e.mes] += e.monto;
        } else if (e.tipo === 'rango') {
          for (let m = e.mes; m <= e.mesFin; m++) {
            if (!extrasMap[m]) extrasMap[m] = 0;
            extrasMap[m] += e.monto;
          }
        }
      });
      
      for (let t = 1; t <= n; t++) {
        const extra = extrasMap[t] || 0;
        const interes = saldo * r;
        interesAcumulado += interes;
        saldo = saldo * (1 + r) + aporte + extra;
        rows.push({ 
          t, 
          saldoInicial: saldo / (1 + r) - aporte - extra, 
          interes, 
          capital: aporte + extra, 
          saldoFinal: saldo, 
          extra,
          interesAcumulado: interesAcumulado
        });
      }
      return { rows, totalInteres: interesAcumulado, saldoFinal: saldo };
    }
  }, [modo, P, r, n, sistema, aporte, extras]);

  const agregarExtra = () => {

  const eliminarExtra = (index) => {

  };

  const chartData = resultado.rows?.map((row) => ({ periodo: row.t, Capital: row.capital, Interés: row.interes, Extra: row.extra || 0 })) || [];
  const saldoData = resultado.rows?.map((row) => ({ mes: row.t, Saldo: row.saldoFinal })) || [];

    { index: 2, titulo: '💵 Composición del pago', texto: 'El gráfico apilado muestra cuánto de cada cuota es capital y cuánto es interés.', consejo: 'En la Francesa, al inicio pagas mayormente interés; al final, mayormente capital.' },

  const exportPDF = () => {

      {discreteOn && (

          </div>

            <div className="text-center font-serif text-base sm:text-lg" style={{ fontFamily: "'STIX Two Text', 'Cambria Math', serif" }}>
              <Var>S</Var><Sub>t</Sub> = <Var>S</Var><Sub>t−1</Sub> · (1+<Var>r</Var>) − <Var>C</Var>
            </div>
          </div>

      <div className="flex flex-wrap gap-2 no-print">

      {chartData.length > 0 && (
        <div>

          <p className="text-xs cx-text-text-muted mt-2">
            {modo === 'presente' ? (
              sistema === 'francesa' ? 'El pago total es siempre el mismo, pero su composición cambia.' :
              sistema === 'alemana' ? 'El capital que pagas es siempre el mismo.' :
              'Solo pagas interés hasta el último periodo.'
            ) : (
              'El ahorro crece con el interés compuesto sobre el capital acumulado.'
            )}
          </p>
        </div>
      )}

      {saldoData.length > 0 && (
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <LineChartIcon size={16} className="cx-text-accent-primary flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">
              {modo === 'presente' ? 'Evolución del saldo pendiente' : 'Evolución del ahorro'}
            </span>
          </div>
          <LineChartComponent 
            data={saldoData}
            lines={['Saldo']}
            colors={['var(--accent-primary)']}
            label="Periodo"
            referenceLine={modo === 'futuro' ? metaFuturo : undefined}
          />
        </div>
      )}

      {mostrarComparador && (
        <ComparadorAmortizacion 
          mostrar={mostrarComparador}
          onClose={() => setMostrarComparador(false)}
          P={P}
          tasaNominal={tasaNominal}
          temporalidad={temporalidad}
          n={n}
        />
      )}

      {tutorialOn && (
        <TutorialStep 
          step={tutorialSteps[tutorialStep]} 
          total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)}
        />
      )}
    </div>
  );
}

function SimuladorTab() {

  const [nuevoExtraMonto, setNuevoExtraMonto] = useState(100);
  const [nuevoExtraMesFin, setNuevoExtraMesFin] = useState(3);

  const { dashboardOn, setDashboardOn, tutorialOn, setTutorialOn, discreteOn, setDiscreteOn, tutorialStep, setTutorialStep } = useModes();

  const resultados = useMemo(() => {
    const alcancia = simularCamino({ 
      tipo: 'alcancia', 
      monto: objetivo, 
      base: capacidad, 
      extrasUnicos, 
      extrasPeriodicos 
    });
    const ahorroSimple = simularCamino({ 
      tipo: 'ahorroSimple', 
      monto: objetivo, 
      base: capacidad, 
      tasaAnual: tasas.simple, 
      extrasUnicos, 
      extrasPeriodicos 
    });
    const ahorroCompuesto = simularCamino({ 
      tipo: 'ahorroCompuesto', 
      monto: objetivo, 
      base: capacidad, 
      tasaAnual: tasas.compuesto, 
      extrasUnicos, 
      extrasPeriodicos 
    });
    const prestamo = simularCamino({ 
      tipo: 'deuda', 
      monto: objetivo, 
      base: capacidad, 
      tasaAnual: tasas.prestamo, 
      extrasUnicos, 
      extrasPeriodicos 
    });
    const tarjeta = simularCamino({ 
      tipo: 'deuda', 
      monto: objetivo, 
      base: capacidad, 
      tasaAnual: tasas.tarjeta, 
      extrasUnicos, 
      extrasPeriodicos 
    });
    return { alcancia, ahorroSimple, ahorroCompuesto, prestamo, tarjeta };
  }, [objetivo, capacidad, tasas, extrasUnicos, extrasPeriodicos]);

  const setTasa = (key) => (e) => setTasas((t) => ({ ...t, [key]: parseFloat(e.target.value) || 0 }));

  const agregarExtra = () => {
    if (nuevoExtraMonto <= 0) return;
    if (nuevoExtraTipo === 'individual') {
      if (nuevoExtraMes < 1 || nuevoExtraMes > LIMITES.MESES_MAX) return;
      setExtrasUnicos([...extrasUnicos, { mes: nuevoExtraMes, monto: nuevoExtraMonto }]);
    } else {
      if (nuevoExtraMes < 1 || nuevoExtraMesFin > LIMITES.MESES_MAX || nuevoExtraMes > nuevoExtraMesFin) return;
      setExtrasPeriodicos([...extrasPeriodicos, { mes: nuevoExtraMes, mesFin: nuevoExtraMesFin, monto: nuevoExtraMonto }]);
    }
    setNuevoExtraMes(1);
    setNuevoExtraMesFin(3);
    setNuevoExtraMonto(100);

    const step = Math.max(1, Math.floor(maxM / LIMITES.PUNTOS_GRAFICO));
    for (let m = 0; m <= maxM && data.length < LIMITES.PUNTOS_GRAFICO; m += step) {

        mes: m,
        Alcancía: resultados.alcancia.serie[m]?.saldo ?? resultados.alcancia.serie[resultados.alcancia.serie.length - 1]?.saldo,

        'Ahorro Compuesto': resultados.ahorroCompuesto.serie[m]?.saldo,
      });
    }
    const lastIdx = maxM;
    if (data[data.length - 1]?.mes !== lastIdx) {
      data.push({
        mes: lastIdx,
        Alcancía: resultados.alcancia.serie[lastIdx]?.saldo ?? resultados.alcancia.serie[resultados.alcancia.serie.length - 1]?.saldo,
        'Ahorro Simple': resultados.ahorroSimple.serie[lastIdx]?.saldo,
        'Ahorro Compuesto': resultados.ahorroCompuesto.serie[lastIdx]?.saldo,
      });
    }
    return data;

  const deudaChart = useMemo(() => {
    const maxM = Math.min(240, Math.max(

      isFinite(resultados.tarjeta.meses) ? resultados.tarjeta.meses : 60,

    ));
    const data = [];
    const step = Math.max(1, Math.floor(maxM / LIMITES.PUNTOS_GRAFICO));
    for (let m = 0; m <= maxM && data.length < LIMITES.PUNTOS_GRAFICO; m += step) {
      data.push({
        mes: m,
        Préstamo: resultados.prestamo.serie[m]?.saldo ?? 0,
        'Tarjeta Crédito': resultados.tarjeta.serie[m]?.saldo ?? (resultados.tarjeta.nuncaPaga ? objetivo : 0),
      });
    }
    const lastIdx = maxM;
    if (data[data.length - 1]?.mes !== lastIdx) {
      data.push({
        mes: lastIdx,
        Préstamo: resultados.prestamo.serie[lastIdx]?.saldo ?? 0,
        'Tarjeta Crédito': resultados.tarjeta.serie[lastIdx]?.saldo ?? (resultados.tarjeta.nuncaPaga ? objetivo : 0),

  const paths = [
    { key: 'alcancia', label: 'Alcancía', icon: Wallet, tipo: 'ahorro', tipoSim: 'alcancia', meses: resultados.alcancia.meses, interes: 0, editable: false, nuncaPaga: false },

    { key: 'compuesto', label: 'Ahorro Compuesto', icon: TrendingUp, tipo: 'ahorro', tipoSim: 'ahorroCompuesto', meses: resultados.ahorroCompuesto.meses, interes: resultados.ahorroCompuesto.totalInteres, editable: true, tasaKey: 'compuesto', nuncaPaga: false },
    { key: 'prestamo', label: 'Préstamo', icon: Landmark, tipo: 'deuda', tipoSim: 'deuda', meses: resultados.prestamo.meses, interes: resultados.prestamo.totalInteres, editable: true, tasaKey: 'prestamo', nuncaPaga: resultados.prestamo.nuncaPaga },
    { key: 'tarjeta', label: 'Tarjeta Crédito', icon: CreditCard, tipo: 'deuda', tipoSim: 'deuda', meses: resultados.tarjeta.meses, interes: resultados.tarjeta.totalInteres, editable: true, tasaKey: 'tarjeta', nuncaPaga: resultados.tarjeta.nuncaPaga },

  const detalleResultado = detalle ? resultados[RESULTADOS_KEY_SIMULADOR[detalle.key]] : null;

  const detalleSerieTabla = useMemo(() => sampleSerie(detalleSerieRecortada, LIMITES.FILAS_TABLA), [detalleSerieRecortada]);

    const serie = detalleResultado.serie;

      const actual = serie[i];

        periodo: actual.mes,
        saldoAnterior: anterior.saldo,
        interes: interes > 0 ? interes : 0,
        saldoActual: actual.saldo,
        aporte: capacidad
      });

    return sampleSerie(rows, LIMITES.FILAS_TABLA);
  }, [detalleResultado, detalle, capacidad]);

  const tutorialSteps = [
    { index: 0, titulo: '🎯 Simulador de Destinos', texto: 'Ingresa un monto objetivo y cuánto puedes aportar o pagar cada mes; el simulador compara 5 caminos financieros.', consejo: 'Los caminos verdes son ahorro; los rojos son deudas.' },
    { index: 1, titulo: '⚠️ Cuidado con la tarjeta de crédito', texto: 'Si la tasa es muy alta y tu pago mensual es bajo, la tarjeta puede marcar "nunca paga".', consejo: 'Eso significa que el pago no alcanza ni para cubrir el interés generado.' },
    { index: 2, titulo: '📈 Compara los caminos', texto: 'Los gráficos de línea muestran cómo evoluciona cada camino mes a mes hacia tu meta (o hacia cero deuda).', consejo: 'Ajusta la tasa de cada camino para ver el impacto en el tiempo total.' },

        <Field label="Capacidad mensual" suffix="$" value={capacidad} onChange={setCapacidad} min={1} step={10} tooltip="Cantidad que puedes aportar o pagar cada mes" />

                  <span className="cx-text-accent-green-text font-semibold">{fmt(e.monto)}</span>

            </div>
          </div>
        )}
        {extrasPeriodicos.length > 0 && (
          <div className="mt-3">
            <div className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Pagos periódicos</div>
            <div className="flex flex-wrap gap-2 mt-1">
              {extrasPeriodicos.map((e, i) => (
                <div key={i} className="flex items-center gap-2 cx-bg-surface-alt border cx-border-border rounded-md px-3 py-1.5 text-xs">
                  <span className="cx-text-text-secondary">Meses {e.mes}-{e.mesFin}</span>
                  <span className="cx-text-accent-green-text font-semibold">{fmt(e.monto)}</span>
                  <button onClick={() => eliminarExtraPeriodico(i)} className="cx-text-text-faint hover:cx-text-accent-coral-text">
                    <X size={14} />
                  </button>
                </div>
              ))}

          </div>

        {extrasUnicos.length === 0 && extrasPeriodicos.length === 0 && (

          return (
            <div key={p.key} className={`cx-bg-surface border-2 rounded-lg p-4 flex flex-col gap-3 ${isDeuda ? 'cx-border-accent-coral-border' : 'cx-border-border'}`}>
              <div className="flex items-center gap-2">
                <div className={`p-1.5 rounded-full ${isDeuda ? 'cx-bg-accent-coral-bg cx-text-accent-coral-text' : 'cx-bg-accent-green-bg cx-text-accent-green-text'}`}>
                  <Icon size={16} />
                </div>
                <span className="font-semibold cx-text-text-primary text-sm" style={{ fontFamily: "'Fraunces', sans-serif" }}>{p.label}</span>
              </div>
              {p.editable && (
                <div className="form-group">
                  <label className="form-label">Tasa anual</label>
                  <div className="relative">
                    <input

                      value={tasas[p.tasaKey]}

                      className="form-input" 
                      min="0" 
                      max="100" 
                      step="0.1"
                    />
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm cx-text-text-faint">%</span>
                  </div>
                </div>

              {p.nuncaPaga ? (
                <div className="flex items-start gap-1.5 cx-text-accent-coral-text text-sm cx-bg-accent-coral-bg rounded-lg px-3 py-2">
                  <AlertTriangle size={14} className="mt-0.5 flex-shrink-0" />

                </div>
              ) : (

                  <div>
                    <div className="text-[11px] uppercase tracking-wide cx-text-text-muted">{isDeuda ? 'Tiempo para pagarla' : 'Tiempo para lograrlo'}</div>
                    <div className="text-lg" style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{monthsToYears(p.meses)}</div>
                  </div>
                  <div>
                    <div className="text-[11px] uppercase tracking-wide cx-text-text-muted">{isDeuda ? 'Interés total pagado' : 'Interés total ganado'}</div>
                    <div className={`text-sm font-semibold ${isDeuda ? 'cx-text-accent-coral-text' : 'cx-text-accent-green-text'}`}>{fmt(p.interes)}</div>

                Analizar este destino <RotateCcw size={12} />
              </button>
            </div>

            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Caminos de ahorro</span>
          </div>
          <LineChartComponent 
            data={ahorroChart}
            lines={['Alcancía', 'Ahorro Simple', 'Ahorro Compuesto']}
            colors={['var(--chart-axis)', 'var(--accent-primary)', 'var(--accent-green)']}
            label="Meses"
            referenceLine={objetivo}
          />
        </div>
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <LineChartIcon size={16} className="cx-text-accent-coral-text flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Caminos de deuda</span>
          </div>
          <LineChartComponent 
            data={deudaChart}
            lines={['Préstamo', 'Tarjeta Crédito']}
            colors={['var(--accent-primary)', 'var(--accent-coral)']}
            label="Meses"
          />
        </div>
      </div>

      {detalle && (
        <Modal onClose={() => setDetalle(null)} size="xwide">
          <div className="flex items-center gap-2 cx-text-accent-primary-text font-semibold text-sm mb-1">

          <p className="text-sm cx-text-text-secondary mb-4">
            {detalle.tipo === 'deuda' ? 'Prueba qué pasa si abonas un poco más cada mes.' : 'Prueba qué pasa si aportas un poco más cada mes.'}
          </p>

          {detalleResultado?.nuncaPaga ? (
            <div className="flex items-start gap-2 cx-text-accent-coral-text text-sm cx-bg-accent-coral-bg rounded-lg px-3 py-2.5 mb-4">
              <AlertTriangle size={15} className="mt-0.5 flex-shrink-0" />

            </div>

                          <tr>
                            <th className="text-left px-3 py-2 font-semibold cx-text-text-muted">Periodo</th>
                            <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Saldo anterior</th>
                            <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Interés</th>
                            <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Saldo actual</th>
                            <th className="text-center px-3 py-2 font-semibold cx-text-text-muted">Detalle</th>

                              tasaMensual={detalle.tipo === 'ahorro' ? (detalle.tasaKey ? tasas[detalle.tasaKey] / 100 / 12 : 0) : 0}

              {mostrarTablaCompleta ? 'Ocultar tabla detallada' : 'Mostrar tabla detallada'}
            </button>
            <button onClick={() => setDetalle(null)} className="py-2 px-4 rounded-lg text-sm font-semibold text-white" style={{ background: 'var(--accent-primary)' }}>Cerrar</button>
          </div>

          {mostrarTablaCompleta && detalleResultado && !detalleResultado.nuncaPaga && (
            <div className="mt-4 border cx-border-border rounded-lg overflow-hidden table-responsive">
              <div className="overflow-y-auto" style={{ maxHeight: 400 }}>
                <table className="w-full text-xs detalle-tabla">
                  <thead className="sticky top-0 cx-bg-surface-alt">
                    <tr>
                      <th className="text-left font-semibold cx-text-text-muted">Mes</th>
                      <th className="text-right font-semibold cx-text-text-muted">Saldo inicial</th>
                      <th className="text-right font-semibold cx-text-text-muted">Interés</th>
                      <th className="text-right font-semibold cx-text-text-muted">Pago</th>
                      <th className="text-right font-semibold cx-text-text-muted">Saldo final</th>
                    </tr>
                  </thead>
                  <tbody>
                    {detalleSerieTabla.map((row, idx) => {
                      const anterior = idx > 0 ? detalleSerieTabla[idx - 1] : row;
                      const interes = detalle.tipo === 'deuda' ? (anterior.saldo * (tasas[detalle.tasaKey] / 100 / 12)) : 0;
                      const pago = detalle.tipo === 'deuda' ? capacidad : 0;
                      return (
                        <tr key={row.mes} className="border-t cx-border-border">
                          <td className="px-3 py-1.5 cx-text-text-secondary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{row.mes}</td>
                          <td className="px-3 py-1.5 text-right cx-text-text-secondary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(anterior.saldo)}</td>
                          <td className="px-3 py-1.5 text-right cx-text-accent-coral-text" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(interes)}</td>
                          <td className="px-3 py-1.5 text-right cx-text-accent-green-text" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(pago)}</td>
                          <td className="px-3 py-1.5 text-right cx-text-text-primary font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.saldo)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </Modal>
      )}

      {tutorialOn && (
        <TutorialStep 
          step={tutorialSteps[tutorialStep]} 
          total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)}
        />
      )}
    </div>
  );
}

// ============================================================
// QUIZ TAB - 10 NIVELES COMPLETOS
// ============================================================
function QuizTab() {
  const [modo, setModo] = useState('quiz');
  const [nivel, setNivel] = useState(1);
  const [pregunta, setPregunta] = useState(null);
  const [respuestaTexto, setRespuestaTexto] = useState('');
  const [verificado, setVerificado] = useState(false);
  const [correcto, setCorrecto] = useState(false);
  const [puntaje, setPuntaje] = useState({ aciertos: 0, total: 0 });
  const [mostrarInforme, setMostrarInforme] = useState(false);

  const [temasSeleccionados, setTemasSeleccionados] = useState([]);
  const [dificultadEval, setDificultadEval] = useState('medio');
  const [evaluacionActiva, setEvaluacionActiva] = useState(false);
  const [preguntasEval, setPreguntasEval] = useState([]);
  const [preguntaEvalIndex, setPreguntaEvalIndex] = useState(0);
  const [respuestasEval, setRespuestasEval] = useState([]);
  const [evaluacionCompletada, setEvaluacionCompletada] = useState(false);
  const [respuestaEvalTexto, setRespuestaEvalTexto] = useState('');
  const [evalVerificado, setEvalVerificado] = useState(false);
  const [evalCorrecto, setEvalCorrecto] = useState(false);

  const { dashboardOn, setDashboardOn, tutorialOn, setTutorialOn, discreteOn, setDiscreteOn, tutorialStep, setTutorialStep } = useModes();

  const TEMAS = [
    { id: 'interes_simple', label: 'Interés Simple', icon: '📊' },
    { id: 'interes_compuesto', label: 'Interés Compuesto', icon: '📈' },
    { id: 'tasas_equivalentes', label: 'Tasas Equivalentes', icon: '🔄' },
    { id: 'valor_presente', label: 'Valor Presente', icon: '💰' },
    { id: 'anualidades', label: 'Anualidades y Préstamos', icon: '🏦' },
    { id: 'problemas_integradores', label: 'Problemas Integradores', icon: '🧩' },
  ];

  const DIFICULTADES = [
    { id: 'facil', label: '🌟 Fácil', color: 'text-emerald-600' },
    { id: 'medio', label: '⚡ Medio', color: 'text-blue-600' },
    { id: 'dificil', label: '🔥 Difícil', color: 'text-orange-600' },
    { id: 'experto', label: '💎 Experto', color: 'text-purple-600' },
    { id: 'master', label: '👑 Master', color: 'text-red-600' },
  ];

  const NIVELES_POR_TEMA = {
    interes_simple: [1, 2],
    interes_compuesto: [3, 4],
    tasas_equivalentes: [5, 6],
    valor_presente: [7],
    anualidades: [8],
    problemas_integradores: [9, 10],
  };

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randChoice(arr) { return arr[randInt(0, arr.length - 1)]; }
  function round2(n) { return Math.round(n * 100) / 100; }

  function dentroDeToleranciaQ(valorUsuario, correcto, unidad) {
    if (!isFinite(valorUsuario)) return false;
    if (unidad === '$') { const tol = Math.max(1, Math.abs(correcto) * 0.01); return Math.abs(valorUsuario - correcto) <= tol; }
    if (unidad === '%') { return Math.abs(valorUsuario - correcto) <= 0.15; }
    if (unidad === 'periodos') { return Math.abs(valorUsuario - correcto) <= 0.3; }
    if (unidad === 'años') { return Math.abs(valorUsuario - correcto) <= 0.15; }
    return Math.abs(valorUsuario - correcto) <= Math.abs(correcto) * 0.02;
  }

  // ============================================================
  // 10 GENERADORES DE PREGUNTAS
  // ============================================================

  function nivel1_interesSimpleGanado() {
    const P = randInt(5, 50) * 1000;
    const r = randInt(4, 24);
    const t = randInt(2, 12);
    const interes = P * (r / 100) * t;
    return {
      categoria: 'Interés Simple',
      enunciado: `Depositas **${fmt(P)}** en una cuenta que paga una tasa de interés simple del **${r}% anual**. ¿Cuánto interés habrás ganado después de **${t} años**?`,
      unidad: '$',
      respuesta: round2(interes),
      solucion: [
        `Fórmula: I = P · r · t`,
        `I = ${fmt(P)} · ${(r / 100).toFixed(2)} · ${t}`,
        `I = ${fmt(interes)}`
      ],
    };
  }

  function nivel2_interesSimpleMontoFinal() {
    const P = randInt(5, 60) * 1000;
    const r = randInt(3, 20);
    const t = randInt(1, 10);
    const F = P * (1 + (r / 100) * t);
    return {
      categoria: 'Interés Simple',
      enunciado: `Un capital de **${fmt(P)}** se invierte a interés simple con una tasa del **${r}% anual** durante **${t} años**. ¿Cuál es el monto final?`,
      unidad: '$',
      respuesta: round2(F),
      solucion: [
        `Fórmula: F = P · (1 + r · t)`,
        `F = ${fmt(P)} · (1 + ${(r / 100).toFixed(2)} · ${t})`,
        `F = ${fmt(F)}`
      ],
    };
  }

  function nivel3_interesCompuestoMontoFinal() {
    const P = randInt(5, 60) * 1000;
    const r = randInt(3, 20);
    const t = randInt(2, 10);
    const F = P * Math.pow(1 + r / 100, t);
    return {
      categoria: 'Interés Compuesto',
      enunciado: `Un capital de **${fmt(P)}** se invierte a interés compuesto con una tasa del **${r}% anual** durante **${t} años**. ¿Cuál es el monto final?`,
      unidad: '$',
      respuesta: round2(F),
      solucion: [
        `Fórmula: F = P · (1 + r)ᵗ`,
        `F = ${fmt(P)} · (1 + ${(r / 100).toFixed(2)})^${t}`,
        `F = ${fmt(F)}`
      ],
    };
  }

  function nivel4_interesCompuestoPeriodos() {
    const P = randInt(5, 40) * 1000;
    const r = randInt(4, 18);
    const t = randInt(3, 12);
    const F = round2(P * Math.pow(1 + r / 100, t));
    const nExacto = Math.log(F / P) / Math.log(1 + r / 100);
    return {
      categoria: 'Interés Compuesto',
      enunciado: `Un capital de **${fmt(P)}** crece a interés compuesto con una tasa del **${r}% anual** hasta llegar a **${fmt(F)}**. ¿Cuántos años tomó ese crecimiento?`,
      unidad: 'periodos',
      respuesta: round2(nExacto),
      solucion: [
        `Fórmula: n = ln(F/P) / ln(1 + r)`,
        `n = ln(${fmt(F)}/${fmt(P)}) / ln(1 + ${(r / 100).toFixed(2)})`,
        `n ≈ ${nExacto.toFixed(2)} años`
      ],
    };
  }

  function nivel5_teaDesdeNominal() {
    const j = randInt(8, 36);
    const mOpciones = [2, 4, 12];
    const m = randChoice(mOpciones);
    const mLabel = m === 2 ? 'semestral' : m === 4 ? 'trimestral' : 'mensual';
    const tea = (Math.pow(1 + (j / 100) / m, m) - 1) * 100;
    return {
      categoria: 'Tasas Equivalentes',
      enunciado: `Un banco ofrece una tasa nominal del **${j}% anual con capitalización ${mLabel}**. ¿Cuál es la tasa efectiva anual (TEA)?`,
      unidad: '%',
      respuesta: round2(tea),
      solucion: [
        `Fórmula: TEA = (1 + j/m)ᵐ − 1`,
        `TEA = (1 + ${(j / 100).toFixed(4)}/${m})^${m} − 1`,
        `TEA ≈ ${tea.toFixed(2)}%`
      ],
    };
  }

  function nivel6_nominalDesdeTEA() {
    const tea = randInt(10, 40);
    const mOpciones = [2, 4, 12];
    const m = randChoice(mOpciones);
    const mLabel = m === 2 ? 'semestral' : m === 4 ? 'trimestral' : 'mensual';
    const j = (Math.pow(1 + tea / 100, 1 / m) - 1) * m * 100;
    return {
      categoria: 'Tasas Equivalentes',
      enunciado: `Sabiendo que la tasa efectiva anual (TEA) es del **${tea}%**, ¿cuál es la tasa nominal anual con capitalización ${mLabel} equivalente?`,
      unidad: '%',
      respuesta: round2(j),
      solucion: [
        `Fórmula: j = m · [(1 + TEA)^(1/m) − 1]`,
        `j = ${m} · [(1 + ${(tea / 100).toFixed(2)})^(1/${m}) − 1]`,
        `j ≈ ${j.toFixed(2)}%`
      ],
    };
  }

  function nivel7_valorPresente() {
    const F = randInt(10, 80) * 1000;
    const r = randInt(4, 20);
    const n = randInt(2, 10);
    const VP = F / Math.pow(1 + r / 100, n);
    return {
      categoria: 'Valor Presente',
      enunciado: `Quieres recibir **${fmt(F)}** dentro de **${n} años**. Si la tasa de descuento anual es del **${r}%**, ¿cuánto debes invertir hoy (valor presente)?`,
      unidad: '$',
      respuesta: round2(VP),
      solucion: [
        `Fórmula: VP = F / (1 + r)ⁿ`,
        `VP = ${fmt(F)} / (1 + ${(r / 100).toFixed(2)})^${n}`,
        `VP = ${fmt(VP)}`
      ],
    };
  }

  function nivel8_anualidadCuotaFija() {
    const P = randInt(5, 30) * 1000;
    const rAnual = randInt(12, 30);
    const n = randInt(6, 24);
    const r = rAnual / 100 / 12;
    const C = (P * r) / (1 - Math.pow(1 + r, -n));
    return {
      categoria: 'Anualidades',
      enunciado: `Un préstamo de **${fmt(P)}** se paga en **${n} cuotas mensuales iguales** (sistema francés), con una tasa nominal del **${rAnual}% anual** capitalizada mensualmente. ¿Cuál es el valor de cada cuota?`,
      unidad: '$',
      respuesta: round2(C),
      solucion: [
        `Fórmula: C = (P · r) / (1 − (1+r)⁻ⁿ), con r = tasa mensual`,
        `r = ${rAnual}% / 12 = ${(r * 100).toFixed(4)}% mensual`,
        `C = (${fmt(P)} · ${r.toFixed(6)}) / (1 − (1+${r.toFixed(6)})⁻${n})`,
        `C ≈ ${fmt(C)} por mes`
      ],
    };
  }

  function nivel9_mixtoTiempoEnAnios() {
    const P = randInt(5, 30) * 1000;
    const F = P * randChoice([2, 3, 4]);
    const r = randInt(6, 24);
    const nMeses = Math.log(F / P) / Math.log(1 + r / 100 / 12);
    const anios = nMeses / 12;
    return {
      categoria: 'Problemas Integradores',
      enunciado: `Un capital de **${fmt(P)}** se invierte a interés compuesto con una tasa nominal del **${r}% anual capitalizada mensualmente**. ¿Cuántos **años** (aproximados) tarda en convertirse en **${fmt(F)}**?`,
      unidad: 'años',
      respuesta: round2(anios),
      solucion: [
        `Tasa mensual: r = ${r}% / 12 = ${(r / 12).toFixed(4)}%`,
        `n (meses) = ln(F/P) / ln(1 + r) = ln(${F}/${P}) / ln(1 + ${(r / 100 / 12).toFixed(6)})`,
        `n ≈ ${nMeses.toFixed(1)} meses ≈ ${anios.toFixed(2)} años`
      ],
    };
  }

  function nivel10_problemaDeDestino() {
    const aporte = randInt(50, 400);
    const rAnual = randInt(4, 12);
    const n = randInt(12, 48);
    const r = rAnual / 100 / 12;
    const FV = aporte * ((Math.pow(1 + r, n) - 1) / r);
    return {
      categoria: 'Problemas Integradores',
      enunciado: `Ahorras **${fmt(aporte)} cada mes** en una cuenta que paga **${rAnual}% anual** (capitalización mensual), depositando al final de cada mes. ¿Cuánto tendrás acumulado después de **${n} meses**?`,
      unidad: '$',
      respuesta: round2(FV),
      solucion: [
        `Fórmula (valor futuro de una anualidad): FV = A · [(1+r)ⁿ − 1] / r`,
        `r = ${rAnual}% / 12 = ${(r * 100).toFixed(4)}% mensual`,
        `FV = ${fmt(aporte)} · [(1+${r.toFixed(6)})^${n} − 1] / ${r.toFixed(6)}`,
        `FV ≈ ${fmt(FV)}`
      ],
    };
  }

  const GENERADORES_POR_NIVEL = {
    1: nivel1_interesSimpleGanado,
    2: nivel2_interesSimpleMontoFinal,
    3: nivel3_interesCompuestoMontoFinal,
    4: nivel4_interesCompuestoPeriodos,
    5: nivel5_teaDesdeNominal,
    6: nivel6_nominalDesdeTEA,
    7: nivel7_valorPresente,
    8: nivel8_anualidadCuotaFija,
    9: nivel9_mixtoTiempoEnAnios,
    10: nivel10_problemaDeDestino,
  };

  const NIVELES_META = [
    { nivel: 1, titulo: 'Interés simple · interés generado', tag: 'Interés simple', dificultad: 'Fácil' },
    { nivel: 2, titulo: 'Interés simple · monto final', tag: 'Interés simple', dificultad: 'Fácil' },
    { nivel: 3, titulo: 'Interés compuesto · monto final', tag: 'Interés compuesto', dificultad: 'Fácil' },
    { nivel: 4, titulo: 'Interés compuesto · número de periodos', tag: 'Interés compuesto', dificultad: 'Medio' },
    { nivel: 5, titulo: 'Tasa efectiva anual (TEA)', tag: 'Tasas equivalentes', dificultad: 'Medio' },
    { nivel: 6, titulo: 'Tasa nominal desde la TEA', tag: 'Tasas equivalentes', dificultad: 'Medio' },
    { nivel: 7, titulo: 'Valor presente', tag: 'Valor presente', dificultad: 'Difícil' },
    { nivel: 8, titulo: 'Anualidades · cuota fija', tag: 'Anualidades', dificultad: 'Difícil' },
    { nivel: 9, titulo: 'Mixto · tiempo total en años', tag: 'Problemas integradores', dificultad: 'Experto' },
    { nivel: 10, titulo: 'Problema de destino', tag: 'Problemas integradores', dificultad: 'Master' },
  ];

  function generarPreguntaNivel(nivel) {
    const gen = GENERADORES_POR_NIVEL[nivel] || nivel1_interesSimpleGanado;
    const base = gen();
    const dificultad = nivel <= 3 ? 'facil' : nivel <= 6 ? 'medio' : nivel <= 8 ? 'dificil' : nivel <= 9 ? 'experto' : 'master';
    return { tema: 'nivel', ...base, dificultad };
  }

  function nivelesParaDificultad(niveles, dificultad) {
    if (!niveles || niveles.length === 0) return [1, 1];
    if (niveles.length === 1) return [niveles[0], niveles[0]];
    const facil = niveles[0], dificilN = niveles[niveles.length - 1];
    const rango = dificilN - facil;
    if (dificultad === 'facil') return [facil, Math.min(facil + 1, dificilN)];
    if (dificultad === 'medio') return [facil + Math.floor(rango * 0.2), Math.min(facil + Math.floor(rango * 0.6), dificilN)];
    if (dificultad === 'dificil') return [facil + Math.floor(rango * 0.4), Math.min(facil + Math.floor(rango * 0.8), dificilN)];
    if (dificultad === 'experto') return [Math.max(facil, dificilN - 2), dificilN];
    if (dificultad === 'master') return [dificilN, dificilN];
    return [facil, dificilN];
  }

  useEffect(() => {
    setPregunta(generarPreguntaNivel(1));
  }, []);

  const cambiarNivel = (n) => {
    setNivel(n);
    setPregunta(generarPreguntaNivel(n));
    setRespuestaTexto('');
    setVerificado(false);
    setCorrecto(false);
    setPuntaje({ aciertos: 0, total: 0 });
    setMostrarInforme(false);
  };

  const nuevaPregunta = () => {
    setPregunta(generarPreguntaNivel(nivel));
    setRespuestaTexto('');
    setVerificado(false);
    setCorrecto(false);
  };

  const verificar = () => {
    const valor = parseFloat(respuestaTexto.replace(',', '.'));
    const ok = dentroDeToleranciaQ(valor, pregunta.respuesta, pregunta.unidad);
    setCorrecto(ok);
    setVerificado(true);
    setPuntaje((p) => ({ aciertos: p.aciertos + (ok ? 1 : 0), total: p.total + 1 }));
    if (puntaje.total + 1 >= 5) setMostrarInforme(true);
  };

  const meta = NIVELES_META[nivel - 1] || NIVELES_META[0];

  const seleccionarTodos = () => {
    if (temasSeleccionados.length === TEMAS.length) {
      setTemasSeleccionados([]);
    } else {
      setTemasSeleccionados(TEMAS.map(t => t.id));
    }
  };

  const seleccionarAleatorios = () => {
    const shuffled = [...TEMAS].sort(() => Math.random() - 0.5);
    const seleccionados = shuffled.slice(0, Math.min(3, shuffled.length)).map(t => t.id);
    setTemasSeleccionados(seleccionados);
  };

  const iniciarEvaluacion = () => {
    if (temasSeleccionados.length === 0) return;
    const preguntas = [];
    temasSeleccionados.forEach((temaId) => {
      const niveles = NIVELES_POR_TEMA[temaId] || [1];
      const [n1, n2] = nivelesParaDificultad(niveles, dificultadEval);
      preguntas.push(generarPreguntaNivel(n1));
      if (n1 !== n2) preguntas.push(generarPreguntaNivel(n2));
      else preguntas.push(generarPreguntaNivel(n1));
    });
    setPreguntasEval(preguntas);
    setPreguntaEvalIndex(0);
    setRespuestasEval([]);
    setEvaluacionCompletada(false);
    setRespuestaEvalTexto('');
    setEvalVerificado(false);
    setEvaluacionActiva(true);
  };

  const verificarEval = () => {
    const preguntaActual = preguntasEval[preguntaEvalIndex];
    const valor = parseFloat(respuestaEvalTexto.replace(',', '.'));
    const ok = dentroDeToleranciaQ(valor, preguntaActual.respuesta, preguntaActual.unidad);
    setEvalCorrecto(ok);
    setEvalVerificado(true);
  };

  const siguienteEval = () => {
    setRespuestasEval((prev) => [...prev, { pregunta: preguntasEval[preguntaEvalIndex], correcto: evalCorrecto }]);
    setRespuestaEvalTexto('');
    setEvalVerificado(false);
    if (preguntaEvalIndex + 1 >= preguntasEval.length) {
      setEvaluacionCompletada(true);
      setEvaluacionActiva(false);
    } else {
      setPreguntaEvalIndex((i) => i + 1);
    }
  };

  const reiniciarEvaluacion = () => {
    setEvaluacionActiva(false);
    setEvaluacionCompletada(false);
    setPreguntasEval([]);
    setPreguntaEvalIndex(0);
    setRespuestasEval([]);
  };

  const tutorialSteps = [
    { index: 0, titulo: '📝 Práctica por Niveles', texto: 'Selecciona un nivel del 1 al 10 y resuelve la pregunta. Cada nivel genera números aleatorios.', consejo: 'Comienza por los niveles más bajos para practicar los conceptos básicos.' },
    { index: 1, titulo: '📊 Evaluación Personalizada', texto: 'Selecciona los temas que quieres evaluar, elige la dificultad y genera una evaluación con 2 preguntas por tema.', consejo: 'La dificultad determina qué tan complejas serán las preguntas.' },
    { index: 2, titulo: '✅ Verifica tus respuestas', texto: 'Escribe tu respuesta y presiona "Verificar". Se acepta un pequeño margen de error por redondeo.', consejo: 'Si fallas, la solución paso a paso te muestra dónde te equivocaste.' },
  ];

  return (
    <div className="space-y-5">
      <ControlPanel 
        dashboardOn={dashboardOn} setDashboardOn={setDashboardOn}
        tutorialOn={tutorialOn} setTutorialOn={setTutorialOn}
        discreteOn={discreteOn} setDiscreteOn={setDiscreteOn}
        onReset={() => { setNivel(1); setPregunta(generarPreguntaNivel(1)); setPuntaje({ aciertos: 0, total: 0 }); setModo('quiz'); setTemasSeleccionados([]); }}
      />

      {discreteOn && (
        <div className="cx-bg-surface border-l-4 border-purple-400 rounded-r-lg p-4 mb-4 mode-discrete no-print">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-sm">Σ</span>
            <span className="text-xs font-bold cx-text-accent-primary uppercase tracking-wide">Sumatoria</span>
            <span className="text-[9px] cx-text-text-muted bg-cx-bg-surface px-2 py-0.5 rounded-full">Modo Académico</span>
          </div>

            style={{ background: 'var(--accent-primary)' }}

              <p className="text-[15px] cx-text-text-strong-gray leading-relaxed"><TextoConNegritas texto={preguntasEval[preguntaEvalIndex].enunciado} /></p>

                <TextInput 
                  label="Tu respuesta"
                  unidad={preguntasEval[preguntaEvalIndex].unidad}
                  value={respuestaEvalTexto}
                  onChange={setRespuestaEvalTexto}
                  placeholder="Ej. 12500.50"
                  onEnter={evalVerificado ? siguienteEval : verificarEval}
                />

                  <button onClick={verificarEval} disabled={respuestaEvalTexto.trim() === ''} className="px-4 py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40" style={{ background: 'var(--accent-primary)' }}>Verificar</button>

                  <button onClick={siguienteEval} className="px-4 py-2.5 rounded-lg text-sm font-semibold text-white flex items-center gap-1.5" style={{ background: 'var(--accent-green)' }}>
                    {preguntaEvalIndex + 1 >= preguntasEval.length ? 'Ver resultado' : 'Siguiente'} <ArrowRight size={14} />
                  </button>
                )}
              </div>
              {evalVerificado && (
                <div className={`rounded-lg p-4 space-y-2 ${evalCorrecto ? 'cx-bg-accent-green-bg' : 'cx-bg-accent-coral-bg'}`}>
                  <div className={`flex items-center gap-2 font-semibold text-sm ${evalCorrecto ? 'cx-text-accent-green-text' : 'cx-text-accent-coral-text'}`}>
                    {evalCorrecto ? <Check size={16} /> : <X size={16} />}
                    {evalCorrecto ? '¡Correcto!' : 'No es correcto.'}
                  </div>
                  <p className="text-sm cx-text-text-strong-gray">Respuesta esperada: <strong>{preguntasEval[preguntaEvalIndex].unidad === '%' || preguntasEval[preguntaEvalIndex].unidad === 'años' || preguntasEval[preguntaEvalIndex].unidad === 'periodos' ? preguntasEval[preguntaEvalIndex].respuesta : fmt(preguntasEval[preguntaEvalIndex].respuesta)}{preguntasEval[preguntaEvalIndex].unidad === '%' ? '%' : ''}</strong></p>
                  <div className="space-y-1 pt-1 border-t" style={{ borderColor: 'var(--border)' }}>
                    {preguntasEval[preguntaEvalIndex].solucion.map((linea, i) => (<p key={i} className="text-xs cx-text-text-secondary leading-relaxed">{linea}</p>))}
                  </div>
                </div>
              )}
            </div>
          )}

          {evaluacionCompletada && (
            <div className="cx-bg-accent-primary-bg border cx-border-accent-primary/30 rounded-lg p-5 space-y-3 mt-2">
              <div className="flex items-center gap-2">
                <GraduationCap size={18} className="cx-text-accent-primary" />
                <span className="font-semibold text-[15px] cx-text-text-primary" style={{ fontFamily: "'Fraunces', sans-serif" }}>Resultado de tu evaluación</span>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <StatCard label="Aciertos" value={`${respuestasEval.filter((r) => r.correcto).length} / ${respuestasEval.length}`} accent="teal" tooltip="Respuestas correctas de la evaluación" />
                <StatCard label="Efectividad" value={`${Math.round((respuestasEval.filter((r) => r.correcto).length / respuestasEval.length) * 100)}%`} accent="coral" tooltip="Porcentaje de respuestas correctas" />
                <StatCard label="Temas evaluados" value={String(temasSeleccionados.length)} accent="blue" tooltip="Cantidad de temas incluidos en la evaluación" />
              </div>
              <div className="space-y-1.5 pt-2 border-t cx-border-border">
                {respuestasEval.map((r, i) => (
                  <div key={i} className="flex items-center gap-2 text-xs cx-text-text-secondary">
                    {r.correcto ? <Check size={13} className="cx-text-accent-green-text flex-shrink-0" /> : <X size={13} className="cx-text-accent-coral-text flex-shrink-0" />}
                    <span>{r.pregunta.categoria}</span>
                  </div>
                ))}
              </div>
              <button onClick={reiniciarEvaluacion} className="w-full py-2.5 rounded-lg text-sm font-semibold text-white flex items-center justify-center gap-1.5" style={{ background: 'var(--accent-primary)' }}>
                <RotateCcw size={14} /> Nueva evaluación
              </button>
            </div>
          )}
        </div>
      )}

      {tutorialOn && (
        <TutorialStep 
          step={tutorialSteps[tutorialStep]} 
          total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)}
        />
      )}
    </div>
  );
}

function FinanzasApp() {
  const [folder, setFolder] = useState(null);
  const [theme, setTheme] = useState('light');
  const [acercaDeOpen, setAcercaDeOpen] = useState(false);
  const [booting, setBooting] = useState(true);
  const [splashDone, setSplashDone] = useState(false);
  const [entering, setEntering] = useState(false);
  const [leaving, setLeaving] = useState(false);
  const [origin, setOrigin] = useState({ x: 50, y: 15 });
  const [progress, setProgress] = useState(0);
  const shellRef = useRef(null);
  const TRANSITION_MS = 190;

  useEffect(() => {
    const interval = setInterval(() => {
      setProgress(p => Math.min(100, p + 1 + Math.random() * 2));
    }, 30);
    
    const t1 = setTimeout(() => setBooting(false), 1700);
    const t2 = setTimeout(() => {
      setSplashDone(true);
      clearInterval(interval);
    }, 2200);
    return () => { clearTimeout(t1); clearTimeout(t2); clearInterval(interval); };
  }, []);

  const toggleTheme = () => setTheme((t) => (t === 'light' ? 'dark' : 'light'));
  const volver = () => setFolder(null);

  const abrirFolder = (key, cardEl) => {
    if (cardEl && shellRef.current) {
      const c = shellRef.current.getBoundingClientRect();
      const r = cardEl.getBoundingClientRect();
      setOrigin({ x: ((r.left + r.width / 2 - c.left) / c.width) * 100, y: ((r.top + r.height / 2 - c.top) / c.height) * 100 });
    }
    setLeaving(true);
    setTimeout(() => {
      setFolder(key);
      setLeaving(false);
      setEntering(true);
      requestAnimationFrame(() => requestAnimationFrame(() => setEntering(false)));
    }, TRANSITION_MS);
  };

  const folderDef = FOLDERS.find((f) => f.key === folder);
  const contentStyle = {
    transformOrigin: `${origin.x}% ${origin.y}%`,
    opacity: leaving || entering ? 0 : 1,
    transform: leaving ? 'scale(0.93)' : entering ? (folder ? 'scale(0.8)' : 'scale(0.96)') : undefined,
    transition: 'opacity 190ms ease-out, transform 190ms ease-out',
  };

  return (
    <div className="finapp-root min-h-screen w-full" data-theme={theme} style={{ background: 'radial-gradient(1100px 500px at 85% -10%, rgba(31,77,58,0.07), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(138,109,31,0.06), transparent 55%), var(--bg)' }}>
      {!splashDone && <SplashScreen fadingOut={!booting} progress={progress} />}
      <style>{APP_STYLES}</style>
      <div className="max-w-5xl mx-auto px-4 py-6 sm:py-8">
        <header className="relative overflow-hidden rounded-lg mb-5 px-5 py-6 sm:px-8 sm:py-8 no-print" style={{ background: 'linear-gradient(135deg, #1F4D3A 0%, #2A6349 55%, #163A2B 100%)' }}>
          <div className="absolute inset-0 opacity-[0.05] pointer-events-none" style={{ backgroundImage: 'repeating-linear-gradient(to bottom, transparent, transparent 27px, #fff 27px, #fff 28px)' }} />
          <div className="relative flex items-center justify-between gap-3 flex-wrap">
            <button onClick={volver} className="inline-flex items-center gap-2 text-[#D9C98A] text-xs uppercase tracking-[0.15em] font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3 py-1 transition-colors">
              <Calculator size={14} /> Proyecto de Matemáticas Discretas · Finanzas
            </button>
            <div className="flex items-center gap-2">
              <button onClick={toggleTheme} className="inline-flex items-center gap-1.5 text-white text-xs font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3.5 py-1.5 transition-colors">
                {theme === 'dark' ? <Sun size={13} /> : <Moon size={13} />}
                {theme === 'dark' ? 'Claro' : 'Oscuro'}
              </button>
              <button onClick={() => setAcercaDeOpen(true)} className="inline-flex items-center gap-1.5 text-white text-xs font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3.5 py-1.5 transition-colors">
                <Info size={13} /> Acerca de
              </button>
            </div>
          </div>
          <div className="absolute left-0 right-0 bottom-0">
            <div className="h-[3px]" style={{ background: '#D9C98A', opacity: 0.9 }} />
            <div className="h-px mt-[3px]" style={{ background: '#D9C98A', opacity: 0.5 }} />
          </div>
        </header>

        {acercaDeOpen && (
          <Modal onClose={() => setAcercaDeOpen(false)}>
            <div className="flex items-center gap-2 cx-text-accent-primary font-semibold text-sm mb-1" style={{ fontFamily: "'Fraunces', sans-serif" }}><Calculator size={16} /> Proyecto de Matemáticas Discretas</div>
            <h3 className="text-2xl mb-3" style={{ fontFamily: "'Fraunces', sans-serif", fontWeight: 600, color: 'var(--text-primary)' }}>PROTOTIPO EDUCATIVO ESPOL</h3>
            <p className="text-sm leading-relaxed" style={{ color: 'var(--text-secondary)' }}>Organizado por carpetas, con modo tutorial, dashboard y matemáticas discretas.</p>
            <p className="text-xs mt-4 pt-4 border-t" style={{ color: 'var(--text-faint)', borderColor: 'var(--border)' }}>Prototipo educativo · cifras ilustrativas.</p>
          </Modal>
        )}

        <div ref={shellRef} className="cx-bg-surface rounded-lg border cx-border-border p-4 sm:p-6 shadow-lg shadow-black/[0.08] relative">
          <div style={contentStyle}>
            {folder === null ? (
              <GameMenu onSelect={abrirFolder} />
            ) : (
              <div>
                <FolderHeader folder={folderDef} onBack={volver} />
                {folder === 'interes' && <InteresTab />}
                {folder === 'tasas' && <TasasEquivalentesTab />}
                {folder === 'anualidades' && <AnualidadesTab />}
                {folder === 'simulador' && <SimuladorTab />}
                {folder === 'quizzes' && <QuizTab />}
                {folder === 'formulario' && <FormularioTab />}
              </div>
            )}
          </div>
        </div>

        <footer className="mt-8 pt-6 border-t cx-border-border text-center no-print">
          <img src={ESPOL_LOGO_BASE64} alt="ESPOL" className="espol-logo w-9 mx-auto mb-3 opacity-60" />
          <div className="inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide cx-text-text-secondary mb-1.5">
            <AlertTriangle size={12} /> Prototipo educativo — Esto NO es asesoría financiera
          </div>
          <p className="text-[11px] cx-text-text-faint max-w-xl mx-auto leading-relaxed">
            Desarrollado con fines académicos para Matemáticas Discretas, Escuela Superior Politécnica del Litoral (ESPOL).
          </p>
        </footer>
      </div>
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<FinanzasApp />);
    </script>
</body>
</html>
