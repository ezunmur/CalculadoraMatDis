// ---------- Utilidades ----------
const fmt = (n) => {
  if (!isFinite(n)) return '—';
  return '$' + n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtInt = (n) => n.toLocaleString('es-EC', { maximumFractionDigits: 0 });

const monthsToYears = (m) => {
  if (!isFinite(m)) return '—';
  const y = Math.floor(m / 12);
  const rem = Math.round(m % 12);
  if (y === 0) return `${rem} ${rem === 1 ? 'mes' : 'meses'}`;
  if (rem === 0) return `${y} ${y === 1 ? 'año' : 'años'}`;
  return `${y} ${y === 1 ? 'año' : 'años'} y ${rem} ${rem === 1 ? 'mes' : 'meses'}`;
};

// ---------- Temporalidades / capitalizaciones ----------
const TEMPORALIDADES = [
  { key: 'anual', label: 'Anual', m: 1, periodo: 'año', periodoPlural: 'años' },
  { key: 'semestral', label: 'Semestral', m: 2, periodo: 'semestre', periodoPlural: 'semestres' },
  { key: 'cuatrimestral', label: 'Cuatrimestral', m: 3, periodo: 'cuatrimestre', periodoPlural: 'cuatrimestres' },
  { key: 'trimestral', label: 'Trimestral', m: 4, periodo: 'trimestre', periodoPlural: 'trimestres' },
  { key: 'bimestral', label: 'Bimestral', m: 6, periodo: 'bimestre', periodoPlural: 'bimestres' },
  { key: 'bimensual', label: 'Bimensual (quincenal)', m: 24, periodo: 'quincena', periodoPlural: 'quincenas' },
  { key: 'mensual', label: 'Mensual', m: 12, periodo: 'mes', periodoPlural: 'meses' },
  { key: 'semanal', label: 'Semanal', m: 52, periodo: 'semana', periodoPlural: 'semanas' },
  { key: 'diaria', label: 'Diaria', m: 365, periodo: 'día', periodoPlural: 'días' },
  { key: 'continua', label: 'Continua', m: null, periodo: 'año', periodoPlural: 'años' },
];
const getTemporalidad = (key) => TEMPORALIDADES.find((t) => t.key === key) || TEMPORALIDADES[6];

function tasaPeriodica(tasaNominalPct, temporalidadKey) {
  const t = getTemporalidad(temporalidadKey);
  if (t.key === 'continua') return null;
  return (tasaNominalPct / 100) / t.m;
}

function calcularTEADesdeOrigen(tasaPct, tipoOrigen, temporalidadOrigenKey) {
  const t = getTemporalidad(temporalidadOrigenKey);
  const tasaFrac = tasaPct / 100;
  if (t.key === 'continua') return Math.exp(tasaFrac) - 1;
  const iOrigen = tipoOrigen === 'nominal' ? tasaFrac / t.m : tasaFrac;
  return Math.pow(1 + iOrigen, t.m) - 1;
}
function calcularTasaDestinoDesdeTEA(tea, tipoDestino, temporalidadDestinoKey) {
  const t = getTemporalidad(temporalidadDestinoKey);
  if (t.key === 'continua') return Math.log(1 + tea) * 100;
  const iDestino = Math.pow(1 + tea, 1 / t.m) - 1;
  return (tipoDestino === 'nominal' ? iDestino * t.m : iDestino) * 100;
}
function convertirTasaGeneral(tasaPct, tipoOrigen, temporalidadOrigenKey, tipoDestino, temporalidadDestinoKey) {
  const tea = calcularTEADesdeOrigen(tasaPct, tipoOrigen, temporalidadOrigenKey);
  return calcularTasaDestinoDesdeTEA(tea, tipoDestino, temporalidadDestinoKey);
}

function calcularContinuo(P, tasaNominalPct, anios) {
  const r = tasaNominalPct / 100;
  const F = P * Math.exp(r * anios);
  return { F, interes: F - P, r, anios };
}

function calcularAmortizacion(P, r, n, sistema) {
  const rows = [];
  let saldo = P;

  if (sistema === 'francesa') {
    const pago = r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n));
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      let capital = pago - interes;
      let saldoFinal = saldo - capital;
      if (t === n) { capital += saldoFinal; saldoFinal = 0; }
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  } else if (sistema === 'alemana') {
    const capitalFijo = P / n;
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const pago = capitalFijo + interes;
      const saldoFinal = Math.max(0, saldo - capitalFijo);
      rows.push({ t, saldoInicial: saldo, pago, interes, capital: capitalFijo, saldoFinal });
      saldo = saldoFinal;
    }
  } else { 
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const capital = t === n ? saldo : 0;
      const pago = interes + capital;
      const saldoFinal = saldo - capital;
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0) };
}

function calcularSimple(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = P * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function calcularCompuesto(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = saldo * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function simularCamino({ tipo, monto, base, tasaAnual = 0, extraMensual = 0, extrasUnicos = [], maxMeses = 1200 }) {
  const r = tasaAnual / 100 / 12;
  const aporteExtra = (m) =>
    extraMensual + extrasUnicos.reduce((acc, e) => acc + (m === e.mes ? (e.monto || 0) : 0), 0);

  if (tipo === 'alcancia') {
    let saldo = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      saldo += base + aporteExtra(m);
      serie.push({ mes: m, saldo: Math.min(saldo, monto) });
      if (saldo >= monto) return { meses: m, totalInteres: 0, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: 0, serie, alcanzado: false };
  }

  if (tipo === 'ahorroSimple') {
    let principal = 0, interesAcum = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      principal += base + aporteExtra(m);
      interesAcum += principal * r;
      const saldo = principal + interesAcum;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: interesAcum, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: interesAcum, serie, alcanzado: false };
  }

  if (tipo === 'ahorroCompuesto') {
    let saldo = 0, aportado = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      const aporte = base + aporteExtra(m);
      saldo = saldo * (1 + r) + aporte;
      aportado += aporte;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: saldo - aportado, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: saldo - aportado, serie, alcanzado: false };
  }

  let saldo = monto, interesTotal = 0;
  const serie = [{ mes: 0, saldo }];
  const hayExtraUnico = extrasUnicos.some((e) => (e.monto || 0) > 0);
  if (base + extraMensual <= saldo * r && !hayExtraUnico) {
    return { meses: Infinity, totalInteres: Infinity, serie, nuncaPaga: true };
  }
  for (let m = 1; m <= maxMeses; m++) {
    const interes = saldo * r;
    interesTotal += interes;
    const pago = base + aporteExtra(m);
    saldo = saldo + interes - pago;
    if (saldo < 0) saldo = 0;
    serie.push({ mes: m, saldo });
    if (saldo <= 0) return { meses: m, totalInteres: interesTotal, serie, nuncaPaga: false };
  }
  return { meses: Infinity, totalInteres: interesTotal, serie, nuncaPaga: false };
}

function Field({ label, suffix, value, onChange, min, step }) {
  const [texto, setTexto] = useState(value === 0 ? '' : String(value));

  const manejarCambio = (e) => {
    const t = e.target.value;
    setTexto(t);
    const num = parseFloat(t);
    onChange(isNaN(num) ? 0 : num);
  };

  return (
    <label className="flex flex-wrap items-end gap-x-2 gap-y-0.5 border-b-2 cx-border-border cx-focusw-border-accent-primary min-w-0 pb-1">
      <span className="text-[11px] cx-text-text-muted font-medium whitespace-nowrap">{label}</span>
      <input
        type="number"
        value={texto}
        min={min}
        step={step}

  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

function explicacionFila(row, tipo, sistema, r) {
  if (tipo === 'anualidad') {
    if (sistema === 'francesa') {
      return [
        `Interés = Saldo anterior × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`,
        `Capital = Pago − Interés = ${fmt(row.pago)} − ${fmt(row.interes)} = ${fmt(row.capital)}`,
        `Saldo nuevo = Saldo anterior − Capital = ${fmt(row.saldoInicial)} − ${fmt(row.capital)} = ${fmt(row.saldoFinal)}`,
        `En el sistema francés el pago es siempre el mismo (${fmt(row.pago)}); lo que cambia es cuánto de ese pago es interés y cuánto capital.`,
      ];
    }
    if (sistema === 'alemana') {
      return [
        `Capital fijo = P / n = ${fmt(row.capital)} (siempre el mismo en cada periodo)`,
        `Interés = Saldo anterior × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`,
        `Pago = Capital + Interés = ${fmt(row.capital)} + ${fmt(row.interes)} = ${fmt(row.pago)}`,
        `Como el capital que abonas no cambia pero el saldo va bajando, el interés y el pago total son cada vez más pequeños.`,
      ];
    }
    return [
      `Interés = Saldo × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`,
      row.capital > 0
        ? `Este es el último periodo: se devuelve todo el capital de una vez = ${fmt(row.capital)}`
        : `Capital abonado este periodo = ${fmt(row.capital)} (en el sistema americano solo se paga interés hasta el final)`,
      `Pago total = Interés + Capital = ${fmt(row.pago)}`,
    ];
  }
  if (tipo === 'simple') {
    return [
      `Interés = P × r = ${fmt(row.capital)} × ${r.toFixed(5)} = ${fmt(row.interes)}`,
      `Saldo nuevo = Saldo anterior + Interés = ${fmt(row.saldoInicial)} + ${fmt(row.interes)} = ${fmt(row.saldoFinal)}`,
      `El interés no se acumula sobre sí mismo: cada periodo genera exactamente lo mismo.`,
    ];
  }
  return [
    `Interés = Saldo anterior × r = ${fmt(row.saldoInicial)} × ${r.toFixed(5)} = ${fmt(row.interes)}`,
    `Saldo nuevo = Saldo anterior × (1 + r) = ${fmt(row.saldoInicial)} × ${(1 + r).toFixed(5)} = ${fmt(row.saldoFinal)}`,
    `Este interés ya generado empezará, a su vez, a generar más interés el siguiente periodo.`,
  ];
}

function InteresTab() {
  const [tipo, setTipo] = useState('compuesto');
  const [P, setP] = useState(80000);
  const [tasaNominal, setTasaNominal] = useState(12);
  const [temporalidad, setTemporalidad] = useState('mensual');
  const [n, setN] = useState(10);
  const [anios, setAnios] = useState(3);
  const [modalRow, setModalRow] = useState(null);

  const opcionesTemporalidad = tipo === 'simple' ? TEMPORALIDADES.filter((x) => x.key !== 'continua') : TEMPORALIDADES;
  const esContinua = tipo === 'compuesto' && temporalidad === 'continua';
  const t = getTemporalidad(temporalidad);
  const r = esContinua ? 0 : tasaPeriodica(tasaNominal, temporalidad);

  const cambiarTipo = (nuevoTipo) => {
    setTipo(nuevoTipo);
    if (nuevoTipo === 'simple' && temporalidad === 'continua') setTemporalidad('mensual');
  };

  const resultadoContinuo = useMemo(() => calcularContinuo(P, tasaNominal, anios), [P, tasaNominal, anios]);
  const resultado = useMemo(() => {
    if (tipo === 'simple') return calcularSimple(P, r, n);
    return calcularCompuesto(P, r, n);
  }, [tipo, P, r, n]);

  const chartData = resultado.rows.map((row) => ({
    periodo: row.t,
    Capital: row.capital,
    Interés: row.interes,
  }));

  return (
    <div className="space-y-6">
      <div className="flex flex-wrap gap-2">
        <PillButton active={tipo === 'simple'} onClick={() => cambiarTipo('simple')}>Interés simple</PillButton>
        <PillButton active={tipo === 'compuesto'} onClick={() => cambiarTipo('compuesto')}>Interés compuesto</PillButton>
      </div>

      <TemaIntro tipo={tipo} sistema={null} />

      <div className="cx-bg-surface p-4 rounded-lg border cx-border-border space-y-4">
        <div className="grid sm:grid-cols-3 gap-4">
          <Field label="Capital inicial" value={P} onChange={setP} min={0} step={100} />
          <Field label="Tasa nominal anual" suffix="%" value={tasaNominal} onChange={setTasaNominal} min={0} step={0.1} />
          {esContinua ? (
            <Field label="Número de años" value={anios} onChange={(v) => setAnios(Math.max(0.1, v))} min={0.1} step={0.5} />
          ) : (
            <Field
              label={`Número de periodos (${t.periodoPlural})`}
              value={n}
              onChange={(v) => setN(Math.max(1, Math.round(v)))}
              min={1}
              step={1}
            />
          )}
        </div>
        <CapitalizacionSolapa temporalidad={temporalidad} onChange={setTemporalidad} opciones={opcionesTemporalidad} />
      </div>

      {esContinua ? (
        <div className="space-y-4">
          <div className="grid sm:grid-cols-3 gap-3">
            <StatCard label="Capital inicial" value={fmt(P)} accent="teal" />
            <StatCard label="Monto final" value={fmt(resultadoContinuo.F)} accent="blue" />
            <StatCard label="Interés generado" value={fmt(resultadoContinuo.interes)} accent="coral" />
          </div>
          <div className="cx-bg-surface-alt rounded-lg p-4">
            <div className="text-[10px] cx-text-text-muted font-semibold uppercase tracking-wide mb-1.5">Desarrollo del cálculo</div>
            <MathBlock>
              <Var>F</Var> = <Var>P</Var> · <Pow base="e" exp={<><Var>r</Var>·<Var>t</Var></>} /> = {fmt(P)} · <Pow base="e" exp={`${(tasaNominal / 100).toFixed(4)} × ${anios}`} /> = {fmt(resultadoContinuo.F)}
            </MathBlock>
            <MathBlock>
              Interés = <Var>F</Var> − <Var>P</Var> = {fmt(resultadoContinuo.F)} − {fmt(P)} = {fmt(resultadoContinuo.interes)}
            </MathBlock>
          </div>
          <p className="text-xs cx-text-text-muted">
            La capitalización continua no tiene "periodos" discretos — es el límite cuando la frecuencia de capitalización crece sin fin, por eso aquí no hay una tabla periodo a periodo.
          </p>
        </div>
      ) : (
        <>
          <div className="grid sm:grid-cols-3 gap-3">
            <StatCard label="Saldo final" value={fmt(resultado.saldoFinal)} accent="blue" />
            <StatCard label="Interés total" value={fmt(resultado.totalInteres)} accent="coral" />
            <StatCard label="Capital inicial" value={fmt(P)} accent="teal" />

          <div>
            <div className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold mb-2">Composición del saldo por periodo</div>
            <div className="cx-bg-surface border cx-border-border rounded-lg p-3" style={{ height: 260 }}>
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={chartData} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="var(--chart-grid)" vertical={false} />
                  <XAxis
                    dataKey="periodo"
                    tick={{ fontSize: 11, fill: 'var(--chart-axis)' }}
                    label={{ value: `Periodo (${t.periodo})`, position: 'insideBottom', offset: -2, fontSize: 11, fill: 'var(--chart-axis)' }}
                  />
                  <YAxis tick={{ fontSize: 11, fill: 'var(--chart-axis)' }} tickFormatter={(v) => '$' + fmtInt(v)} />
                  <Tooltip formatter={(v) => fmt(v)} contentStyle={{ fontSize: 12, borderRadius: 12, background: 'var(--surface)', color: 'var(--text-primary)', border: '1px solid var(--border)' }} />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                  <Bar dataKey="Capital" stackId="a" fill="var(--accent-green)" radius={[0, 0, 0, 0]} />
                  <Bar dataKey="Interés" stackId="a" fill="var(--accent-coral)" radius={[4, 4, 0, 0]} />

            <p className="text-xs cx-text-text-muted mt-2">
              {tipo === 'simple'

          <div>

            <div className="cx-bg-surface border cx-border-border rounded-lg overflow-hidden overflow-x-auto">
              <table className="w-full text-sm" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                <thead>
                  <tr className="cx-bg-surface-alt cx-text-text-muted text-xs uppercase tracking-wide">
                    <th className="px-3 py-2.5 text-left font-semibold" style={{ fontFamily: "'Fraunces', sans-serif" }}>Periodo</th>
                    <th className="px-3 py-2.5 text-right font-semibold" style={{ fontFamily: "'Fraunces', sans-serif" }}>Saldo inicial</th>
                    <th className="px-3 py-2.5 text-right font-semibold" style={{ fontFamily: "'Fraunces', sans-serif" }}>Interés</th>
                    <th className="px-3 py-2.5 text-right font-semibold" style={{ fontFamily: "'Fraunces', sans-serif" }}>Capital</th>

          )}

      )}

  );
}

        ) : tipoOrigen === 'nominal' ? (
          <MathBlock>
            TEA = <Pow base={<>(1 + <Frac num={(tasaValor / 100).toFixed(4)} den={tOrigen.m} />)</>} exp={tOrigen.m} /> − 1 = {(tea * 100).toFixed(4)}%
          </MathBlock>
        ) : (
          <MathBlock>
            TEA = <Pow base={<>(1 + {(tasaValor / 100).toFixed(4)})</>} exp={tOrigen.m} /> − 1 = {(tea * 100).toFixed(4)}%
          </MathBlock>
        )}

        {destino === 'continua' ? (
          <MathBlock>
            <Var>j</Var> = ln(1 + TEA) = {tasaDestino.toFixed(4)}%
          </MathBlock>
        ) : tipoDestino === 'nominal' ? (
          <MathBlock>
            <Var>j</Var> = (<Pow base="(1+TEA)" exp={<Frac num="1" den={tDestino.m} />} /> − 1) × {tDestino.m} = {tasaDestino.toFixed(4)}%
          </MathBlock>
        ) : (
          <MathBlock>
            <Var>i</Var> = <Pow base="(1+TEA)" exp={<Frac num="1" den={tDestino.m} />} /> − 1 = {tasaDestino.toFixed(4)}%
          </MathBlock>
        )}
      </div>

      <div>
        <div className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold mb-2">
          La misma TEA, expresada como tasa {tipoDestino} en cada capitalización
        </div>
        <div className="cx-bg-surface border cx-border-border rounded-lg p-3" style={{ height: 280 }}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData} margin={{ top: 8, right: 8, left: 0, bottom: 48 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="var(--chart-grid)" vertical={false} />
              <XAxis dataKey="temporalidad" tick={{ fontSize: 10, fill: 'var(--chart-axis)' }} angle={-35} textAnchor="end" interval={0} />
              <YAxis tick={{ fontSize: 11, fill: 'var(--chart-axis)' }} tickFormatter={(v) => v.toFixed(1) + '%'} />
              <Tooltip formatter={(v) => v.toFixed(4) + '%'} contentStyle={{ fontSize: 12, borderRadius: 12, background: 'var(--surface)', color: 'var(--text-primary)', border: '1px solid var(--border)' }} />
              <Bar dataKey="Tasa equivalente" fill="var(--accent-primary)" radius={[4, 4, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
        <p className="text-xs cx-text-text-muted mt-2">Todas estas tasas generan la misma tasa efectiva anual — por eso se llaman "equivalentes".</p>
      </div>
    </div>
  );
}

let extraIdSeq = 1;

function DestinoDetalleModal({ path, objetivo, capacidad, tasaAnual, onClose }) {
  const [extraMensual, setExtraMensual] = useState(0);
  const [extrasUnicos, setExtrasUnicos] = useState([{ id: extraIdSeq++, mes: 3, monto: 0 }]);

  const agregarExtra = () => {
    setExtrasUnicos((arr) => {
      const ultimoMes = arr.length ? arr[arr.length - 1].mes : 0;
      return [...arr, { id: extraIdSeq++, mes: ultimoMes + 3, monto: 0 }];
    });
  };
  const quitarExtra = (id) => setExtrasUnicos((arr) => arr.filter((e) => e.id !== id));
  const actualizarExtra = (id, campo) => (valor) =>
    setExtrasUnicos((arr) => arr.map((e) => (e.id === id ? { ...e, [campo]: valor } : e)));

  const base = useMemo(
    () => simularCamino({ tipo: path.tipoSim, monto: objetivo, base: capacidad, tasaAnual }),
    [path, objetivo, capacidad, tasaAnual]
  );
  const ajustado = useMemo(
    () => simularCamino({
      tipo: path.tipoSim, monto: objetivo, base: capacidad, tasaAnual,
      extraMensual, extrasUnicos,
    }),
    [path, objetivo, capacidad, tasaAnual, extraMensual, extrasUnicos]
  );

  const esDeuda = path.tipo === 'deuda';
  const diffMeses = isFinite(base.meses) && isFinite(ajustado.meses) ? base.meses - ajustado.meses : 0;
  const diffInteres = isFinite(base.totalInteres) && isFinite(ajustado.totalInteres) ? base.totalInteres - ajustado.totalInteres : 0;

  const maxM = Math.min(240, Math.max(
    isFinite(base.meses) ? base.meses : 60,
    isFinite(ajustado.meses) ? ajustado.meses : 60,
    12
  ));
  const chartData = [];
  for (let m = 0; m <= maxM; m++) {
    chartData.push({
      mes: m,
      Base: base.serie[m]?.saldo ?? (esDeuda ? 0 : base.serie[base.serie.length - 1]?.saldo),
      'Con abonos extra': ajustado.serie[m]?.saldo ?? (esDeuda ? 0 : ajustado.serie[ajustado.serie.length - 1]?.saldo),
    });
  }

  return (
    <Modal onClose={onClose} wide>
      <div className="flex items-center gap-2 cx-text-accent-primary-text font-semibold text-sm mb-1" style={{ fontFamily: "'Fraunces', sans-serif" }}>

        Analiza este destino
      </h3>

      <p className="text-sm cx-text-text-secondary mb-4">
        {esDeuda
          ? 'Prueba qué pasa si abonas un poco más cada mes, o si agregas uno o varios pagos extraordinarios en meses puntuales (por ejemplo, un bono o un aguinaldo).'
          : 'Prueba qué pasa si aportas un poco más cada mes, o si agregas uno o varios aportes únicos en meses puntuales.'}
      </p>

      <div className="cx-bg-surface-alt rounded-lg p-4 mb-5 space-y-4" style={{ backgroundColor: 'var(--surface-alt)' }}>
        <div className="sm:max-w-xs">
          <Field label={esDeuda ? 'Abono extra mensual' : 'Aporte extra mensual'} suffix="$" value={extraMensual} onChange={setExtraMensual} min={0} step={5} />
        </div>

        <div className="border-t cx-border-border pt-4">
          <div className="flex items-center justify-between mb-3">
            <span className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold">

            <button

              style={{ background: 'var(--accent-primary)' }}

          )}

          <div className="grid sm:grid-cols-2 gap-3">

              <div key={extra.id} className="relative cx-bg-surface border cx-border-border rounded-lg p-3 pt-3.5">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-[11px] uppercase tracking-wide cx-text-accent-primary font-semibold">

                <div className="grid grid-cols-2 gap-2">
                  <Field

                    onChange={(v) => actualizarExtra(extra.id, 'mes')(Math.max(1, Math.round(v)))}

                    step={1}

          <div className="text-sm cx-text-accent-green-text">{esDeuda ? 'interés pagado' : 'interés ganado'}: {fmt(ajustado.totalInteres)}</div>
        </div>
      </div>

      {(diffMeses !== 0 || diffInteres !== 0) && isFinite(diffMeses) && (

        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={chartData} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>

  );

function valorPresente(F, r, n) {
  return F / Math.pow(1 + r, n);
}
function valorFuturoLumpSum(P, r, n) {
  return P * Math.pow(1 + r, n);
}
function periodosNecesarios(P, F, r) {
  return Math.log(F / P) / Math.log(1 + r);
}
function cuotaFrancesa(P, r, n) {
  return r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n));
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randChoice(arr) {
  return arr[randInt(0, arr.length - 1)];
}
function round2(n) {
  return Math.round(n * 100) / 100;
}
const fmtPct = (n) => n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';

function dentroDeTolerancia(valorUsuario, correcto, unidad) {
  if (!isFinite(valorUsuario)) return false;
  if (unidad === '$') {
    const tol = Math.max(1, Math.abs(correcto) * 0.01);
    return Math.abs(valorUsuario - correcto) <= tol;
  }
  if (unidad === '%') {
    return Math.abs(valorUsuario - correcto) <= 0.15;
  }
  if (unidad === 'periodos') {
    return Math.abs(valorUsuario - correcto) <= 0.3;
  }
  if (unidad === 'años') {
    return Math.abs(valorUsuario - correcto) <= 0.15;
  }
  return Math.abs(valorUsuario - correcto) <= Math.abs(correcto) * 0.02;
}

    enunciado: `Un préstamo de ${fmt(P)} se paga en ${n} cuotas mensuales iguales bajo el sistema francés, con una tasa nominal anual del ${tasaNominalPct}% capitalizable mensualmente. **¿Cuál es el valor de la cuota fija?**`,
    unidad: '$',
    respuesta: round2(cuota),
    solucion: [
      `Tasa periódica mensual: r = ${tasaNominalPct}% / 12 = ${(r * 100).toFixed(4)}% mensual.`,
      `Cuota = P·r / [1 − (1+r)^(−n)] = ${fmt(P)} · ${(r * 100).toFixed(4)}% / [1 − (1+${(r * 100).toFixed(4)}%)^(−${n})] = ${fmt(cuota)}.`,
    ],
  };
}

function genMixtoTiempoAnios() {
  const P = randInt(3, 50) * 1000;
  const multiplo = randChoice([1.3, 1.5, 2, 2.5, 3]);
  const F = round2(P * multiplo);
  const tasaNominalPct = randInt(12, 40);
  const temporalidad = randChoice(['mensual', 'trimestral', 'semestral']);
  const t = getTemporalidad(temporalidad);
  const r = tasaPeriodica(tasaNominalPct, temporalidad);
  const n = periodosNecesarios(P, F, r);
  const anios = n / t.m;
  return {
    categoria: 'Tasas + periodos',
    enunciado: `Con una tasa nominal anual del ${tasaNominalPct}% capitalizable de forma ${temporalidad}, **¿en cuántos años un capital de ${fmt(P)} se convertirá en al menos ${fmt(F)}?**`,
    unidad: 'años',
    respuesta: round2(anios),
    solucion: [
      `Tasa periódica: r = ${tasaNominalPct}% / ${t.m} = ${(r * 100).toFixed(4)}% por ${t.periodo}.`,
      `n = ln(F/P) / ln(1+r) = ln(${(F / P).toFixed(4)}) / ln(1 + ${(r * 100).toFixed(4)}%) ≈ ${n.toFixed(2)} ${t.periodoPlural}.`,
      `En años: t = n / ${t.m} ≈ ${anios.toFixed(2)} años.`,
    ],
  };
}

function genDestinoVerborrea() {
  const nombre = randChoice(NOMBRES_DESTINO);
  const relleno = randChoice(RELLENOS_DESTINO);
  const destino = randChoice(DESTINOS_DESTINO);
  const P = randInt(3, 25) * 500;
  const edad = randInt(20, 45);
  const gastoMensualIrrelevante = randInt(150, 400);
  const multiplo = randChoice([1.4, 1.6, 1.8, 2, 2.2]);
  const F = round2(P * multiplo);
  const tasaNominalPct = randInt(10, 28);
  const temporalidad = randChoice(['mensual', 'trimestral']);
  const t = getTemporalidad(temporalidad);
  const r = tasaPeriodica(tasaNominalPct, temporalidad);
  const n = periodosNecesarios(P, F, r);
  const anios = n / t.m;
  const bancoImaginario = randChoice(['Banco del Litoral', 'Cooperativa Andina', 'Financiera del Pacífico', 'Banco San Rafael']);

  const enunciado =
    `${nombre} tiene ${edad} años, ${relleno}, y desde hace un tiempo ha estado pensando seriamente en organizar sus finanzas personales para cumplir una meta que le ilusiona: ${destino}. ` +
    `Actualmente destina alrededor de ${fmt(gastoMensualIrrelevante)} mensuales a gastos varios que no piensa modificar por ahora, así que esa cifra no debería alterar el cálculo que se le pide a continuación. ` +
    `Después de revisar varias opciones en el mercado financiero, decidió abrir un depósito a plazo en ${bancoImaginario}, colocando de una sola vez ${fmt(P)} de sus ahorros. ` +
    `Esta entidad le ofreció una tasa nominal anual del ${tasaNominalPct}%, capitalizable de forma ${temporalidad}, y ${nombre} no piensa retirar ni un centavo hasta alcanzar su objetivo. ` +
    `Se ha propuesto que, cuando el saldo de ese depósito llegue a ${fmt(F)}, retirará el dinero para financiar su meta. ` +
    `Suponiendo que la tasa se mantiene constante durante todo el plazo y que no realiza depósitos ni retiros adicionales, **¿cuántos años como mínimo deberá esperar ${nombre} para que el depósito alcance ese monto?**`;

  return {
    categoria: 'Problema de destino',
    enunciado,
    unidad: 'años',
    respuesta: round2(anios),
    solucion: [
      `Datos relevantes: P = ${fmt(P)}, F objetivo = ${fmt(F)}, tasa nominal = ${tasaNominalPct}% capitalizable ${temporalidad} (el gasto mensual y la edad de ${nombre} son datos distractores, no se usan).`,
      `Tasa periódica: r = ${tasaNominalPct}% / ${t.m} = ${(r * 100).toFixed(4)}% por ${t.periodo}.`,
      `n = ln(F/P) / ln(1+r) = ln(${(F / P).toFixed(4)}) / ln(1 + ${(r * 100).toFixed(4)}%) ≈ ${n.toFixed(2)} ${t.periodoPlural}.`,
      `En años: t = n / ${t.m} ≈ ${anios.toFixed(2)} años.`,
    ],
  };
}

function generarPreguntaNivel(nivel) {
  const gen = GENERADORES_QUIZ[nivel - 1] || GENERADORES_QUIZ[0];
  return { ...gen(), nivel };
}

function QuizTab() {
  const [nivel, setNivel] = useState(1);
  const [pregunta, setPregunta] = useState(() => generarPreguntaNivel(1));
  const [respuestaTexto, setRespuestaTexto] = useState('');
  const [verificado, setVerificado] = useState(false);
  const [correcto, setCorrecto] = useState(false);
  const [puntaje, setPuntaje] = useState({ aciertos: 0, total: 0 });

  const cambiarNivel = (n) => {
    setNivel(n);
    setPregunta(generarPreguntaNivel(n));
    setRespuestaTexto('');
    setVerificado(false);
    setCorrecto(false);
    setPuntaje({ aciertos: 0, total: 0 });
  };

  const nuevaPregunta = () => {
    setPregunta(generarPreguntaNivel(nivel));
    setRespuestaTexto('');
    setVerificado(false);
    setCorrecto(false);
  };

  const verificar = () => {
    const valor = parseFloat(respuestaTexto.replace(',', '.'));
    const ok = dentroDeTolerancia(valor, pregunta.respuesta, pregunta.unidad);
    setCorrecto(ok);
    setVerificado(true);
    setPuntaje((p) => ({ aciertos: p.aciertos + (ok ? 1 : 0), total: p.total + 1 }));
  };

  const meta = NIVELES_META[nivel - 1];
  const unidadSufijo = pregunta.unidad === '%' ? '%' : pregunta.unidad === '$' ? '$' : pregunta.unidad === 'años' ? 'años' : 'periodos';

  return (
    <div className="space-y-5">
      <div>
        <div className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold mb-2">
          Nivel de dificultad (1 = más fácil, 10 = más difícil)
        </div>
        <div className="flex flex-wrap gap-1.5">
          {NIVELES_META.map((m) => (
            <PillButton key={m.nivel} active={nivel === m.nivel} onClick={() => cambiarNivel(m.nivel)}>
              {m.nivel}
            </PillButton>
          ))}
        </div>
      </div>

      <div className="grid sm:grid-cols-3 gap-3">
        <StatCard label="Nivel actual" value={`${nivel} · ${meta.tag}`} accent="blue" />
        <StatCard label="Aciertos" value={`${puntaje.aciertos} / ${puntaje.total}`} accent="teal" />
        <StatCard
          label="Efectividad"
          value={puntaje.total ? `${Math.round((puntaje.aciertos / puntaje.total) * 100)}%` : '—'}
          accent="coral"
        />
      </div>

      <div className="cx-bg-surface border cx-border-border rounded-lg p-4 sm:p-5 space-y-4">
        <div className="flex items-center gap-2 cx-text-accent-primary-text font-semibold text-xs uppercase tracking-wide">
          <Lightbulb size={14} /> {pregunta.categoria} · Nivel {nivel}
        </div>
        <p className="text-[15px] cx-text-text-strong-gray leading-relaxed"><TextoConNegritas texto={pregunta.enunciado} /></p>

        <div className="flex flex-col sm:flex-row gap-3 sm:items-end">
          <label className="flex-1 flex flex-col gap-1">
            <span className="text-xs uppercase tracking-wide cx-text-text-muted font-semibold">Tu respuesta ({unidadSufijo})</span>
            <input
              type="text"
              inputMode="decimal"
              value={respuestaTexto}
              onChange={(e) => setRespuestaTexto(e.target.value)}
              placeholder={pregunta.unidad === '$' ? 'Ej. 12500.50' : 'Ej. 14.25'}
              className="w-full px-3 py-2.5 border-2 cx-border-border rounded-lg outline-none cx-focus-border-accent-primary cx-bg-surface cx-text-text-primary"
              style={{ fontFamily: "'JetBrains Mono', monospace" }}
            />
          </label>
          <div className="flex gap-2">
            <button
              onClick={verificar}
              disabled={respuestaTexto.trim() === ''}
              className="px-4 py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40"
              style={{ background: 'var(--accent-primary)' }}
            >
              Verificar
            </button>
            <button
              onClick={nuevaPregunta}
              className="px-4 py-2.5 rounded-lg text-sm font-semibold cx-bg-surface cx-text-text-secondary border-2 cx-border-border cx-hover-border-border-hover flex items-center gap-1.5"
            >
              <RotateCcw size={14} /> Nueva
            </button>
          </div>
        </div>

        {verificado && (
          <div
            className={`rounded-lg p-4 space-y-2 ${correcto ? 'cx-bg-accent-green-bg' : 'cx-bg-accent-coral-bg'}`}
          >
            <div className={`flex items-center gap-2 font-semibold text-sm ${correcto ? 'cx-text-accent-green-text' : 'cx-text-accent-coral-text'}`}>
              {correcto ? <Check size={16} /> : <X size={16} />}
              {correcto ? '¡Correcto!' : 'No es correcto todavía.'}
            </div>
            <p className="text-sm cx-text-text-strong-gray">
              Respuesta esperada: <strong>{pregunta.unidad === '%' || pregunta.unidad === 'años' || pregunta.unidad === 'periodos' ? pregunta.respuesta.toLocaleString('es-EC', { maximumFractionDigits: 2 }) + (pregunta.unidad === '%' ? '%' : ' ' + unidadSufijo) : fmt(pregunta.respuesta)}</strong>
            </p>
            <div className="space-y-1 pt-1 border-t" style={{ borderColor: 'var(--border)' }}>
              {pregunta.solucion.map((linea, i) => (
                <p key={i} className="text-xs cx-text-text-secondary leading-relaxed">{linea}</p>
              ))}
            </div>
          </div>
        )}
      </div>

      <p className="text-[11px] cx-text-text-faint">
        Cada nivel genera preguntas nuevas con números aleatorios cada vez — puedes practicar el mismo nivel las veces que quieras.
        La tolerancia de la respuesta considera redondeos normales de cálculo.
      </p>
    </div>
  );
}

            className="flex items-center gap-1 text-xs font-semibold px-3.5 py-1.5 rounded-md text-white"
            style={{ background: 'var(--accent-green)' }}
          >
            <Check size={13} /> Listo
          </button>
        )}
      </div>
    </div>
  );
}

function FinanzasApp() {
  const [folder, setFolder] = useState(null);
  const [tutorialOn, setTutorialOn] = useState(false);
  const [tutorialStep, setTutorialStep] = useState(0);
  const [entering, setEntering] = useState(false);
  const [leaving, setLeaving] = useState(false);
  const [origin, setOrigin] = useState({ x: 50, y: 15 });
  const [theme, setTheme] = useState('light');
  const [acercaDeOpen, setAcercaDeOpen] = useState(false);
  const [booting, setBooting] = useState(true);
  const [splashDone, setSplashDone] = useState(false);

  useEffect(() => {
    const t1 = setTimeout(() => setBooting(false), 1700);
    const t2 = setTimeout(() => setSplashDone(true), 2000);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  const shellRef = useRef(null);
  const TRANSITION_MS = 190;

  const toggleTheme = () => setTheme((t) => (t === 'light' ? 'dark' : 'light'));

  const jugarTransicion = (aplicarCambio) => {
    setLeaving(true);
    setTimeout(() => {
      aplicarCambio();
      setLeaving(false);
      setEntering(true);
      requestAnimationFrame(() => requestAnimationFrame(() => setEntering(false)));
    }, TRANSITION_MS);
  };

  const irA = (key, cardEl) => {
    if (key === folder) return;
    if (cardEl && shellRef.current) {
      const c = shellRef.current.getBoundingClientRect();
      const r = cardEl.getBoundingClientRect();
      setOrigin({
        x: ((r.left + r.width / 2 - c.left) / c.width) * 100,
        y: ((r.top + r.height / 2 - c.top) / c.height) * 100,
      });
    } else {
      setOrigin({ x: 50, y: 15 });
    }
    jugarTransicion(() => {
      setFolder(key);
      setTutorialOn(false);
      setTutorialStep(0);
    });
  };

  const abrirFolder = (key, cardEl) => irA(key, cardEl);
  const volver = () => irA(null);

  const toggleTutorial = () => { setTutorialOn((o) => !o); setTutorialStep(0); };

  const folderDef = FOLDERS.find((f) => f.key === folder);
  const steps = folder ? TUTORIALES[folder] : [];

  const contentStyle = {
    transformOrigin: `${origin.x}% ${origin.y}%`,
    opacity: leaving || entering ? 0 : 1,
    transform: leaving
      ? 'scale(0.93)'
      : entering
      ? (folder ? 'scale(0.8)' : 'scale(0.96)')
      : undefined,
    transition: 'opacity 190ms ease-out, transform 190ms ease-out',
  };

  return (
    <>
      <div

        data-theme={theme}
        style={{
          background:
            'radial-gradient(1100px 500px at 85% -10%, rgba(31,77,58,0.07), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(138,109,31,0.06), transparent 55%), var(--bg)',
        }}
      >
        {!splashDone && <SplashScreen fadingOut={!booting} />}
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');
          body { font-family: 'Inter', sans-serif; }
          @keyframes fillbar { from { width: 0%; } to { width: 100%; } }
          .splash-bar { width: 0%; animation: fillbar 1.6s ease-out forwards; }
          .espol-logo { transition: filter 200ms ease; }
          .finapp-root[data-theme='dark'] .espol-logo { filter: invert(1) brightness(1.7); }

          .finapp-root {
            --bg: #F1ECDC;
            --surface: #FBF8EF;
            --surface-alt: #E7EEE4;
            --surface-hover: #EFE9D6;
            --surface-hover-2: #E7DFC5;
            --surface-hover-3: #DCD2AF;
            --border: #D9CFAE;
            --border-hover: #B7A876;
            --text-primary: #241D12;
            --text-secondary: #5B5138;
            --text-muted: #85795A;
            --text-faint: #ACA080;
            --text-strong-gray: #4A4128;
            --accent-primary: #1F4D3A;
            --accent-primary-bg: #E3ECE3;
            --accent-primary-bg-hover: #D2E1D2;
            --accent-primary-text: #163A2B;
            --accent-green: #2F8F5B;
            --accent-green-bg: #E4F1E7;
            --accent-green-text: #1D6B44;
            --accent-coral: #A3402E;
            --accent-coral-bg: #F3E3DC;
            --accent-coral-text: #832E20;
            --accent-coral-border: #DDB9A6;
            --chart-grid: #E1D8BC;
            --chart-axis: #9C8F6E;
          }
          .finapp-root[data-theme='dark'] {
            --bg: #17140C;
            --surface: #201B10;
            --surface-alt: #202A22;
            --surface-hover: #262014;
            --surface-hover-2: #2E2718;
            --surface-hover-3: #3A311D;
            --border: #3A3018;
            --border-hover: #5C4E28;
            --text-primary: #F1EAD3;
            --text-secondary: #D0C4A0;
            --text-muted: #A4977A;

            --accent-coral-bg: #392419;
            --accent-coral-text: #F0B79E;
            --accent-coral-border: #5A3A27;
            --chart-grid: #3A3018;
            --chart-axis: #8C7F5D;
          }
          .finapp-root, .finapp-root * {
            transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease;
          }

            color: var(--text-faint);

            color-scheme: light;
            background-image: repeating-linear-gradient(
              to bottom,
              rgba(120, 105, 60, 0.05),

              transparent 1px,

            );
          }
          .finapp-root[data-theme='dark'] {
            color-scheme: dark;
          }

          .cx-bg-surface-hover-2 { background-color: var(--surface-hover-2); }
          .cx-hover-bg-surface-hover-3:hover { background-color: var(--surface-hover-3); }
          .cx-hover-bg-surface-hover-2:hover { background-color: var(--surface-hover-2); }
          .cx-bg-surface { background-color: var(--surface); }
          .cx-text-text-secondary { color: var(--text-secondary); }
          .cx-border-20-accent-green { border-color: color-mix(in srgb, var(--accent-green) 20%, transparent); }
          .cx-bg-accent-green-bg { background-color: var(--accent-green-bg); }
          .cx-border-20-accent-primary { border-color: color-mix(in srgb, var(--accent-primary) 20%, transparent); }
          .cx-bg-accent-primary-bg { background-color: var(--accent-primary-bg); }
          .cx-text-accent-green-text { color: var(--accent-green-text); }
          .cx-text-accent-primary { color: var(--accent-primary); }
          .cx-text-text-strong-gray { color: var(--text-strong-gray); }
          .cx-border-accent-primary { border-color: var(--accent-primary); }
          .cx-border-border { border-color: var(--border); }
          .cx-text-text-muted { color: var(--text-muted); }
          .cx-text-text-faint { color: var(--text-faint); }
          .cx-text-text-primary { color: var(--text-primary); }
          .cx-hover-border-border-hover:hover { border-color: var(--border-hover); }
          .cx-focusw-border-accent-primary:focus-within { border-color: var(--accent-primary); }
          .cx-text-accent-coral-text { color: var(--accent-coral-text); }
          .cx-bg-accent-coral-bg { background-color: var(--accent-coral-bg); }
          .cx-text-accent-primary-text { color: var(--accent-primary-text); }
          .cx-hover-bg-accent-primary-bg-hover:hover { background-color: var(--accent-primary-bg-hover); }
          .cx-border-border-hover { border-color: var(--border-hover); }
          .cx-bg-surface-alt { background-color: var(--surface-alt); }

          .cx-hover-bg-surface-hover:hover { background-color: var(--surface-hover); }

          .cx-hover-text-accent-coral-text:hover { color: var(--accent-coral-text); }
          .cx-border-accent-green { border-color: var(--accent-green); }
          .cx-border-15-accent-primary { border-color: color-mix(in srgb, var(--accent-primary) 15%, transparent); }
          .cx-border-accent-coral-border { border-color: var(--accent-coral-border); }
          .cx-hover-text-accent-primary:hover { color: var(--accent-primary); }
        `}</style>
        <div className="max-w-5xl mx-auto px-4 py-6 sm:py-8" style={{ fontFamily: "'Inter', sans-serif" }}>
          <header
            className="relative overflow-hidden rounded-lg mb-5 px-5 py-6 sm:px-8 sm:py-8"
            style={{ background: 'linear-gradient(135deg, #1F4D3A 0%, #2A6349 55%, #163A2B 100%)' }}
          >
            <div
              className="absolute inset-0 opacity-[0.05] pointer-events-none"
              style={{
                backgroundImage:
                  'repeating-linear-gradient(to bottom, transparent, transparent 27px, #fff 27px, #fff 28px)',
              }}
            />
            <div className="relative flex items-center justify-between gap-3 flex-wrap">
              <button
                onClick={volver}
                className="inline-flex items-center gap-2 text-[#D9C98A] text-xs uppercase tracking-[0.15em] font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3 py-1 transition-colors"
                aria-label="Volver al menú principal"
              >
                <Calculator size={14} /> Proyecto de Matemáticas Discretas · Finanzas para todos
              </button>
              <div className="flex items-center gap-2">
                <button
                  onClick={toggleTheme}
                  className="inline-flex items-center gap-1.5 text-white text-xs font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3.5 py-1.5 transition-colors"
                  aria-label="Cambiar entre tema claro y oscuro"
                >
                  {theme === 'dark' ? <Sun size={13} /> : <Moon size={13} />}
                  {theme === 'dark' ? 'Claro' : 'Oscuro'}
                </button>
                <button
                  onClick={() => setAcercaDeOpen(true)}
                  className="inline-flex items-center gap-1.5 text-white text-xs font-semibold bg-white/10 hover:bg-white/20 rounded-md px-3.5 py-1.5 transition-colors"
                >
                  <Info size={13} /> Acerca de
                </button>
              </div>
            </div>
            <div className="absolute left-0 right-0 bottom-0">
              <div className="h-[3px]" style={{ background: '#D9C98A', opacity: 0.9 }} />
              <div className="h-px mt-[3px]" style={{ background: '#D9C98A', opacity: 0.5 }} />
            </div>
          </header>

          {acercaDeOpen && (
            <Modal onClose={() => setAcercaDeOpen(false)}>
              <div className="flex items-center gap-2 cx-text-accent-primary font-semibold text-sm mb-1" style={{ fontFamily: "'Fraunces', sans-serif" }}>
                <Calculator size={16} /> Proyecto de Proyecto de Matemáticas Discretas · Finanzas para todos
              </div>
              <h3 className="text-2xl mb-3" style={{ fontFamily: "'Fraunces', sans-serif", fontWeight: 600, color: 'var(--text-primary)' }}>
                PROTOTIPO PARA PROYECTO DE MATEMATICAS DISCRETAS
              </h3>
              <p className="text-sm leading-relaxed" style={{ color: 'var(--text-secondary)' }}>

              </p>
              <p className="text-xs mt-4 pt-4 border-t" style={{ color: 'var(--text-faint)', borderColor: 'var(--border)' }}>
                Prototipo educativo · las cifras son ilustrativas y NO constituyen asesoría financiera.
              </p>
            </Modal>
          )}

          <div ref={shellRef} className="cx-bg-surface rounded-lg border cx-border-border p-4 sm:p-6 shadow-lg shadow-black/[0.08] relative">
            <div style={contentStyle}>
              {folder === null ? (
                <GameMenu onSelect={abrirFolder} />
              ) : (
                <div>
                  <FolderHeader folder={folderDef} tutorialOn={tutorialOn} onToggleTutorial={toggleTutorial} onBack={volver} />
                  {folder !== 'formulario' && <VideoPlaceholder tema={folderDef.label} folderKey={folder} />}
                  {folder === 'interes' && <InteresTab />}
                  {folder === 'tasas' && <TasasEquivalentesTab />}
                  {folder === 'anualidades' && <AnualidadesTab />}
                  {folder === 'simulador' && <SimuladorTab />}
                  {folder === 'quizzes' && <QuizTab />}
                  {folder === 'formulario' && <FormularioTab />}
                </div>
              )}
            </div>
            {folder && tutorialOn && folder !== 'formulario' && (
              <TutorialDrawer steps={steps} index={tutorialStep} setIndex={setTutorialStep} onClose={() => setTutorialOn(false)} />
            )}
          </div>

          <footer className="mt-8 pt-6 border-t cx-border-border text-center">
            <img src={ESPOL_LOGO} alt="ESPOL" className="espol-logo w-9 mx-auto mb-3 opacity-60" />
            <div
              className="inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide cx-text-text-secondary mb-1.5"
            >
              <AlertTriangle size={12} /> Prototipo educativo — Esto NO es NINGUN tipo de asesoría financiera
            </div>
            <p className="text-[11px] cx-text-text-faint max-w-xl mx-auto leading-relaxed">
              Este cuaderno fue desarrollado con fines académicos para Matemáticas Discretas, Escuela Superior Politécnica del Litoral (ESPOL).
              Las cifras, tasas y resultados son ilustrativos y se calculan con fórmulas simplificadas — no constituyen asesoría financiera,
              legal ni una oferta de productos financieros reales. Verifica siempre condiciones y tasas con una institución financiera antes
              de tomar decisiones con dinero real.
            </p>
          </footer>
        </div>
      </div>
      <PrintableFormulario />
    </>
  );
}
