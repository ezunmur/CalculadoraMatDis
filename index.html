const FRASES_CARGA = [
  'El interés compuesto no descansa, ni siquiera los domingos.',
  'Calculando cuánto cuesta el "cómprate algo bonito".',
  'Convirtiendo excusas en tasas efectivas anuales.',
  'Sin comisiones ocultas, esta vez sí.',

  'El capital inicial también fue joven alguna vez.',

// ---------- Utilidades ----------
const fmt = (n) => {
  if (!isFinite(n)) return '—';
  return '$' + n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtInt = (n) => n.toLocaleString('es-EC', { maximumFractionDigits: 0 });

const monthsToYears = (m) => {
  if (!isFinite(m)) return '—';
  const y = Math.floor(m / 12);
  const rem = Math.round(m % 12);
  if (y === 0) return `${rem} ${rem === 1 ? 'mes' : 'meses'}`;
  if (rem === 0) return `${y} ${y === 1 ? 'año' : 'años'}`;
  return `${y} ${y === 1 ? 'año' : 'años'} y ${rem} ${rem === 1 ? 'mes' : 'meses'}`;
};

const TEMPORALIDADES = [
  { key: 'anual', label: 'Anual', m: 1, periodo: 'año', periodoPlural: 'años' },
  { key: 'semestral', label: 'Semestral', m: 2, periodo: 'semestre', periodoPlural: 'semestres' },
  { key: 'trimestral', label: 'Trimestral', m: 4, periodo: 'trimestre', periodoPlural: 'trimestres' },
  { key: 'mensual', label: 'Mensual', m: 12, periodo: 'mes', periodoPlural: 'meses' },
  { key: 'diaria', label: 'Diaria', m: 365, periodo: 'día', periodoPlural: 'días' },
  { key: 'continua', label: 'Continua', m: null, periodo: 'año', periodoPlural: 'años' },
];
const getTemporalidad = (key) => TEMPORALIDADES.find((t) => t.key === key) || TEMPORALIDADES[3];

function tasaPeriodica(tasaNominalPct, temporalidadKey) {
  const t = getTemporalidad(temporalidadKey);
  if (t.key === 'continua') return null;
  return (tasaNominalPct / 100) / t.m;
}

function calcularTEADesdeOrigen(tasaPct, tipoOrigen, temporalidadOrigenKey) {
  const t = getTemporalidad(temporalidadOrigenKey);
  const tasaFrac = tasaPct / 100;
  if (t.key === 'continua') return Math.exp(tasaFrac) - 1;
  const iOrigen = tipoOrigen === 'nominal' ? tasaFrac / t.m : tasaFrac;
  return Math.pow(1 + iOrigen, t.m) - 1;
}
function calcularTasaDestinoDesdeTEA(tea, tipoDestino, temporalidadDestinoKey) {
  const t = getTemporalidad(temporalidadDestinoKey);
  if (t.key === 'continua') return Math.log(1 + tea) * 100;
  const iDestino = Math.pow(1 + tea, 1 / t.m) - 1;
  return (tipoDestino === 'nominal' ? iDestino * t.m : iDestino) * 100;
}

function calcularContinuo(P, tasaNominalPct, anios) {
  const r = tasaNominalPct / 100;
  const F = P * Math.exp(r * anios);
  return { F, interes: F - P };
}

function calcularAmortizacion(P, r, n, sistema) {
  const rows = [];
  let saldo = P;

  if (sistema === 'francesa') {
    const pago = r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n));
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      let capital = pago - interes;
      let saldoFinal = saldo - capital;
      if (t === n) { capital += saldoFinal; saldoFinal = 0; }
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  } else if (sistema === 'alemana') {
    const capitalFijo = P / n;
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const pago = capitalFijo + interes;
      const saldoFinal = Math.max(0, saldo - capitalFijo);
      rows.push({ t, saldoInicial: saldo, pago, interes, capital: capitalFijo, saldoFinal });
      saldo = saldoFinal;
    }
  } else {
    for (let t = 1; t <= n; t++) {
      const interes = saldo * r;
      const capital = t === n ? saldo : 0;
      const pago = interes + capital;
      const saldoFinal = saldo - capital;
      rows.push({ t, saldoInicial: saldo, pago, interes, capital, saldoFinal });
      saldo = saldoFinal;
    }
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0) };
}

function calcularSimple(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = P * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function calcularCompuesto(P, r, n) {
  const rows = [];
  let saldo = P;
  for (let t = 1; t <= n; t++) {
    const interes = saldo * r;
    const saldoFinal = saldo + interes;
    rows.push({ t, saldoInicial: saldo, interes, capital: P, saldoFinal });
    saldo = saldoFinal;
  }
  return { rows, totalInteres: rows.reduce((a, b) => a + b.interes, 0), saldoFinal: saldo };
}

function simularCamino({ tipo, monto, base, tasaAnual = 0, extraMensual = 0, extrasUnicos = [], maxMeses = 1200 }) {
  const r = tasaAnual / 100 / 12;
  const aporteExtra = (m) =>
    extraMensual + extrasUnicos.reduce((acc, e) => acc + (m === e.mes ? (e.monto || 0) : 0), 0);

  if (tipo === 'alcancia') {
    let saldo = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      saldo += base + aporteExtra(m);
      serie.push({ mes: m, saldo: Math.min(saldo, monto) });
      if (saldo >= monto) return { meses: m, totalInteres: 0, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: 0, serie, alcanzado: false };
  }

  if (tipo === 'ahorroSimple') {
    let principal = 0, interesAcum = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      principal += base + aporteExtra(m);
      interesAcum += principal * r;
      const saldo = principal + interesAcum;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: interesAcum, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: interesAcum, serie, alcanzado: false };
  }

  if (tipo === 'ahorroCompuesto') {
    let saldo = 0, aportado = 0;
    const serie = [{ mes: 0, saldo: 0 }];
    for (let m = 1; m <= maxMeses; m++) {
      const aporte = base + aporteExtra(m);
      saldo = saldo * (1 + r) + aporte;
      aportado += aporte;
      serie.push({ mes: m, saldo });
      if (saldo >= monto) return { meses: m, totalInteres: saldo - aportado, serie, alcanzado: true };
    }
    return { meses: Infinity, totalInteres: saldo - aportado, serie, alcanzado: false };
  }

  let saldo = monto, interesTotal = 0;
  const serie = [{ mes: 0, saldo }];
  const hayExtraUnico = extrasUnicos.some((e) => (e.monto || 0) > 0);
  if (base + extraMensual <= saldo * r && !hayExtraUnico) {
    return { meses: Infinity, totalInteres: Infinity, serie, nuncaPaga: true };
  }
  for (let m = 1; m <= maxMeses; m++) {
    const interes = saldo * r;
    interesTotal += interes;
    const pago = base + aporteExtra(m);
    saldo = saldo + interes - pago;
    if (saldo < 0) saldo = 0;
    serie.push({ mes: m, saldo });
    if (saldo <= 0) return { meses: m, totalInteres: interesTotal, serie, nuncaPaga: false };
  }
  return { meses: Infinity, totalInteres: interesTotal, serie, nuncaPaga: false };
}

// Reduce un arreglo largo a un número manejable de filas para tablas (siempre conserva la última).
// Funciona con cualquier forma de fila (mes/saldo, periodo/interés, amortización, etc.)
function sampleSerie(serie, maxRows) {
  if (!serie || serie.length === 0) return [];
  if (serie.length <= maxRows) return serie;
  const step = Math.ceil(serie.length / maxRows);
  const out = [];
  for (let i = 0; i < serie.length; i += step) out.push(serie[i]);
  const last = serie[serie.length - 1];
  if (out[out.length - 1] !== last) out.push(last);
  return out;
}

function Field({ label, suffix, value, onChange, min, step }) {
  const [texto, setTexto] = useState(value === 0 ? '' : String(value));
  const [enfocado, setEnfocado] = useState(false);
  // Sincroniza el texto visible con el valor externo (ej. al presionar "Reset"),
  // pero no mientras el usuario está escribiendo (evita "pelear" con el cursor).
  useEffect(() => {
    if (!enfocado) setTexto(value === 0 ? '' : String(value));
  }, [value, enfocado]);
  const manejarCambio = (e) => {
    const t = e.target.value; setTexto(t); const num = parseFloat(t); onChange(isNaN(num) ? 0 : num);
  };
  return (
    <label className="flex flex-wrap items-end gap-x-2 gap-y-0.5 border-b-2 cx-border-border cx-focusw-border-accent-primary min-w-0 pb-1">
      <span className="text-[11px] cx-text-text-muted font-medium whitespace-nowrap">{label}</span>
      <input type="number" value={texto} min={min} step={step} onChange={manejarCambio} onFocus={() => setEnfocado(true)} onBlur={() => setEnfocado(false)} placeholder="-,--" className="flex-1 min-w-[64px] text-right px-0.5 outline-none bg-transparent cx-text-text-primary" style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '1.1rem', fontWeight: 600, letterSpacing: '-0.01em' }} />
      {suffix && <span className="text-sm cx-text-text-faint flex-shrink-0">{suffix}</span>}
    </label>
  );
}

}

  const [dashboardOn, setDashboardOn] = useState(true);
  const [tutorialOn, setTutorialOn] = useState(false);
  const [discreteOn, setDiscreteOn] = useState(false);
  const [tutorialStep, setTutorialStep] = useState(0);
  return { dashboardOn, setDashboardOn, tutorialOn, setTutorialOn, discreteOn, setDiscreteOn, tutorialStep, setTutorialStep };

// ============================================================
// TASAS EQUIVALENTES TAB - CON FÓRMULAS LIMPIAS
// ============================================================

function TasasEquivalentesTab() {
  const [tasaValor, setTasaValor] = useState(18);
  const [origen, setOrigen] = useState('anual');
  const [destino, setDestino] = useState('mensual');
  const [tipoOrigen, setTipoOrigen] = useState('nominal');
  const [tipoDestino, setTipoDestino] = useState('efectiva');

  const { dashboardOn, setDashboardOn, tutorialOn, setTutorialOn, discreteOn, setDiscreteOn, tutorialStep, setTutorialStep } = useModes();

  const tOrigen = getTemporalidad(origen);
  const tDestino = getTemporalidad(destino);
  
  const tea = calcularTEADesdeOrigen(tasaValor, tipoOrigen, origen);
  const tasaDestino = calcularTasaDestinoDesdeTEA(tea, tipoDestino, destino);
  const periodicaDestino = destino === 'continua' 
    ? null 
    : (tipoDestino === 'nominal' ? tasaDestino / 100 / tDestino.m : tasaDestino / 100);

  const chartData = TEMPORALIDADES.map((t) => ({
    temporalidad: t.label,
    'Tasa equivalente': calcularTasaDestinoDesdeTEA(tea, tipoDestino, t.key),
  }));

  const opcionesTemporalidad = TEMPORALIDADES.map((t) => ({ value: t.key, label: t.label }));
  const opcionesTipo = [
    { value: 'nominal', label: 'Nominal' },
    { value: 'efectiva', label: 'Efectiva' }
  ];

  // ============================================================
  // FÓRMULAS CON RENDERIZADO LIMPIO (SIN LaTeX)
  // ============================================================
  function getFormulaDisplay() {
    const j = (tasaValor / 100).toFixed(4);
    const teaStr = tea.toFixed(4);
    const teaValue = (tea * 100).toFixed(4);
    const destValue = tasaDestino.toFixed(4);
    const periodicValue = periodicaDestino ? (periodicaDestino * 100).toFixed(4) : '—';

    const origenLabel = tipoOrigen === 'nominal' ? 'Nominal' : 'Efectiva';
    const destinoLabel = tipoDestino === 'nominal' ? 'Nominal' : 'Efectiva';
    const origenTemp = tOrigen.label.toLowerCase();
    const destTemp = tDestino.label.toLowerCase();
    const m = tOrigen.m; // capitalizaciones por año del origen (null si es continua)
    const m2 = tDestino.m; // capitalizaciones por año del destino (null si es continua)

    // ---------- PASO 1: tasa de origen → TEA ----------
    let pasoOrigen;
    if (origen === 'continua') {
      pasoOrigen = {
        etiqueta: 'Paso 1 · Continua → TEA',
        formula: <>TEA = <Pow base="e" exp={<Var>j</Var>} /> − 1</>,
        valores: <>TEA = <Pow base="e" exp={j} /> − 1 = {teaValue}%</>,
        texto: `TEA = e^${j} − 1 = ${teaValue}%`,
      };
    } else if (tipoOrigen === 'nominal') {
      pasoOrigen = {
        etiqueta: `Paso 1 · Nominal (${origenTemp}) → TEA`,
        formula: <>TEA = <Pow base={<>(1 + <Frac num={<Var>j</Var>} den={<Var>m</Var>} />)</>} exp={<Var>m</Var>} /> − 1</>,
        valores: <>TEA = <Pow base={<>(1 + <Frac num={j} den={m} />)</>} exp={m} /> − 1 = {teaValue}%</>,
        texto: `Se divide la tasa nominal entre ${m} (capitalizaciones/año del origen) y el resultado se eleva a ${m}: TEA = (1 + ${j}/${m})^${m} − 1 = ${teaValue}%`,
      };
    } else {
      pasoOrigen = {
        etiqueta: `Paso 1 · Efectiva (${origenTemp}) → TEA`,
        formula: <>TEA = <Pow base={<>(1 + <Var>i</Var>)</>} exp={<Var>m</Var>} /> − 1</>,
        valores: <>TEA = <Pow base={<>(1 + {j})</>} exp={m} /> − 1 = {teaValue}%</>,
        texto: `TEA = (1 + ${j})^${m} − 1 = ${teaValue}%`,
      };
    }

    // ---------- PASO 2: TEA → tasa de destino ----------
    let pasoDestino;
    if (destino === 'continua') {
      pasoDestino = {
        etiqueta: 'Paso 2 · TEA → Continua',
        formula: <><Var>j</Var><Sub>2</Sub> = ln(1 + <Var>TEA</Var>)</>,
        valores: <>j₂ = ln(1 + {teaStr}) = {destValue}%</>,
        texto: `j₂ = ln(1 + ${teaStr}) = ${destValue}%`,
      };
    } else if (tipoDestino === 'nominal') {
      pasoDestino = {
        etiqueta: `Paso 2 · TEA → Nominal (${destTemp})`,
        formula: <><Var>j</Var><Sub>2</Sub> = <Var>m</Var><Sub>2</Sub> · [<Pow base={<>(1 + <Var>TEA</Var>)</>} exp={<Frac num="1" den={<><Var>m</Var><Sub>2</Sub></>} />} /> − 1]</>,
        valores: <>j₂ = {m2} · [<Pow base={<>(1 + {teaStr})</>} exp={<Frac num="1" den={m2} />} /> − 1] = {destValue}%</>,
        texto: `Primero se eleva (1 + TEA) a 1/${m2} (se divide el exponente entre ${m2}, las capitalizaciones/año del destino), y luego el resultado se multiplica por ${m2}: j₂ = ${m2} · [(1+${teaStr})^(1/${m2}) − 1] = ${destValue}%`,
      };
    } else {
      pasoDestino = {
        etiqueta: `Paso 2 · TEA → Efectiva (${destTemp})`,
        formula: <><Var>i</Var><Sub>2</Sub> = <Pow base={<>(1 + <Var>TEA</Var>)</>} exp={<Frac num="1" den={<Var>m</Var>} />} /> − 1</>,
        valores: <>i₂ = <Pow base={<>(1 + {teaStr})</>} exp={<Frac num="1" den={m2} />} /> − 1 = {destValue}%</>,
        texto: `Se eleva (1 + TEA) a 1/${m2} (se divide el exponente entre ${m2}): i₂ = (1+${teaStr})^(1/${m2}) − 1 = ${destValue}%`,
      };
    }

    // ---------- Variables combinadas ----------
    const variables = [];
    if (origen === 'continua') {
      variables.push({ simbolo: 'j', desc: 'Tasa nominal continua (origen)' }, { simbolo: 'e', desc: 'Constante de Euler (≈ 2.71828)' });
    } else if (tipoOrigen === 'nominal') {
      variables.push({ simbolo: 'j', desc: 'Tasa nominal anual (origen)' }, { simbolo: 'm', desc: `Capitalizaciones/año origen (${origenTemp} = ${m})` });
    } else {
      variables.push({ simbolo: 'i', desc: 'Tasa efectiva del periodo origen' }, { simbolo: 'm', desc: `Capitalizaciones/año origen (${origenTemp} = ${m})` });
    }
    variables.push({ simbolo: 'TEA', desc: 'Tasa efectiva anual (puente entre ambas)' });
    if (destino === 'continua') {
      variables.push({ simbolo: 'j₂', desc: 'Tasa nominal continua destino' });
    } else if (tipoDestino === 'nominal') {
      variables.push({ simbolo: 'm₂', desc: `Capitalizaciones/año destino (${destTemp} = ${m2})` }, { simbolo: 'j₂', desc: 'Tasa nominal destino' });
    } else {
      variables.push({ simbolo: 'm₂', desc: `Capitalizaciones/año destino (${destTemp} = ${m2})` }, { simbolo: 'i₂', desc: 'Tasa efectiva destino' });
    }

    return {
      titulo: `${origenLabel} ${origen === 'continua' ? 'Continua' : `(${origenTemp})`} → ${destinoLabel} ${destino === 'continua' ? 'Continua' : `(${destTemp})`}`,
      pasoOrigen,
      pasoDestino,
      variables,
      pasos: [pasoOrigen.texto, pasoDestino.texto],
      periodic: periodicValue,
    };
  }

  const formulaData = getFormulaDisplay();

  const tutorialSteps = [
    { index: 0, titulo: '🔄 Tasas Equivalentes', texto: 'Elige la tasa de origen (nominal o efectiva) y la temporalidad hacia la que quieres convertirla.', consejo: 'La TEA es el "puente" para comparar tasas con distinta capitalización.' },
    { index: 1, titulo: '📐 Lee el desarrollo del cálculo', texto: 'La sección "Desarrollo del cálculo" muestra la fórmula general y luego la misma fórmula con tus valores reemplazados.', consejo: 'Compara la fórmula general con la fórmula con valores para entender cada paso.' },
    { index: 2, titulo: '📊 El gráfico de equivalencias', texto: 'La barra final muestra la misma TEA expresada en cada capitalización posible: todas representan el mismo rendimiento.', consejo: 'Por eso se llaman tasas "equivalentes": distinto número, mismo resultado real.' },
  ];

  // ============================================================
  // RENDER
  // ============================================================
  return (
    <div className="space-y-6">
      <ControlPanel 
        dashboardOn={dashboardOn} setDashboardOn={setDashboardOn}
        tutorialOn={tutorialOn} setTutorialOn={setTutorialOn}
        discreteOn={discreteOn} setDiscreteOn={setDiscreteOn}
        onReset={() => { setTasaValor(18); setOrigen('anual'); setDestino('mensual'); setTipoOrigen('nominal'); setTipoDestino('efectiva'); }} 
      />

      {discreteOn && (
        <DiscreteMathDisplay 
          formula={<>TEA = <Pow base={<>(1 + <Frac num={<Var>j</Var>} den={<Var>m</Var>} />)</>} exp={<Var>m</Var>} /> − 1</>}
          variables={[
            { simbolo: 'j', desc: 'Tasa nominal anual' },
            { simbolo: 'm', desc: 'Capitalizaciones por año' },
            { simbolo: 'TEA', desc: 'Tasa efectiva anual' }
          ]}
          recurrence="TEA = (1 + j/m)ᵐ − 1"
          explanation="Base para comparar tasas con diferentes capitalizaciones."
          tipo="sumatoria"
        />
      )}

      {/* SECCIÓN TASAS EQUIVALENTES - CON FÓRMULAS LIMPIAS */}
      <div className="cx-bg-surface-alt rounded-lg border cx-border-border p-5">
        <div className="flex items-center gap-2 mb-3">
          <Sparkles size={16} className="cx-text-accent-primary" />

              {formulaData.pasoOrigen.formula}
            </div>
          </div>
          <div className="bg-white dark:bg-black/20 rounded-lg p-4 border cx-border-border shadow-sm">
            <div className="text-[10px] cx-text-text-muted font-semibold uppercase tracking-wide mb-1 text-center">{formulaData.pasoDestino.etiqueta}</div>
            <div className="text-center font-serif text-base cx-text-text-primary" style={{ fontFamily: "'STIX Two Text', 'Cambria Math', serif" }}>
              {formulaData.pasoDestino.formula}
            </div>
          </div>
        </div>

        {/* Variables */}
        {formulaData.variables && formulaData.variables.length > 0 && (
          <div className="mt-3">
            <div className="text-[10px] font-semibold cx-text-text-muted uppercase tracking-wide mb-1.5">Variables</div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-1 text-xs">
              {formulaData.variables.map((v, i) => (
                <div key={i} className="flex items-baseline gap-1 cx-bg-surface px-2 py-1 rounded">
                  <span className="font-serif italic font-bold cx-text-accent-primary">{v.simbolo}</span>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field 
            label={`Tasa ${tipoOrigen === 'nominal' ? 'nominal' : 'efectiva'} (${tOrigen.label.toLowerCase()})`} 
            suffix="%" 
            value={tasaValor} 
            onChange={setTasaValor} 
            min={0} 
            step={0.1} 
          />
          <div className="grid grid-cols-2 gap-3">
            <SelectField 
              label="Capitalización origen" 
              value={origen} 
              onChange={setOrigen} 
              options={opcionesTemporalidad} 
            />
            <SelectField 
              label="Capitalización destino" 
              value={destino} 
              onChange={setDestino} 
              options={opcionesTemporalidad} 
            />
          </div>
        </div>
        <div className="flex flex-col sm:flex-row items-center justify-center gap-3 pt-1">
          <SelectField 
            label="Tipo origen" 
            value={tipoOrigen} 
            onChange={setTipoOrigen} 
            options={opcionesTipo}

            a

          <SelectField 
            label="Tipo destino" 
            value={tipoDestino} 
            onChange={setTipoDestino} 
            options={opcionesTipo} 
          />
        </div>
      </div>

      {/* Resultados */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <StatCard 
          label="Tasa efectiva anual (TEA)" 
          value={`${(tea * 100).toFixed(4)}%`} 
          accent="blue" 
        />
        <StatCard 
          label={`Tasa ${tipoDestino} ${tDestino.label.toLowerCase()}`} 
          value={`${tasaDestino.toFixed(4)}%`} 
          accent="teal" 
        />
        <StatCard 
          label="Tasa periódica destino" 
          value={periodicaDestino === null ? '—' : `${(periodicaDestino * 100).toFixed(4)}%`} 
          accent="coral" 
        />
      </div>

      {/* Desarrollo del cálculo con fórmulas limpias */}
      <div className="cx-bg-surface-alt rounded-lg p-4 space-y-4">
        <div className="text-[10px] cx-text-text-muted font-semibold uppercase tracking-wide text-center">
          Desarrollo del cálculo · {formulaData.titulo}
        </div>

        {/* Paso 1: origen → TEA */}
        <div className="space-y-2">
          <div className="text-[10px] cx-text-accent-primary font-semibold uppercase tracking-wide text-center">{formulaData.pasoOrigen.etiqueta}</div>
          <div className="bg-white dark:bg-black/20 rounded-lg p-3 border cx-border-border shadow-sm">
            <div className="text-center font-serif text-base" style={{ fontFamily: "'STIX Two Text', 'Cambria Math', serif" }}>
              {formulaData.pasoOrigen.formula}
            </div>
          </div>
          <div className="bg-white dark:bg-black/20 rounded-lg p-3 border cx-border-border shadow-sm">
            <div className="text-center font-serif text-base" style={{ fontFamily: "'STIX Two Text', 'Cambria Math', serif" }}>
              {formulaData.pasoOrigen.valores}
            </div>
          </div>
        </div>

        {/* Paso 2: TEA → destino */}
        <div className="space-y-2">
          <div className="text-[10px] cx-text-accent-primary font-semibold uppercase tracking-wide text-center">{formulaData.pasoDestino.etiqueta}</div>
          <div className="bg-white dark:bg-black/20 rounded-lg p-3 border cx-border-border shadow-sm">
            <div className="text-center font-serif text-base" style={{ fontFamily: "'STIX Two Text', 'Cambria Math', serif" }}>
              {formulaData.pasoDestino.formula}
            </div>
          </div>
          <div className="bg-white dark:bg-black/20 rounded-lg p-3 border cx-border-border shadow-sm">
            <div className="text-center font-serif text-base" style={{ fontFamily: "'STIX Two Text', 'Cambria Math', serif" }}>
              {formulaData.pasoDestino.valores}
            </div>
          </div>
        </div>

        <div className="text-xs cx-text-text-secondary space-y-1.5 border-t cx-border-border pt-3 text-center">
          {formulaData.pasos.map((paso, i) => (
            <p key={i} className="text-center leading-relaxed">{paso}</p>
          ))}
        </div>

        {formulaData.periodic !== '—' && (
          <div className="text-center text-xs cx-text-text-muted mt-1">
            Tasa periódica: {formulaData.periodic}%
          </div>
        )}
      </div>

      {/* Gráfico */}
      <div>
        <div className="flex items-center gap-2 mb-2 flex-wrap">
          <BarChart3 size={16} className="cx-text-accent-primary flex-shrink-0" />
          <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">
            La misma TEA expresada como tasa {tipoDestino} en cada capitalización
          </span>
        </div>
        <div className="cx-bg-surface border cx-border-border rounded-lg p-3" style={{ height: 280, minHeight: 200 }}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData} margin={{ top: 8, right: 8, left: 0, bottom: 48 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="var(--chart-grid)" vertical={false} />
              <XAxis 
                dataKey="temporalidad" 
                tick={{ fontSize: 10, fill: 'var(--chart-axis)' }} 
                angle={-35} 
                textAnchor="end" 
                interval={0} 
              />
              <YAxis 
                tick={{ fontSize: 11, fill: 'var(--chart-axis)' }} 
                tickFormatter={(v) => v.toFixed(2) + '%'} 
              />
              <Tooltip 
                formatter={(v) => v.toFixed(4) + '%'} 
                contentStyle={{ 
                  fontSize: 12, 
                  borderRadius: 12, 
                  background: 'var(--surface)', 
                  color: 'var(--text-primary)', 
                  border: '1px solid var(--border)' 
                }} 
              />
              <Bar dataKey="Tasa equivalente" fill="var(--accent-primary)" radius={[4, 4, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
        <p className="text-xs cx-text-text-muted mt-2 text-center sm:text-left">
          Todas estas tasas generan la misma tasa efectiva anual ({fmtPct(tea * 100)}) — por eso se llaman "equivalentes".
        </p>
      </div>

      {tutorialOn && (
        <TutorialStep 
          step={tutorialSteps[tutorialStep]} 
          total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)} 
        />
      )}
    </div>
  );
}

function fmtPct(n) {
  return n.toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
}

function InteresTab() {
  const [tipo, setTipo] = useState('compuesto');
  const [P, setP] = useState(80000);
  const [tasaNominal, setTasaNominal] = useState(12);
  const [temporalidad, setTemporalidad] = useState('mensual');
  const [n, setN] = useState(10);
  const [anios, setAnios] = useState(3);

  const { dashboardOn, setDashboardOn, tutorialOn, setTutorialOn, discreteOn, setDiscreteOn, tutorialStep, setTutorialStep } = useModes();

  const opcionesTemporalidad = tipo === 'simple' ? TEMPORALIDADES.filter((x) => x.key !== 'continua') : TEMPORALIDADES;
  const esContinua = tipo === 'compuesto' && temporalidad === 'continua';
  const t = getTemporalidad(temporalidad);
  const r = esContinua ? 0 : tasaPeriodica(tasaNominal, temporalidad);

  const cambiarTipo = (nuevoTipo) => {
    setTipo(nuevoTipo);
    if (nuevoTipo === 'simple' && temporalidad === 'continua') setTemporalidad('mensual');
  };

  const resultadoContinuo = useMemo(() => calcularContinuo(P, tasaNominal, anios), [P, tasaNominal, anios]);
  const resultado = useMemo(() => {
    if (tipo === 'simple') return calcularSimple(P, r, n);
    return calcularCompuesto(P, r, n);
  }, [tipo, P, r, n]);

  const chartData = resultado.rows?.map((row) => ({ periodo: row.t, Capital: row.capital, Interés: row.interes })) || [];
  const evolutionData = resultado.rows?.map((row) => ({ mes: row.t, Saldo: row.saldoFinal })) || [];
  const tablaInteres = useMemo(() => sampleSerie(resultado.rows || [], 120), [resultado.rows]);

  const tutorialSteps = [
    { index: 0, titulo: '📈 Interés Simple vs Compuesto', texto: 'Elige el tipo de interés arriba y ajusta el capital, la tasa y el número de periodos.', consejo: 'Con interés simple, la ganancia por periodo siempre es la misma.' },
    { index: 1, titulo: '📋 Tabla de incremento del interés', texto: 'La tabla muestra, periodo a periodo, el saldo inicial, el interés generado ese periodo y el saldo final.', consejo: 'Compara la columna "Interés generado" entre simple y compuesto: en compuesto va creciendo.' },
    { index: 2, titulo: '🧮 Lee el gráfico de barras', texto: 'La barra apilada muestra cuánto del saldo es capital original y cuánto es interés acumulado en cada periodo.', consejo: 'Con interés compuesto, la porción de "interés" crece cada vez más rápido.' },
    { index: 3, titulo: '📊 Activa el Dashboard', texto: 'El panel de control (arriba) te permite mostrar/ocultar el resumen numérico y la vista de matemáticas discretas.', consejo: 'Prueba activar "Matemáticas Discretas" para ver la relación de recurrencia.' },
  ];

  return (
    <div className="space-y-6">
      <ControlPanel 
        dashboardOn={dashboardOn} setDashboardOn={setDashboardOn}
        tutorialOn={tutorialOn} setTutorialOn={setTutorialOn}
        discreteOn={discreteOn} setDiscreteOn={setDiscreteOn}
        onReset={() => { setP(80000); setTasaNominal(12); setTemporalidad('mensual'); setN(10); }}
      />

      {discreteOn && (
        tipo === 'simple' ? (
          <DiscreteMathDisplay
            formula={<><Var>S</Var><Sub>t</Sub> = <Var>S</Var><Sub>t−1</Sub> + <Var>P</Var> · <Var>r</Var></>}
            variables={[{ simbolo: 'Sₜ', desc: 'Saldo en periodo t' }, { simbolo: 'Sₜ₋₁', desc: 'Saldo anterior' }, { simbolo: 'P', desc: 'Capital inicial (constante)' }, { simbolo: 'r', desc: 'Tasa por periodo' }]}
            recurrence="Sₜ = Sₜ₋₁ + P · r"
            explanation="Serie aritmética: el saldo crece sumando la misma cantidad fija cada periodo (interés siempre sobre P, no sobre el saldo)."
            tipo="serie_aritmetica"
          />
        ) : (
          <DiscreteMathDisplay
            formula={<><Var>S</Var><Sub>t</Sub> = <Var>S</Var><Sub>t−1</Sub> · (1 + <Var>r</Var>)</>}
            variables={[{ simbolo: 'Sₜ', desc: 'Saldo en periodo t' }, { simbolo: 'Sₜ₋₁', desc: 'Saldo anterior' }, { simbolo: 'r', desc: 'Tasa por periodo' }]}
            recurrence="Sₜ = Sₜ₋₁ · (1 + r)"
            explanation="Serie geométrica: el interés se calcula sobre el saldo acumulado, así que crece exponencialmente."
            tipo="serie_geometrica"
          />
        )
      )}

      <div className="flex flex-wrap gap-2">
        <PillButton active={tipo === 'simple'} onClick={() => cambiarTipo('simple')}>Interés simple</PillButton>
        <PillButton active={tipo === 'compuesto'} onClick={() => cambiarTipo('compuesto')}>Interés compuesto</PillButton>
      </div>

      <TemaIntro tipo={tipo} sistema={null} />

      <div className="cx-bg-surface p-4 rounded-lg border cx-border-border space-y-4">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <Field label="Capital inicial" value={P} onChange={setP} min={0} step={100} />
          <Field label="Tasa nominal anual" suffix="%" value={tasaNominal} onChange={setTasaNominal} min={0} step={0.1} />
          {esContinua ? (
            <Field label="Número de años" value={anios} onChange={(v) => setAnios(Math.max(0.1, v))} min={0.1} step={0.5} />
          ) : (
            <Field label={`Número de periodos (${t.periodoPlural})`} value={n} onChange={(v) => setN(Math.max(1, Math.round(v)))} min={1} step={1} />
          )}
        </div>
        <CapitalizacionSolapa temporalidad={temporalidad} onChange={setTemporalidad} opciones={opcionesTemporalidad} />
      </div>

      {dashboardOn && (
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          {esContinua ? (
            <>
              <StatCard label="Capital inicial" value={fmt(P)} accent="teal" />
              <StatCard label="Monto final" value={fmt(resultadoContinuo.F)} accent="blue" />
              <StatCard label="Interés generado" value={fmt(resultadoContinuo.interes)} accent="coral" />
            </>
          ) : (
            <>
              <StatCard label="Saldo final" value={fmt(resultado.saldoFinal)} accent="blue" />
              <StatCard label="Interés total" value={fmt(resultado.totalInteres)} accent="coral" />
              <StatCard label="Capital inicial" value={fmt(P)} accent="teal" />
            </>
          )}
        </div>
      )}

      {!esContinua && tablaInteres.length > 0 && (
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <FileText size={16} className="cx-text-accent-primary flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">
              Tabla de incremento del interés {tablaInteres.length < (resultado.rows?.length || 0) ? '(muestreada)' : ''}
            </span>
          </div>
          <div className="border cx-border-border rounded-lg overflow-hidden">
            <div className="overflow-y-auto" style={{ maxHeight: 320 }}>
              <table className="w-full text-xs">
                <thead className="sticky top-0 cx-bg-surface-alt">
                  <tr>
                    <th className="text-left px-3 py-2 font-semibold cx-text-text-muted">{t.periodo.charAt(0).toUpperCase() + t.periodo.slice(1)}</th>
                    <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Saldo inicial</th>
                    <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Interés generado</th>
                    <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Saldo final</th>
                  </tr>
                </thead>
                <tbody>
                  {tablaInteres.map((row) => (
                    <tr key={row.t} className="border-t cx-border-border">
                      <td className="px-3 py-1.5 cx-text-text-secondary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{row.t}</td>
                      <td className="px-3 py-1.5 text-right cx-text-text-secondary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.saldoInicial)}</td>
                      <td className="px-3 py-1.5 text-right cx-text-accent-green-text" style={{ fontFamily: "'JetBrains Mono', monospace" }}>+{fmt(row.interes)}</td>
                      <td className="px-3 py-1.5 text-right cx-text-text-primary font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.saldoFinal)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {!esContinua && chartData.length > 0 && (
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <BarChart3 size={16} className="cx-text-accent-primary flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Composición del saldo por periodo</span>
          </div>
          <StackedBarChart 
            data={chartData} 
            xKey="periodo" 
            barKeys={['Capital', 'Interés']} 
            colors={['var(--accent-green)', 'var(--accent-coral)']}
            label={`Periodo (${t.periodo})`}
          />
          <p className="text-xs cx-text-text-muted mt-2">
            {tipo === 'simple' ? 'El interés simple crece de forma lineal.' : 'El interés compuesto crece de forma exponencial.'}
          </p>
        </div>
      )}

      {!esContinua && evolutionData.length > 0 && (
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <LineChartIcon size={16} className="cx-text-accent-primary flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Evolución del saldo</span>
          </div>
          <LineChartComponent 
            data={evolutionData}
            lines={['Saldo']}
            colors={['var(--accent-primary)']}
            label="Periodo"
          />
        </div>
      )}

      {tutorialOn && (
        <TutorialStep step={tutorialSteps[tutorialStep]} total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)} />
      )}
    </div>
  );
}

          variables={[{ simbolo: 'P', desc: 'Monto del préstamo' }, { simbolo: 'r', desc: 'Tasa por periodo' }, { simbolo: 'n', desc: 'Número de cuotas' }]}

          </div>
          <div className="border cx-border-border rounded-lg overflow-hidden">
            <div className="overflow-y-auto" style={{ maxHeight: 360 }}>
              <table className="w-full text-xs">
                <thead className="sticky top-0 cx-bg-surface-alt">
                  <tr>
                    <th className="text-left px-3 py-2 font-semibold cx-text-text-muted">{t.periodo.charAt(0).toUpperCase() + t.periodo.slice(1)}</th>

                    <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Cuota</th>
                    <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Interés</th>
                    <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Capital</th>
                    <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Saldo final</th>

                <tbody>
                  {tablaAmortizacion.map((row) => (
                    <tr key={row.t} className="border-t cx-border-border">
                      <td className="px-3 py-1.5 cx-text-text-secondary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{row.t}</td>
                      <td className="px-3 py-1.5 text-right cx-text-text-secondary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.saldoInicial)}</td>
                      <td className="px-3 py-1.5 text-right cx-text-text-primary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.pago)}</td>
                      <td className="px-3 py-1.5 text-right cx-text-accent-coral-text" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.interes)}</td>
                      <td className="px-3 py-1.5 text-right cx-text-accent-green-text" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.capital)}</td>
                      <td className="px-3 py-1.5 text-right cx-text-text-primary font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.saldoFinal)}</td>

          </div>

      {chartData.length > 0 && (
        <div>

          </div>
          <StackedBarChart 
            data={chartData} 
            xKey="periodo" 
            barKeys={['Capital', 'Interés']} 
            colors={['var(--accent-green)', 'var(--accent-coral)']}

      {saldoData.length > 0 && (
        <div>

      {tutorialOn && (
        <TutorialStep step={tutorialSteps[tutorialStep]} total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)} />

}

function SimuladorTab() {
  const [objetivo, setObjetivo] = useState(5000);
  const [capacidad, setCapacidad] = useState(250);
  const [tasas, setTasas] = useState({ simple: 5, compuesto: 8, prestamo: 16, tarjeta: 42 });
  const [detalle, setDetalle] = useState(null);

  const { dashboardOn, setDashboardOn, tutorialOn, setTutorialOn, discreteOn, setDiscreteOn, tutorialStep, setTutorialStep } = useModes();

  const resultados = useMemo(() => {
    const alcancia = simularCamino({ tipo: 'alcancia', monto: objetivo, base: capacidad });
    const ahorroSimple = simularCamino({ tipo: 'ahorroSimple', monto: objetivo, base: capacidad, tasaAnual: tasas.simple });
    const ahorroCompuesto = simularCamino({ tipo: 'ahorroCompuesto', monto: objetivo, base: capacidad, tasaAnual: tasas.compuesto });
    const prestamo = simularCamino({ tipo: 'deuda', monto: objetivo, base: capacidad, tasaAnual: tasas.prestamo });
    const tarjeta = simularCamino({ tipo: 'deuda', monto: objetivo, base: capacidad, tasaAnual: tasas.tarjeta });
    return { alcancia, ahorroSimple, ahorroCompuesto, prestamo, tarjeta };
  }, [objetivo, capacidad, tasas]);

  const setTasa = (key) => (e) => setTasas((t) => ({ ...t, [key]: parseFloat(e.target.value) || 0 }));

  const ahorroChart = useMemo(() => {
    const maxM = Math.min(240, Math.max(
      isFinite(resultados.alcancia.meses) ? resultados.alcancia.meses : 0,
      isFinite(resultados.ahorroSimple.meses) ? resultados.ahorroSimple.meses : 0,
      isFinite(resultados.ahorroCompuesto.meses) ? resultados.ahorroCompuesto.meses : 0,
      12
    ));
    const data = [];
    for (let m = 0; m <= maxM; m++) {
      data.push({
        mes: m,
        Alcancía: resultados.alcancia.serie[m]?.saldo ?? resultados.alcancia.serie[resultados.alcancia.serie.length - 1]?.saldo,
        'Ahorro Simple': resultados.ahorroSimple.serie[m]?.saldo,
        'Ahorro Compuesto': resultados.ahorroCompuesto.serie[m]?.saldo,
      });
    }
    return data;
  }, [resultados]);

  const deudaChart = useMemo(() => {
    const maxM = Math.min(240, Math.max(
      isFinite(resultados.prestamo.meses) ? resultados.prestamo.meses : 60,
      isFinite(resultados.tarjeta.meses) ? resultados.tarjeta.meses : 60,
      12
    ));
    const data = [];
    for (let m = 0; m <= maxM; m++) {
      data.push({
        mes: m,
        Préstamo: resultados.prestamo.serie[m]?.saldo ?? 0,
        'Tarjeta Crédito': resultados.tarjeta.serie[m]?.saldo ?? (resultados.tarjeta.nuncaPaga ? objetivo : 0),
      });
    }
    return data;
  }, [resultados, objetivo]);

  const paths = [
    { key: 'alcancia', label: 'Alcancía', icon: Wallet, tipo: 'ahorro', tipoSim: 'alcancia', meses: resultados.alcancia.meses, interes: 0, editable: false, nuncaPaga: false },
    { key: 'simple', label: 'Ahorro Simple', icon: PiggyBank, tipo: 'ahorro', tipoSim: 'ahorroSimple', meses: resultados.ahorroSimple.meses, interes: resultados.ahorroSimple.totalInteres, editable: true, tasaKey: 'simple', nuncaPaga: false },
    { key: 'compuesto', label: 'Ahorro Compuesto', icon: TrendingUp, tipo: 'ahorro', tipoSim: 'ahorroCompuesto', meses: resultados.ahorroCompuesto.meses, interes: resultados.ahorroCompuesto.totalInteres, editable: true, tasaKey: 'compuesto', nuncaPaga: false },
    { key: 'prestamo', label: 'Préstamo', icon: Landmark, tipo: 'deuda', tipoSim: 'deuda', meses: resultados.prestamo.meses, interes: resultados.prestamo.totalInteres, editable: true, tasaKey: 'prestamo', nuncaPaga: resultados.prestamo.nuncaPaga },
    { key: 'tarjeta', label: 'Tarjeta Crédito', icon: CreditCard, tipo: 'deuda', tipoSim: 'deuda', meses: resultados.tarjeta.meses, interes: resultados.tarjeta.totalInteres, editable: true, tasaKey: 'tarjeta', nuncaPaga: resultados.tarjeta.nuncaPaga },
  ];

  // Datos para la tabla y el gráfico del modal "Analiza este destino"
  const detalleResultado = detalle ? resultados[RESULTADOS_KEY_SIMULADOR[detalle.key]] : null;
  const detalleSerieRecortada = useMemo(() => {
    if (!detalleResultado) return [];
    const tope = isFinite(detalleResultado.meses) ? detalleResultado.meses : Math.min(240, detalleResultado.serie.length - 1);
    return detalleResultado.serie.slice(0, tope + 1);
  }, [detalleResultado]);
  const detalleSerieTabla = useMemo(() => sampleSerie(detalleSerieRecortada, 60), [detalleSerieRecortada]);
  const detalleSerieChart = useMemo(() => detalleSerieRecortada.map((s) => ({ mes: s.mes, Saldo: s.saldo })), [detalleSerieRecortada]);

  const tutorialSteps = [
    { index: 0, titulo: '🎯 Simulador de Destinos', texto: 'Ingresa un monto objetivo y cuánto puedes aportar o pagar cada mes; el simulador compara 5 caminos financieros.', consejo: 'Los caminos verdes son ahorro; los rojos son deudas.' },
    { index: 1, titulo: '⚠️ Cuidado con la tarjeta de crédito', texto: 'Si la tasa es muy alta y tu pago mensual es bajo, la tarjeta puede marcar "nunca paga".', consejo: 'Eso significa que el pago no alcanza ni para cubrir el interés generado.' },
    { index: 2, titulo: '📈 Compara los caminos', texto: 'Los gráficos de línea muestran cómo evoluciona cada camino mes a mes hacia tu meta (o hacia cero deuda).', consejo: 'Ajusta la tasa de cada camino para ver el impacto en el tiempo total.' },
  ];

  return (
    <div className="space-y-6">
      <ControlPanel 
        dashboardOn={dashboardOn} setDashboardOn={setDashboardOn}
        tutorialOn={tutorialOn} setTutorialOn={setTutorialOn}
        discreteOn={discreteOn} setDiscreteOn={setDiscreteOn}
        onReset={() => { setObjetivo(5000); setCapacidad(250); setTasas({ simple: 5, compuesto: 8, prestamo: 16, tarjeta: 42 }); }}
      />

      {discreteOn && (
        <DiscreteMathDisplay 
          formula={<><Var>S</Var><Sub>t</Sub> = <Var>S</Var><Sub>t−1</Sub> · (1 + <Var>r</Var>) − <Var>C</Var></>}
          variables={[{ simbolo: 'Sₜ', desc: 'Saldo en periodo t' }, { simbolo: 'r', desc: 'Tasa por periodo' }, { simbolo: 'C', desc: 'Cuota o pago' }]}
          recurrence="Sₜ = Sₜ₋₁ · (1 + r) − C"
          explanation="Motor de todos los cálculos del simulador."
          tipo="recurrencia"
        />
      )}

      {dashboardOn && <SimuladorDashboard paths={paths} objetivo={objetivo} />}

      <div className="rounded-lg cx-bg-accent-primary-bg border cx-border-accent-primary/15 p-4 flex items-start gap-2">
        <Target size={18} className="mt-0.5 flex-shrink-0 cx-text-accent-primary" />
        <p className="text-sm cx-text-text-strong-gray">
          {tutorialOn ? '💡 Tutorial activado.' : 'Ingresa un monto y cuánto puedes aportar o pagar cada mes.'}
        </p>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 cx-bg-surface p-4 rounded-lg border cx-border-border">
        <Field label="Monto objetivo" suffix="$" value={objetivo} onChange={setObjetivo} min={1} step={100} />
        <Field label="Capacidad mensual" suffix="$" value={capacidad} onChange={setCapacidad} min={1} step={10} />
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {paths.map((p) => {
          const Icon = p.icon;
          const isDeuda = p.tipo === 'deuda';
          return (
            <div key={p.key} className={`cx-bg-surface border-2 rounded-lg p-4 flex flex-col gap-3 ${isDeuda ? 'cx-border-accent-coral-border' : 'cx-border-border'}`}>
              <div className="flex items-center gap-2">
                <div className={`p-1.5 rounded-full ${isDeuda ? 'cx-bg-accent-coral-bg cx-text-accent-coral-text' : 'cx-bg-accent-green-bg cx-text-accent-green-text'}`}>
                  <Icon size={16} />
                </div>
                <span className="font-semibold cx-text-text-primary text-sm" style={{ fontFamily: "'Fraunces', sans-serif" }}>{p.label}</span>
              </div>
              {p.editable && (
                <label className="flex items-center gap-2 text-xs cx-text-text-muted">
                  Tasa anual
                  <input type="number" value={tasas[p.tasaKey]} onChange={setTasa(p.tasaKey)} className="w-16 border-2 cx-border-border rounded-lg px-1.5 py-0.5 cx-text-text-primary" style={{ fontFamily: "'JetBrains Mono', monospace" }} />%
                </label>
              )}
              {p.nuncaPaga ? (
                <div className="flex items-start gap-1.5 cx-text-accent-coral-text text-sm cx-bg-accent-coral-bg rounded-lg px-3 py-2">
                  <AlertTriangle size={14} className="mt-0.5 flex-shrink-0" />
                  Tu pago mensual no cubre ni el interés: la deuda nunca se termina de pagar.
                </div>
              ) : (
                <>
                  <div>
                    <div className="text-[11px] uppercase tracking-wide cx-text-text-muted">{isDeuda ? 'Tiempo para pagarla' : 'Tiempo para lograrlo'}</div>
                    <div className="text-lg" style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{monthsToYears(p.meses)}</div>
                  </div>
                  <div>
                    <div className="text-[11px] uppercase tracking-wide cx-text-text-muted">{isDeuda ? 'Interés total pagado' : 'Interés total ganado'}</div>
                    <div className={`text-sm font-semibold ${isDeuda ? 'cx-text-accent-coral-text' : 'cx-text-accent-green-text'}`}>{fmt(p.interes)}</div>
                  </div>
                </>
              )}
              <button onClick={() => setDetalle(p)} className="flex items-center justify-center gap-1.5 text-xs font-semibold py-2 rounded-md text-white hover:opacity-90 transition-opacity" style={{ background: 'var(--accent-primary)' }}>
                Analizar este destino <RotateCcw size={12} />
              </button>
            </div>
          );
        })}
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <LineChartIcon size={16} className="cx-text-accent-green-text flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Caminos de ahorro</span>
          </div>
          <LineChartComponent 
            data={ahorroChart}
            lines={['Alcancía', 'Ahorro Simple', 'Ahorro Compuesto']}
            colors={['var(--chart-axis)', 'var(--accent-primary)', 'var(--accent-green)']}
            label="Meses"
            referenceLine={objetivo}
          />
        </div>
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <LineChartIcon size={16} className="cx-text-accent-coral-text flex-shrink-0" />
            <span className="text-xs font-semibold cx-text-text-muted uppercase tracking-wide">Caminos de deuda</span>
          </div>
          <LineChartComponent 
            data={deudaChart}
            lines={['Préstamo', 'Tarjeta Crédito']}
            colors={['var(--accent-primary)', 'var(--accent-coral)']}
            label="Meses"
          />
        </div>
      </div>

      {detalle && (
        <Modal onClose={() => setDetalle(null)} size="xwide">
          <div className="flex items-center gap-2 cx-text-accent-primary-text font-semibold text-sm mb-1">
            <detalle.icon size={16} /> {detalle.label}
          </div>
          <h3 className="text-2xl cx-text-text-primary mb-2" style={{ fontFamily: "'Fraunces', sans-serif", fontWeight: 600 }}>Analiza este destino</h3>
          <p className="text-sm cx-text-text-secondary mb-4">
            {detalle.tipo === 'deuda' ? 'Prueba qué pasa si abonas un poco más cada mes.' : 'Prueba qué pasa si aportas un poco más cada mes.'}
          </p>

          {detalleResultado?.nuncaPaga ? (
            <div className="flex items-start gap-2 cx-text-accent-coral-text text-sm cx-bg-accent-coral-bg rounded-lg px-3 py-2.5 mb-4">
              <AlertTriangle size={15} className="mt-0.5 flex-shrink-0" />
              Con la tasa y el pago actuales, esta deuda nunca se termina de pagar. Ajusta la tasa o el pago mensual (arriba en la tarjeta) para ver una proyección.
            </div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
              <div>
                <div className="text-[11px] uppercase tracking-wide cx-text-text-muted font-semibold mb-1.5">
                  Tabla mes a mes {detalleSerieTabla.length < detalleSerieRecortada.length ? '(muestreada)' : ''}
                </div>
                <div className="border cx-border-border rounded-lg overflow-hidden">
                  <div className="overflow-y-auto" style={{ maxHeight: 320 }}>
                    <table className="w-full text-xs">
                      <thead className="sticky top-0 cx-bg-surface-alt">
                        <tr>
                          <th className="text-left px-3 py-2 font-semibold cx-text-text-muted">Mes</th>
                          <th className="text-right px-3 py-2 font-semibold cx-text-text-muted">Saldo</th>
                        </tr>
                      </thead>
                      <tbody>
                        {detalleSerieTabla.map((row) => (
                          <tr key={row.mes} className="border-t cx-border-border">
                            <td className="px-3 py-1.5 cx-text-text-secondary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{row.mes}</td>
                            <td className="px-3 py-1.5 text-right cx-text-text-primary" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmt(row.saldo)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
              <div>
                <div className="text-[11px] uppercase tracking-wide cx-text-text-muted font-semibold mb-1.5">Evolución del saldo</div>
                <LineChartComponent
                  data={detalleSerieChart}
                  lines={['Saldo']}
                  colors={[detalle.tipo === 'deuda' ? 'var(--accent-coral)' : 'var(--accent-green)']}
                  label="Meses"
                  height={320}
                  referenceLine={detalle.tipo !== 'deuda' ? objetivo : undefined}
                />
              </div>
            </div>
          )}

          <button onClick={() => setDetalle(null)} className="w-full py-2 rounded-lg text-sm font-semibold text-white" style={{ background: 'var(--accent-primary)' }}>Cerrar</button>
        </Modal>
      )}

      {tutorialOn && (
        <TutorialStep step={tutorialSteps[tutorialStep]} total={tutorialSteps.length} 
          onNext={() => setTutorialStep(Math.min(tutorialSteps.length - 1, tutorialStep + 1))}
          onPrev={() => setTutorialStep(Math.max(0, tutorialStep - 1))}
          onClose={() => setTutorialOn(false)} />
      )}
    </div>
  );
}
